<script id="signal-data" type="application/json">{"project":{"spec":1,"id":"clearwater","title":"Clearwater Coffee","question":"Which steeping time and coffee dose bring extraction closest to our target, with a repeatable process?","response":{"id":"extraction","name":"Extraction yield","unit":"%","goal":"target","target":19},"factors":[{"id":"steep","name":"Steeping time","type":"number","unit":"h","levels":[8,16]},{"id":"dose","name":"Coffee dose","type":"number","unit":"g/L","levels":[60,90]}],"protocol":{"unit":"One separately prepared brewing jar. Repeated readings from the same jar are not independent runs.","randomization":"Prepare separate jars in the randomized order within the water batch. Keep the scheduled midpoint controls at the beginning, middle and end.","analysisPlan":"Use the planned time, dose and interaction terms. Examine residuals and repeatability. Compare two chosen settings, then collect fresh independent confirmation jars.","steps":["Label every jar with its run id before preparation. Keep the coffee lot, water batch, grind and filtering procedure consistent.","Set the planned coffee dose and steeping duration for that jar. Record any preparation departure in its note.","Use the same calibrated measurement procedure for each jar. Record extraction yield in percent; keep raw instrument observations separately.","Enter one final response per independently prepared jar. Review the residual and run-order plots before selecting the next comparison."],"notes":"Example protocol. Adapt the procedure to your actual equipment before approving it. Supply measured responses from your own independent runs."},"approved":false,"design":{"seed":"clearwater-01","replicates":3,"blocks":["Water batch A"],"controls":3},"model":{"terms":["steep","dose","steep:dose"],"blocks":false,"confidence":0.95},"phases":[{"id":"initial","label":"Initial experiment","kind":"plan","reason":"Full factorial, independent repetitions and complete blocks.","seed":"clearwater-01"}],"runs":[{"id":"r0001","order":1,"phase":"initial","block":"Water batch A","kind":"control","settings":{"steep":12,"dose":75}},{"id":"r0002","order":2,"phase":"initial","block":"Water batch A","kind":"factorial","settings":{"steep":8,"dose":60}},{"id":"r0003","order":3,"phase":"initial","block":"Water batch A","kind":"factorial","settings":{"steep":8,"dose":90}},{"id":"r0004","order":4,"phase":"initial","block":"Water batch A","kind":"factorial","settings":{"steep":16,"dose":60}},{"id":"r0005","order":5,"phase":"initial","block":"Water batch A","kind":"factorial","settings":{"steep":8,"dose":90}},{"id":"r0006","order":6,"phase":"initial","block":"Water batch A","kind":"factorial","settings":{"steep":16,"dose":90}},{"id":"r0007","order":7,"phase":"initial","block":"Water batch A","kind":"factorial","settings":{"steep":16,"dose":60}},{"id":"r0008","order":8,"phase":"initial","block":"Water batch A","kind":"control","settings":{"steep":12,"dose":75}},{"id":"r0009","order":9,"phase":"initial","block":"Water batch A","kind":"factorial","settings":{"steep":16,"dose":90}},{"id":"r0010","order":10,"phase":"initial","block":"Water batch A","kind":"factorial","settings":{"steep":8,"dose":90}},{"id":"r0011","order":11,"phase":"initial","block":"Water batch A","kind":"factorial","settings":{"steep":8,"dose":60}},{"id":"r0012","order":12,"phase":"initial","block":"Water batch A","kind":"factorial","settings":{"steep":16,"dose":60}},{"id":"r0013","order":13,"phase":"initial","block":"Water batch A","kind":"factorial","settings":{"steep":16,"dose":90}},{"id":"r0014","order":14,"phase":"initial","block":"Water batch A","kind":"factorial","settings":{"steep":8,"dose":60}},{"id":"r0015","order":15,"phase":"initial","block":"Water batch A","kind":"control","settings":{"steep":12,"dose":75}}],"measurements":[],"sources":[],"audit":[{"id":"starter-design","at":"2026-09-20T00:00:00.000Z","action":"design","reason":"Generated a randomized run sheet; control positions are scheduled.","previous":{"runs":[],"phases":[]},"runs":15}],"conclusion":"","revision":"4309e41bb937fd8b393b8f26ba8a8f3667e9b865ada79caac48cc166544545f4"},"assets":{"reproduce":"\"\"\"Recompute the delivered primary OLS analysis using independent Python libraries.\n\nRun in the delivery directory. This does not infer experimental validity from a model fit.\n\"\"\"\nimport json\nfrom pathlib import Path\nimport numpy as np\nimport scipy.stats as stats\nimport statsmodels.api as sm\n\nroot = Path(__file__).resolve().parent\nanalysis = json.loads((root / \"analysis.json\").read_text())\nif not analysis[\"ok\"]:\n    raise SystemExit(\"No estimable primary model: \" + analysis[\"issue\"])\nx = np.asarray(analysis[\"matrix\"][\"X\"], dtype=float)\ny = np.asarray(analysis[\"matrix\"][\"y\"], dtype=float)\nresult = sm.OLS(y, x, missing=\"raise\", hasconst=True).fit()\nalpha = 1 - analysis[\"model\"][\"confidence\"]\ninfluence = result.get_influence()\nreport = {\n    \"method\": \"statsmodels OLS, exact delivered design matrix; conventional covariance\",\n    \"run_ids\": analysis[\"matrix\"][\"runIds\"],\n    \"n\": int(result.nobs), \"df\": int(result.df_resid),\n    \"coefficients\": result.params.tolist(), \"se\": result.bse.tolist(),\n    \"intervals\": result.conf_int(alpha=alpha).tolist(),\n    \"covariance\": result.cov_params().tolist(),\n    \"rmse\": float(np.sqrt(result.mse_resid)),\n    \"fitted\": result.fittedvalues.tolist(), \"residuals\": result.resid.tolist(),\n    \"leverage\": influence.hat_matrix_diag.tolist(),\n    \"studentized\": influence.resid_studentized_internal.tolist(),\n    \"cook\": influence.cooks_distance[0].tolist(),\n    \"critical\": float(stats.t.ppf(1 - alpha / 2, result.df_resid)),\n}\nnp.testing.assert_allclose(result.params, analysis[\"beta\"], rtol=1e-8, atol=1e-8)\nnp.testing.assert_allclose(result.cov_params(), analysis[\"covariance\"], rtol=1e-8, atol=1e-8)\nnp.testing.assert_allclose(result.fittedvalues, [r[\"fitted\"] for r in analysis[\"residuals\"]], rtol=1e-8, atol=1e-8)\nnp.testing.assert_allclose(influence.hat_matrix_diag, [r[\"leverage\"] for r in analysis[\"residuals\"]], rtol=1e-8, atol=1e-8)\nif analysis[\"inferential\"]:\n    np.testing.assert_allclose(result.conf_int(alpha=alpha), [c[\"ci\"] for c in analysis[\"coefficients\"]], rtol=1e-7, atol=1e-7)\n    np.testing.assert_allclose(influence.cooks_distance[0], [r[\"cook\"] for r in analysis[\"residuals\"]], rtol=1e-7, atol=1e-7)\n\nproject = json.loads((root / \"project.signal.json\").read_text())\nconfirmation_checks = []\nfor phase in project[\"phases\"]:\n    if phase[\"kind\"] != \"confirmation\":\n        continue\n    snapshot = phase[\"snapshot\"]\n    old_x = np.asarray(snapshot[\"matrix\"][\"X\"], dtype=float)\n    old_y = np.asarray(snapshot[\"matrix\"][\"y\"], dtype=float)\n    frozen = sm.OLS(old_y, old_x, missing=\"raise\", hasconst=True).fit()\n    np.testing.assert_allclose(frozen.params, [c[\"value\"] for c in snapshot[\"coefficients\"]], rtol=1e-8, atol=1e-8)\n    for point in snapshot[\"predictions\"]:\n        prediction = frozen.get_prediction(np.asarray([point[\"x\"]])).summary_frame(alpha=1-snapshot[\"model\"][\"confidence\"])\n        np.testing.assert_allclose(float(prediction[\"mean\"].iloc[0]), point[\"mean\"], rtol=1e-8, atol=1e-8)\n        np.testing.assert_allclose(prediction[[\"mean_ci_lower\", \"mean_ci_upper\"]].iloc[0], point[\"meanCI\"], rtol=1e-7, atol=1e-7)\n        np.testing.assert_allclose(prediction[[\"obs_ci_lower\", \"obs_ci_upper\"]].iloc[0], point[\"predictionCI\"], rtol=1e-7, atol=1e-7)\n    confirmation_checks.append({\"phase\": phase[\"id\"], \"predictions\": len(snapshot[\"predictions\"]), \"training_revision\": snapshot[\"trainingRevision\"]})\nreport[\"frozen_confirmation_checks\"] = confirmation_checks\n\ndef clean(value):\n    if isinstance(value, float) and not np.isfinite(value):\n        return None\n    if isinstance(value, list):\n        return [clean(v) for v in value]\n    if isinsta
