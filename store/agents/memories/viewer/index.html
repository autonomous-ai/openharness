<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="memories-token" content="__MEMORIES_TOKEN__">
  <meta name="memories-instance" content="__MEMORIES_INSTANCE__">
  <title>Memories</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="self.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true">◉</span><h1>memories</h1><span id="live" class="live" role="status"></span></div>
    <label class="prompt"><span class="caret" aria-hidden="true">❯</span>
      <input id="q" type="search" placeholder="search memories and sessions" aria-label="Search memories and sessions" autocomplete="off" spellcheck="false" autofocus>
      <span id="count" class="count"></span>
    </label>
    <div id="switch" class="switch" hidden>
      <span class="switch-name" id="switch-name">About You in your agents</span>
      <button id="switch-button" type="button" role="switch" aria-checked="false" aria-labelledby="switch-name"><span class="knob"></span><span id="switch-word">OFF</span></button>
      <span id="switch-detail" class="switch-detail"></span>
    </div>
  </header>
  <div id="switch-problem" class="switch-problem" role="alert" hidden></div>
  <main id="stage" class="stage" aria-label="Sense of Self"></main>
  <script type="module" src="app.js"></script>
</body>
</html>
