    <rect x="29" y="22" width="3" height="20" rx="1.5"/>
    <rect x="35" y="16" width="3" height="32" rx="1.5"/>
    <rect x="41" y="24" width="3" height="16" rx="1.5"/>
    <rect x="47" y="28" width="3" height="8" rx="1.5"/>
