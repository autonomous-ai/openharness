<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="hps-token" content="__HPS_TOKEN__">
  <title>Harness Monitor · your fleet</title>
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="app">
    <header class="bar">
      <div class="identity">
        <span class="mark" aria-hidden="true"></span>
        <h1>Harness Monitor</h1>
        <span class="where" id="where">reading the fleet…</span>
      </div>
      <div class="gauges" id="gauges" aria-live="polite"></div>
      <div class="tools">
        <div class="segmented" role="tablist" aria-label="View">
          <button type="button" id="view-lanes" role="tab" aria-selected="true" data-view="lanes">Lanes</button>
          <button type="button" id="view-table" role="tab" aria-selected="false" data-view="table">Table</button>
        </div>
        <div class="filter">
          <span aria-hidden="true">/</span>
          <input id="filter" type="search" placeholder="filter by name, project, engine" autocomplete="off" spellcheck="false" aria-label="Filter harnesses">
        </div>
        <button type="button" class="ghost toggle" id="show-all" aria-pressed="false" title="Also show what the policy hides: idle past the hide line, and harnesses whose pane is gone">show all</button>
        <button type="button" class="ghost" id="refresh" title="Refresh now">↻</button>
      </div>
    </header>

    <section class="view" id="lanes-view" aria-label="The lanes">
      <div class="lanes-head">
        <div class="axis-label">PROJECT</div>
        <div class="axis" id="axis">
          <div class="rule" id="rule-pause" data-rule="pause" tabindex="0" role="slider" aria-label="Pause after" aria-valuetext="4h"><span class="rule-grip"></span><span class="rule-tag">pause</span></div>
          <div class="rule" id="rule-hide" data-rule="hide" tabindex="0" role="slider" aria-label="Hide after" aria-valuetext="14d"><span class="rule-grip"></span><span class="rule-tag">hide</span></div>
        </div>
      </div>
      <div class="lanes" id="lane-list"></div>
      <div class="lanes-empty" id="lanes-empty" hidden>
        <p class="big">Nothing is running here yet.</p>
        <p>Ask the agent beside this pane to show your fleet, or open a harness and come back.</p>
      </div>
    </section>

    <section class="view" id="table" hidden aria-label="The table">
      <div class="grid" id="grid" role="grid" tabindex="0"></div>
    </section>

    <div class="policybar" id="policybar" hidden>
      <span class="policy-preview" id="policy-preview"></span>
      <button type="button" class="primary" id="policy-save">Save policy</button>
      <button type="button" class="ghost" id="policy-reset">Reset</button>
    </div>

    <footer class="statusbar" id="statusbar">
      <span id="status-left" class="mono"></span>
      <span id="status-actions" class="actions" hidden></span>
      <span id="status-right" class="keys mono"></span>
    </footer>

    <aside class="inspector" id="inspector" hidden aria-label="Harness details"></aside>
    <div class="toast" id="toast" role="status" hidden></div>
  </div>
</body>
</html>
