[package]
name = "harness-pty"
version = "0.1.0"
edition = "2024"
default-run = "harness-pty"

# The host, the windowless starter install.ps1 puts in %USERPROFILE%\.harness\bin (src/launcher.rs), and the
# `harness` command beside it (src/command.rs).
[[bin]]
name = "harness-pty"
path = "src/main.rs"

[[bin]]
name = "harness-launch"
path = "src/bin/harness-launch.rs"

[[bin]]
name = "harness"
path = "src/bin/harness.rs"

# Named Harness.exe only when packaged: Harness and harness collide on Windows/macOS.
[[bin]]
name = "harness-desktop-launcher"
path = "src/bin/desktop-launcher.rs"

[dependencies]
alacritty_terminal = "0.26.0"
harness-term = { path = "../term" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
polling = "3"
log = "0.4"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Com", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Wdk_System_Threading"] }

# Its own stand-in app, so this integration executable supplies main.
[[test]]
name = "desktop_launch"
harness = false

[[test]]
name = "desktop_install"
harness = false

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
alacritty_terminal = { path = "../tui/vendor/alacritty_terminal" }
vte = { path = "../tui/vendor/vte" }
