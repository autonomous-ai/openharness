name: Release Harness Device
run-name: Harness Device ${{ inputs.publish && 'release' || 'candidate' }} ${{ inputs.version }} (${{ inputs.platforms }})

# Started by `make release-device` only (device-app/RELEASE.md): on the tag v<version>_device it just pushed, with
# publish, or on main without it (--prepare). Neither a commit nor a tag starts it.
#
# The build's code (crates' build scripts, npm packages) runs before any secret exists. `build` holds the Apple and
# updater secrets, and `build-linux` the updater key, only in the steps after `Compile`, on the same runner (code that
# means harm could leave something for a later step). Windows compiles in `build-windows`, with no secret and no
# identity, and is signed in `sign-windows`, which compiles and installs nothing: the Tauri CLI it runs comes from
# `tauri-cli-windows`, where no app code runs, and the Windows sums publish checks are taken there too. Only
# `sign-windows` and `publish` may mint an OIDC token, and neither runs the build's code. Which credential each token
# gets is the identity providers' to decide: Azure's federated credential trusts the `release` environment, which only
# `sign-windows` is in; GCP's workload identity provider must refuse that environment's subject.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (X.Y.Z)'
        required: true
      publish:
        description: 'Publish (run on the tag v<version>_device)'
        type: boolean
        default: false
      # Temporary: the first Windows and Linux release makes `all` the only behavior and removes this input, here and in
      # release-device.sh.
      platforms:
        description: 'Platforms: macos, or all for Windows and Linux too'
        type: choice
        options: [macos, all]
        default: macos

permissions:
  contents: read

concurrency:
  group: device-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # A wrong ref, a commit not on main or a version not X.Y.Z fails here in seconds, before any build.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ref.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commits only, not their trees: merge-base --is-ancestor walks commits.
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: /device-app/scripts/
          sparse-checkout-cone-mode: false

      # Only main may be prepared and only v<version>_device published, and the commit must be on main: the repository
      # is public, so a signed build of unreviewed code must never exist, even as a run artifact.
      - id: ref
        name: Check the ref, the commit and the version
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
          PUBLISH: ${{ inputs.publish }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --filter=tree:0 origin +refs/heads/main:refs/remotes/origin/main
          python3 device-app/scripts/device-manifest.py ref "$VERSION" "$REF" "$PUBLISH" "$COMMIT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The tag's message becomes the manifest's notes, so a tag without one stops here, not after the build.
      - name: Check the tag carries the release notes
        if: ${{ inputs.publish }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Checkout leaves a pushed annotated tag lightweight; fetch the tag object itself.
          git fetch --depth=1 --force origin tag "$REF_NAME"
          if [[ "$(git cat-file -t "refs/tags/$REF_NAME")" != tag ]]; then
            echo "::error::$REF_NAME is not an annotated tag: its message is the release notes. Tag with make release-device"
            exit 1
          fi
          if ! git tag -l --format='%(contents)' "$REF_NAME" | grep -q '[^[:space:]]'; then
            echo "::error::$REF_NAME has an empty message: it is the release notes. Tag with make release-device"
            exit 1
          fi

  build:
    needs: version
    runs-on: macos-15
    # The Tauri CLI's install takes about 8 minutes, then two notarizations: the app by Tauri, the dmg below.
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing in the job needs the token, and the build runs third-party code.
          persist-credentials: false
          # Cargo lists the package's files through git, which reads every .gitignore up to the root.
          sparse-checkout: |
            /device-app/
            /.gitignore
            /.github/actions/macos-signing/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2

      - name: Install the build tools
        run: bash device-app/scripts/release-setup.sh

      # Before any secret or the keychain exists: this step runs the crates' build scripts and the UI's npm packages.
      - name: Compile
        run: bash device-app/scripts/release-build.sh compile "$VERSION"

      # The throwaway keychain with the Developer ID certificate and the `harness-notarize` profile; it sets
      # KEYCHAIN_PATH.
      - uses: ./.github/actions/macos-signing
        with:
          certificate-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          apple-app-password: ${{ secrets.APPLE_APP_PASSWORD }}

      # Only the Tauri CLI runs here, no build code: it signs the app and the dmg, notarizes and staples the app, and
      # signs the update archive.
      - name: Bundle and sign
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          bash device-app/scripts/release-build.sh bundle "$VERSION" "$RUNNER_TEMP/out"

      # Tauri does not notarize the dmg, and the dmg is what a person downloads and Gatekeeper checks.
      - name: Notarize and staple the dmg
        run: |
          set -euo pipefail
          dmg="$RUNNER_TEMP/out/Harness-Device.dmg"
          # --wait exits 0 on any final status, Invalid too, so the verdict is read from the answer. A submit that fails
          # outright must not end the step before its answer is printed and named below.
          result="$(xcrun notarytool submit "$dmg" --keychain-profile harness-notarize --wait --output-format json)" || true
          echo "$result"
          field() {
            printf '%s' "$result" | python3 -c 'import json, sys; print(json.load(sys.stdin).get(sys.argv[1], ""))' "$1" 2>/dev/null || true
          }
          status="$(field status)"
          if [[ "$status" != Accepted ]]; then
            echo "::error::Apple did not accept the dmg (status: ${status:-no answer})"
            id="$(field id)"
            if [[ -n "$id" ]]; then
              xcrun notarytool log "$id" --keychain-profile harness-notarize || true
            fi
            exit 1
          fi
          # A ticket just issued can take minutes to be served, and Apple's connection drops even after Accepted:
          # Desktop's bounded backoff (desktop/scripts/upload-desktop.sh), six tries over 465 s.
          for delay in 15 30 60 120 240 0; do
            xcrun stapler staple "$dmg" && break
            if [[ $delay -eq 0 ]]; then
              echo "::error::Could not staple the dmg's notarization ticket after 6 tries: Re-run failed jobs"
              exit 1
            fi
            echo "Stapling the dmg failed; trying again in ${delay}s"
            sleep "$delay"
          done

      # Against the committed key, the one every installed app checks updates with, so a signing secret that does not
      # match it fails here, before anything is published.
      - name: Check the build
        run: |
          set -euo pipefail
          PUBKEY="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["plugins"]["updater"]["pubkey"])' device-app/src-tauri/tauri.conf.json)"
          bash device-app/scripts/release-check.sh "$RUNNER_TEMP/out" "$VERSION" "$PUBKEY" --notarized

      # `publish` refuses files that differ from these, so what it uploads is what was checked here.
      - name: Record the checksums
        run: python3 device-app/scripts/device-manifest.py sums --dir "$RUNNER_TEMP/out" --out "$RUNNER_TEMP/out/sums.json"

      - uses: actions/upload-artifact@v4
        with:
          name: harness-device-${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/out
          retention-days: 7
          if-no-files-found: error

      # The certificate's private key must not outlive the job, should the runner ever be reused.
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true

  # The Tauri CLI sign-windows runs, made where no app code runs: the app's code is not checked out, and a crate's build
  # script or an npm package that could replace a CLI on a runner never runs here. No secret and no identity.
  tauri-cli-windows:
    needs: version
    if: inputs.platforms == 'all'
    runs-on: windows-latest
    # The Tauri CLI's install takes about 10 minutes on Windows.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /device-app/scripts/
          sparse-checkout-cone-mode: false

      - name: Install the Tauri CLI
        run: bash device-app/scripts/release-setup.sh tauri-cli

      - name: Take the Tauri CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path tauri | Out-Null
          Copy-Item -LiteralPath (Get-Command cargo-tauri).Source -Destination tauri

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-cli-windows
          path: tauri
          retention-days: 1
          if-no-files-found: error

  # Windows compiles here, with no secret and no identity: no environment, no id-token. Both arches build on x64, as
  # the signing action does not run on Windows Arm.
  build-windows:
    needs: version
    if: inputs.platforms == 'all'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DEVICE_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      # GitHub's Windows images set core.autocrlf: the exe embeds the UI built from these files, so it builds from the
      # committed bytes, as on macOS and Linux.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          # Nothing in the job needs the token, and the build runs third-party code.
          persist-credentials: false
          # Cargo lists the package's files through git, which reads every .gitignore up to the root.
          sparse-checkout: |
            /device-app/
            /.gitignore
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2

      - name: Install the build tools
        run: bash device-app/scripts/release-setup.sh

      - name: Compile
        run: bash device-app/scripts/release-build.sh compile "$VERSION"

      # In a folder of its own, so the artifact holds the exe and none of the folders above it.
      - name: Take the exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path unsigned | Out-Null
          Copy-Item -LiteralPath "device-app/src-tauri/target/$env:DEVICE_TARGET/release/harness-device.exe" -Destination unsigned

      - uses: actions/upload-artifact@v4
        with:
          name: device-windows-${{ matrix.arch }}-unsigned
          path: unsigned
          retention-days: 1
          if-no-files-found: error

  # Authenticode through Azure Artifact Signing (docs/windows-code-signing.md), always: Smart App Control blocks an
  # unsigned program. This job's OIDC identity is the signing credential, and an identity is the whole job's, so no
  # build script or package runs here. The app's exe is signed before NSIS packs it, the installer after, and the
  # update signature last, so it covers the bytes that ship.
  sign-windows:
    needs: [version, tauri-cli-windows, build-windows]
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /device-app/
            /.gitignore
            /.github/actions/windows-signing/
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          pattern: device-windows-*-unsigned
          path: unsigned

      - uses: actions/download-artifact@v4
        with:
          name: tauri-cli-windows
          path: tauri

      # Each exe goes in a folder of its own: they share a name, and the signing action signs every unsigned program
      # under the folder it is given.
      - name: Take the Tauri CLI and the exes
        run: |
          set -euo pipefail
          mkdir sign
          cygpath -w "$PWD/tauri" >>"$GITHUB_PATH"
          for arch in x64 arm64; do
            mkdir "sign/$arch"
            mv "unsigned/device-windows-$arch-unsigned/harness-device.exe" "sign/$arch/"
          done

      - name: Sign the exes
        uses: ./.github/actions/windows-signing
        with:
          path: sign
          publisher: ${{ vars.WINDOWS_SIGNING_PUBLISHER || 'AUTONOMOUS INC.' }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          account: ${{ vars.SIGNING_ACCOUNT }}
          profile: ${{ vars.SIGNING_PROFILE }}

      # Only the Tauri CLI runs here, with no secret: each signed exe goes back where the build left it, and NSIS packs
      # it.
      - name: Bundle
        run: |
          set -euo pipefail
          for pair in x64:x86_64-pc-windows-msvc arm64:aarch64-pc-windows-msvc; do
            arch="${pair%%:*}" target="${pair#*:}"
            release="device-app/src-tauri/target/$target/release"
            mkdir -p "$release"
            mv "sign/$arch/harness-device.exe" "$release/"
            DEVICE_TARGET="$target" bash device-app/scripts/release-build.sh bundle "$VERSION" "bundle/$arch"
          done
          mkdir out
          mv bundle/x64/* bundle/arm64/* out/

      - name: Sign the installers
        uses: ./.github/actions/windows-signing
        with:
          path: out
          publisher: ${{ vars.WINDOWS_SIGNING_PUBLISHER || 'AUTONOMOUS INC.' }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          account: ${{ vars.SIGNING_ACCOUNT }}
          profile: ${{ vars.SIGNING_PROFILE }}

      # The only step that holds the updater key, after Authenticode wrote the installers' last bytes.
      - name: Sign the updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash device-app/scripts/release-build.sh sign-update "$VERSION" out

      # Here, as the files are made: `publish` refuses files that differ from these. Windows runners have python, not
      # python3.
      - name: Record the checksums
        run: python device-app/scripts/device-manifest.py sums --dir out --part windows --out out/sums.json

      - uses: actions/upload-artifact@v4
        with:
          name: harness-device-${{ needs.version.outputs.version }}-windows
          path: out
          retention-days: 7
          if-no-files-found: error

  # Checks what sign-windows made, with no identity and no secret, and hands nothing on: publish takes sign-windows's
  # artifact and its sums.
  check-windows:
    needs: [version, sign-windows]
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      # GitHub's Windows images set core.autocrlf, and the sed below reads tauri.conf.json's pubkey line up to its end:
      # a CR there would match nothing.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /device-app/
            /.gitignore
          sparse-checkout-cone-mode: false

      # The checks need minisign alone: nothing is built here.
      - name: Install minisign
        run: bash device-app/scripts/release-setup.sh minisign

      - uses: actions/download-artifact@v4
        with:
          name: harness-device-${{ needs.version.outputs.version }}-windows
          path: out

      # Against the committed key, as on macOS. sed, not Python, reads it: Python's print ends its line with CRLF
      # here, and bash keeps the CR.
      - name: Check the build
        run: |
          set -euo pipefail
          PUBKEY="$(sed -n 's/^ *"pubkey": *"\([^"]*\)",*$/\1/p' device-app/src-tauri/tauri.conf.json)"
          bash device-app/scripts/release-check.sh out "$VERSION" "$PUBKEY" --signed

  build-linux:
    needs: version
    if: inputs.platforms == 'all'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Desktop's runners (release-desktop.yml): an AppImage carries the libraries of the machine that bundled it,
          # so each arch builds on its own host, on the oldest Ubuntu Desktop supports.
          - { runner: ubuntu-22.04, arch: x64 }
          - { runner: ubuntu-22.04-arm, arch: arm64 }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing in the job needs the token, and the build runs third-party code.
          persist-credentials: false
          # Cargo lists the package's files through git, which reads every .gitignore up to the root. release-setup.sh
          # installs Tauri's packages with apt-install.sh.
          sparse-checkout: |
            /device-app/
            /.gitignore
            /scripts/apt-install.sh
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2

      - name: Install the build tools
        run: bash device-app/scripts/release-setup.sh

      # Before any secret exists: this step runs the crates' build scripts and the UI's npm packages.
      - name: Compile
        run: bash device-app/scripts/release-build.sh compile "$VERSION"

      # With no secret: Tauri's AppImage bundler downloads and runs linuxdeploy and its plugins, unpinned.
      - name: Bundle
        run: bash device-app/scripts/release-build.sh bundle "$VERSION" "$RUNNER_TEMP/out"

      # The only step that holds the updater key: only the Tauri CLI's signer runs here.
      - name: Sign the update
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash device-app/scripts/release-build.sh sign-update "$VERSION" "$RUNNER_TEMP/out"

      # Against the committed key, as on macOS.
      - name: Check the build
        run: |
          set -euo pipefail
          PUBKEY="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["plugins"]["updater"]["pubkey"])' device-app/src-tauri/tauri.conf.json)"
          bash device-app/scripts/release-check.sh "$RUNNER_TEMP/out" "$VERSION" "$PUBKEY"

      - name: Record the checksums
        run: python3 device-app/scripts/device-manifest.py sums --dir "$RUNNER_TEMP/out" --part "linux-$ARCH" --out "$RUNNER_TEMP/out/sums.json"

      - uses: actions/upload-artifact@v4
        with:
          name: harness-device-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/out
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [version, build, check-windows, build-linux]
    # With macos only the macOS build is waited for; with all every build must pass, so the manifest never names a
    # platform whose build failed. !cancelled(), because the Windows and Linux jobs are skipped for macos.
    if: >-
      ${{ !cancelled() && inputs.publish && needs.build.result == 'success' && (inputs.platforms == 'macos' ||
      (needs.check-windows.result == 'success' && needs.build-linux.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PLATFORMS: ${{ inputs.platforms }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /device-app/scripts/
            /.github/actions/setup-gcloud/
          sparse-checkout-cone-mode: false

      # Each build's artifact in a folder of its own: each job recorded the sums of its own part.
      - uses: actions/download-artifact@v4
        with:
          pattern: harness-device-${{ needs.version.outputs.version }}*
          path: parts

      - name: Check the files are the ones each build checked
        run: |
          set -euo pipefail
          parts=(macos)
          if [[ "$PLATFORMS" == all ]]; then
            parts+=(windows linux-x64 linux-arm64)
          fi
          mkdir out
          for part in "${parts[@]}"; do
            # The macOS artifact keeps the name it had before Windows and Linux.
            folder="parts/harness-device-$VERSION"
            if [[ "$part" != macos ]]; then
              folder+="-$part"
            fi
            python3 device-app/scripts/device-manifest.py sums --dir "$folder" --part "$part" --check "$folder/sums.json"
            rm "$folder/sums.json"
            mv "$folder"/* out/
          done

      - name: Take the release notes from the tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --depth=1 --force origin tag "$REF_NAME"
          git tag -l --format='%(contents)' "$REF_NAME" > notes.txt

      - name: Authenticate to GCP (workload identity federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/setup-gcloud

      # The release's files first, then the manifest, written only if no one else wrote it since it was read.
      - name: Publish
        run: |
          set -euo pipefail
          python3 device-app/scripts/device-manifest.py publish --version "$VERSION" --dir out --notes-file notes.txt \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --platforms "$PLATFORMS"

      - name: Verify the public manifest and downloads
        run: python3 device-app/scripts/device-manifest.py verify --version "$VERSION" --dir out --platforms "$PLATFORMS"

      - name: Summary
        run: echo "Harness Device **$VERSION** is live." >> "$GITHUB_STEP_SUMMARY"
