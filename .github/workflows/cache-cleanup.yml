name: Remove finished branch caches

on:
  pull_request_target:
    types: [closed]
  delete:

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event_name == 'pull_request_target' || github.event.ref_type == 'branch'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      # pull_request_target uses trusted default-branch code only. Never check out
      # or execute the closed PR's head; the PR number is only an API lookup key.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: /scripts/prune-finished-caches.py
          sparse-checkout-cone-mode: false
      - name: Remove closed-PR caches
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/prune-finished-caches.py --pull-request "$PR_NUMBER" --apply
      - name: Remove deleted-branch caches
        if: github.event_name == 'delete'
        env:
          GH_TOKEN: ${{ github.token }}
          DELETED_BRANCH: ${{ github.event.ref }}
        run: python3 scripts/prune-finished-caches.py --deleted-branch "$DELETED_BRANCH" --apply
