# TEMPORARY: removed before the merge, with device-app/scripts/tmp-e2e-update.sh (the device app release plan, Task 9).
name: TEMPORARY device-app release e2e

# Builds Harness Device twice, ad hoc signed with updater keys made in the run, and checks that 0.0.1 updates itself to
# 0.0.2 from a file server on 127.0.0.1. It reads no secret, and uploads only the logs.
on:
  push:
    branches: [feat/device-app-release]

permissions:
  contents: read

concurrency:
  group: tmp-device-app-release
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: macos-15
    # The Tauri CLI's install takes about 8 minutes, then two universal builds.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing in the run needs the token, and the run starts the app.
          persist-credentials: false
          sparse-checkout: /device-app/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2

      - name: Install the build tools
        run: bash device-app/scripts/release-setup.sh

      - name: Build 0.0.1 and 0.0.2, then update one to the other
        run: bash device-app/scripts/tmp-e2e-update.sh

      # Logs only: the builds are signed with keys that end with the run.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-app-e2e
          path: ${{ runner.temp }}/device-e2e/logs
          retention-days: 7
