name: tmp linux-xdg-paths

# TEMPORARY: removed before the merge (docs/plans/2026-11-18-linux-xdg-paths-plan.md, Task 48).
# A Mac cannot run the Linux root rule: the existing CLI, Desktop, hn and Device app tests that read a default path, and
# hn's native fixtures (PR CI runs its unit tests only), run here on Linux, and so does the move of ~/.harness itself, end
# to end and from the published release. No secret, no cache write, nothing published or written outside the run.
on:
  push:
    branches: [feat/linux-xdg-paths]

permissions:
  contents: read

concurrency:
  group: tmp-linux-xdg-paths
  cancel-in-progress: true

jobs:
  units:
    name: units (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: cli-1, shard: 1, timeout: 15 }
          - { leg: cli-2, shard: 2, timeout: 15 }
          - { leg: cli-3, shard: 3, timeout: 15 }
          - { leg: cli-4, shard: 4, timeout: 15 }
          # The whole Desktop suite in one leg: ci.yml's six shards take about 6 minutes each.
          - { leg: desktop, timeout: 75 }
          - { leg: tui, timeout: 20 }
          # apt-install.sh can take about 19.5 minutes to give up in a mirror outage, and a cold Tauri compile follows.
          - { leg: device-app, timeout: 40 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: matrix.shard || matrix.leg == 'device-app'
        with:
          # The same pin as release-tui.yml and windows.yml.
          node-version: 24.22.2

      - name: CLI install
        if: matrix.shard
        working-directory: cli
        run: npm ci --no-audit --no-fund
      - name: CLI shard
        if: matrix.shard
        working-directory: cli
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          npx vitest run --config vitest.ci.config.ts --shard=${{ matrix.shard }}/4 --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/report/cli-${{ matrix.shard }}.json"

      - id: flutter
        if: matrix.leg == 'desktop'
        run: |
          version="$(sed -n "s/^  FLUTTER_VERSION: '\([^']*\)'.*/\1/p" .github/workflows/release-desktop.yml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Restores the shared caches only: save-cache stays false.
      - uses: ./.github/actions/desktop-flutter
        if: matrix.leg == 'desktop'
        with:
          version: ${{ steps.flutter.outputs.version }}
      - name: Desktop tests
        if: matrix.leg == 'desktop'
        run: python3 scripts/test-desktop.py --workers 4 --timeout 3600

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.leg == 'tui' || matrix.leg == 'device-app'
      - name: hn tests
        if: matrix.leg == 'tui'
        working-directory: tui
        env:
          TERM: xterm-256color
          COLORTERM: truecolor
        run: |
          set -o pipefail
          sudo apt-get update && sudo apt-get install -y tmux zsh
          mkdir -p "$RUNNER_TEMP/report"
          env -u NO_COLOR cargo test --locked 2>&1 | tee "$RUNNER_TEMP/report/tui.log"

      # Tauri's Linux packages, as ci.yml installs them; the binary embeds ui/dist, so the bundle is built first.
      - name: Device app tests
        if: matrix.leg == 'device-app'
        run: |
          set -o pipefail
          sudo bash scripts/apt-install.sh libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
          (cd device-app/ui && npm ci --no-audit --no-fund && npm run build)
          mkdir -p "$RUNNER_TEMP/report"
          cargo test --locked --manifest-path device-app/src-tauri/Cargo.toml 2>&1 | tee "$RUNNER_TEMP/report/device-app.log"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: tmp-linux-xdg-paths-${{ matrix.leg }}
          path: |
            ${{ runner.temp }}/report/
            .harness/validation/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  tui-native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          # The same pin as release-tui.yml.
          node-version: 24.22.2
      - name: Install native test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y tmux zsh
          npm ci --prefix cli --no-audit --no-fund
      - name: Build hn
        working-directory: tui
        run: cargo build --locked --release
      - name: Build native comparison reference
        id: reference-tmux
        uses: ./.github/actions/reference-tmux
      - name: The native fixtures
        env:
          REFERENCE_TMUX_BIN: ${{ steps.reference-tmux.outputs.bin }}
          TERM: xterm-256color
          COLORTERM: truecolor
        run: PATH="$REFERENCE_TMUX_BIN:$PATH" python3 scripts/validate-tui-native.py tui/target/release/harness-tui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-linux-xdg-paths-tui-native
          path: .harness/validation/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # cli/e2e/homeMove.e2e.ts: the real daemon moves ~/.harness under agents at work, with tmux and the fake engines, in a
  # throwaway home; then once more with the published release as the first daemon (its bundle checked against the
  # public manifest's sha256), as e2e/migration.e2e.ts takes one.
  home-move-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cli
    env:
      LANG: C.UTF-8
      SHELL: /bin/zsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The same pin as release-tui.yml and windows.yml.
          node-version: 24.22.2
      # As cli-e2e.yml has them: tmux, the shell its tiles run, lsof, and zsh's completion folders made safe.
      - name: Install tmux, zsh and lsof
        run: |
          sudo bash ../scripts/apt-install.sh tmux zsh lsof
          insecure=$(zsh -fc 'autoload -U compaudit && compaudit' 2>/dev/null | grep '^/' | sort -u || true)
          if [ -n "$insecure" ]; then
            echo "$insecure" | xargs sudo chown root:root
            echo "$insecure" | xargs sudo chmod g-w,o-w
          fi
          zsh -fc 'autoload -U compaudit && compaudit'
      - run: npm ci --no-audit --no-fund
      - name: The move, end to end
        env:
          E2E_BUNDLE: '1'
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/home-move/daemons
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/home-move"
          npx vitest run --config vitest.e2e.config.ts e2e/homeMove.e2e.ts 2>&1 | tee "$RUNNER_TEMP/home-move/e2e.log"
      - name: The published release
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/release" && cd "$RUNNER_TEMP/release"
          curl -fsSL --retry 3 https://storage.googleapis.com/s3-autonomous-upgrade-3/harness/cli/metadata.json -o metadata.json
          for part in cli:cli.js notify:notify.mjs; do
            key=${part%%:*} file=${part#*:}
            curl -fsSL --retry 3 "$(node -p "require('./metadata.json').cli.$key.url")" -o "$file"
            echo "$(node -p "require('./metadata.json').cli.$key.sha256")  $file" | sha256sum -c -
          done
          echo "release $(node -p "require('./metadata.json').cli.version")"
      - name: The move, from the published release
        if: ${{ !cancelled() }}
        env:
          E2E_BUNDLE: '1'
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/home-move/daemons
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/home-move"
          MIGRATION_FROM="$RUNNER_TEMP/release/cli.js" npx vitest run --config vitest.e2e.config.ts e2e/homeMove.e2e.ts \
            -t 'from a released build' 2>&1 | tee "$RUNNER_TEMP/home-move/from-release.log"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: tmp-linux-xdg-paths-home-move-e2e
          path: ${{ runner.temp }}/home-move/
          if-no-files-found: ignore
          retention-days: 7

  # cli/scripts/e2e/home-move-upgrade.sh: the published release installed with its own install.sh into a throwaway home,
  # this build installed over it and started, and a fresh install in a second empty home. It never signs in.
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The same pin as release-tui.yml and windows.yml.
          node-version: 24.22.2
      - name: Install tmux
        run: sudo bash scripts/apt-install.sh tmux
      - run: npm ci --prefix cli --no-audit --no-fund
      - name: The upgrade
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/upgrade-log"
          bash cli/scripts/e2e/home-move-upgrade.sh "$RUNNER_TEMP/home" 2>&1 | tee "$RUNNER_TEMP/upgrade-log/upgrade.log"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: tmp-linux-xdg-paths-upgrade
          path: |
            ${{ runner.temp }}/upgrade-log/
            ${{ runner.temp }}/home/.local/share/harness/cli/data/harness.log
            ${{ runner.temp }}/home-fresh/.local/share/harness/cli/data/harness.log
          if-no-files-found: ignore
          retention-days: 7
