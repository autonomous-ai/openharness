name: Private OS network suspend probe

on:
  push:
    branches: ['os-checks/session-deps-r1']
    paths: ['os/tests/network_suspend_probe.py', '.github/workflows/os-network-probe.yml']

permissions:
  contents: read
  actions: read

jobs:
  network:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        nic: [virtio-net-pci, e1000e]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          name: programmer-os-x86_64
          path: os/dist
          run-id: 37257481538
          github-token: ${{ github.token }}
      - name: Prepare native tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf python3-pil tesseract-ocr
          sudo chmod a+rw /dev/kvm
          python3 -m py_compile os/tests/network_suspend_probe.py os/tests/update_vm.py
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/os-network-probe.yml
      - name: Observe unchanged public image before and after real sleep
        env:
          TEST_NIC: ${{ matrix.nic }}
        run: python3 os/tests/network_suspend_probe.py --iso os/dist/*.iso --nic "$TEST_NIC"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: network-suspend-${{ matrix.nic }}
          path: |
            os/test-results/network-suspend-${{ matrix.nic }}/*.json
            os/test-results/network-suspend-${{ matrix.nic }}/*.jsonl
            os/test-results/network-suspend-${{ matrix.nic }}/*.log
            os/test-results/network-suspend-${{ matrix.nic }}/*.png
          retention-days: 7
