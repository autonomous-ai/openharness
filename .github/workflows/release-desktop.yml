name: Release desktop
run-name: Desktop ${{ inputs.prepare_only && 'candidate' || inputs.test_candidate_reuse && 'promotion check' || inputs.test_publication && 'publication check' || 'release' }} ${{ inputs.version || github.ref_name }}

# Cut a release by pushing a tag:  git tag -a v1.0.51_desktop -F notes.md && git push origin v1.0.51_desktop
# (or `make release-desktop` from the repo root, which does exactly that).
#
# The `_desktop` suffix exists only so this workflow's tag trigger never fires on the CLI's
# `v*_cli` or the backend's `v*_backend` release tags, now that all three live in this one repo. It is
# stripped below before anything treats the value as a version — the manifest, --build-name, the
# release title and the updater's semver comparison all only ever see a bare X.Y.Z.
#
# The Flutter project lives under desktop/: the jobs that touch the tree run with
# working-directory: desktop, and `desktop/scripts/...` below is what `scripts/...` used to mean.
#
# macOS and both Linux architectures build in parallel. The macOS coordinator compiles one
# universal app, derives both renderer bundles, and packages/notarizes/uploads them in parallel.
# Each variant writes its own scratch manifest under harness/desktop/.ci/<run id>/.
# The publish job combines all four parts with a generation-conditional write and verifies every
# public download while holding the publication lock. Different releases may build concurrently.
#
# The tag IS the version — CI never auto-bumps. The scripts bump by reading the current version out
# of the remote metadata.json, so four jobs left to bump on their own would read the same number
# and publish four different versions under one tag.
#
# Publishes the keys running apps poll (desktop/lib/update/desktop_updater.dart): desktop-macos and
# desktop-macos-dmg (the Intel build, on Skia — also what every older install and the website read),
# desktop-macos-arm64 and desktop-macos-arm64-dmg (Apple Silicon, on Impeller), desktop-linux-x64 and
# desktop-linux-arm64. A MINOR bump (1.0.x -> 1.1.1) is a forced update — running apps block until it
# is installed. See RELEASE.md, "Two macOS builds" for why macOS is published twice.
#
# Dry run first: Actions -> Release -> Run workflow, with metadata_path = harness/desktop/
# metadata-test.json. Nothing a real app polls is touched, and there is no undo on the real
# manifest — the updater refuses to move backwards, so a bad release can only be rolled back by
# publishing a HIGHER version containing the older code.
#
# metadata_path moves the MANIFEST only. The scripts' GCS_PATH still defaults to
# harness/desktop/<version>/, so a dry run uploads real artifacts there — harmless, since no live
# manifest references them, but delete gs://<bucket>/harness/desktop/<dry-run-version>/ afterwards.

on:
  schedule:
    - cron: '13 4 * * *'  # remove unused candidate packages after seven days
  push:
    tags: ['v*_desktop']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release or candidate version (X.Y.Z)'
        required: true
      metadata_path:
        description: 'Manifest to write. Leave as-is for a real release; metadata-test.json for a dry run.'
        required: false
        default: harness/desktop/metadata.json
      test_publication:
        description: 'Only test publication against disposable fixture objects; no app build or product release'
        type: boolean
        default: false
      prepare_only:
        description: 'Build and verify a candidate during final validation; publish nothing to users'
        type: boolean
        default: false
      test_candidate_reuse:
        description: 'Promote a matching candidate to disposable paths, verify and delete it; no product release'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read     # authenticate the candidate run and its immutable receipt artifact
  id-token: write   # only used by the Workload Identity Federation variant of the auth steps below

concurrency:
  # Different versions build concurrently. Only publish+verification takes the
  # shared manifest lock below; a whole-workflow lock added 4m35s to 1.2.47.
  group: desktop-release-${{ github.ref }}-${{ inputs.version }}-${{ inputs.prepare_only }}-${{ inputs.test_candidate_reuse }}
  cancel-in-progress: false

env:
  GCS_BUCKET: s3-autonomous-upgrade-3   # the release scripts read this too — one place, not five
  # THE toolchain pin for every release artifact, macOS and both Linux architectures alike. Pinned
  # rather than `channel: stable` unqualified: pubspec.yaml pins `sdk: ^3.13.0`, so anything below
  # Flutter 3.47 dies at `flutter pub get` with "version solving failed", and a floating stable ships
  # an engine nobody here has run — the Grid app's "UI tearing itself apart" was exactly that
  # (autonomous-grid-app 58687e7f). Bump deliberately, alongside the local toolchain.
  #
  # It used to live in ci.yml, whose test suite gated every release. That gate was removed by the
  # team's decision on 2026-09-10 — it had failed every tag since v1.0.92, so none of them reached a
  # user — and nothing here runs the tests any more. Complete the relevant validation described in
  # docs/validation-and-release.md before tagging; don't repeat full suites at release time.
  FLUTTER_VERSION: '3.47.2'

jobs:
  # Resolve and validate before anything expensive starts. A malformed tag fails here in seconds
  # rather than 25 minutes into a notarized build.
  version:
    if: ${{ github.event_name != 'schedule' && !inputs.test_publication }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      metadata_path: ${{ steps.resolve.outputs.metadata_path }}
      scratch_prefix: ${{ steps.resolve.outputs.scratch_prefix }}
      artifact_prefix: ${{ steps.resolve.outputs.artifact_prefix }}
      artifact_base_url: ${{ steps.resolve.outputs.artifact_base_url }}
      candidate_prefix: ${{ steps.resolve.outputs.candidate_prefix }}
      test_prefix: ${{ steps.resolve.outputs.test_prefix }}
    steps:
      - id: resolve
        # Through env, never `${{ }}` inline in run:. Git permits quotes, backticks and $() in a
        # ref name, so interpolating one into the shell would let a tag name execute as code.
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_METADATA_PATH: ${{ inputs.metadata_path }}
          PREPARE_ONLY: ${{ inputs.prepare_only }}
          TEST_REUSE: ${{ inputs.test_candidate_reuse }}
        run: |
          set -euo pipefail
          if [[ "$PREPARE_ONLY" = true && "$TEST_REUSE" = true ]]; then
            echo '::error::prepare_only and test_candidate_reuse are separate runs'
            exit 1
          fi
          # A tag push names the ref "vX.Y.Z_desktop"; workflow_dispatch's input.version is already
          # bare. Strip both so $ver is always X.Y.Z — the suffix routes the tag to this workflow
          # and is never part of the published version.
          ver="${INPUT_VERSION:-${REF_NAME#v}}"
          ver="${ver%_desktop}"
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$ver' must look like X.Y.Z — tag as vX.Y.Z_desktop"
            exit 1
          fi
          meta="${INPUT_METADATA_PATH:-harness/desktop/metadata.json}"
          artifact_prefix="harness/desktop/$ver"
          artifact_base_url=https://cdn.autonomous.ai
          candidate_prefix=""
          test_prefix=""
          if [[ "$PREPARE_ONLY" = true ]]; then
            candidate_prefix="harness/desktop-candidates/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(openssl rand -hex 16)"
            artifact_prefix="$candidate_prefix"
            artifact_base_url="https://storage.googleapis.com/$GCS_BUCKET"
          elif [[ "$TEST_REUSE" = true ]]; then
            test_prefix="harness/desktop/.candidate-check/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            meta="$test_prefix/metadata.json"
            artifact_prefix="$test_prefix/artifacts"
            artifact_base_url="https://storage.googleapis.com/$GCS_BUCKET"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "metadata_path=$meta" >> "$GITHUB_OUTPUT"
          echo "scratch_prefix=harness/desktop/.ci/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "artifact_prefix=$artifact_prefix" >> "$GITHUB_OUTPUT"
          echo "artifact_base_url=$artifact_base_url" >> "$GITHUB_OUTPUT"
          echo "candidate_prefix=$candidate_prefix" >> "$GITHUB_OUTPUT"
          echo "test_prefix=$test_prefix" >> "$GITHUB_OUTPUT"
          echo "Desktop **$ver** · candidate=$PREPARE_ONLY · disposable promotion=$TEST_REUSE" >> "$GITHUB_STEP_SUMMARY"

  # Reject duplicate/older versions and broken credentials before expensive builds.
  preflight:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 24  # follows an existing candidate for at most its 20-minute budget
    outputs:
      reused: ${{ steps.candidate.outputs.reused }}
      candidate_prefix: ${{ steps.candidate.outputs.candidate_prefix }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /.github/actions/setup-gcloud/
            /scripts/publish-desktop-manifest.py
            /scripts/verify-desktop-release.py
            /scripts/desktop-release-candidate.py
            /scripts/record-ci-validation.py
          sparse-checkout-cone-mode: false
      # GCP auth, WITHOUT a long-lived key — the same pattern release.yml and production-be-build.yaml
      # already run. A service-account JSON key is a bearer credential with no expiry: it is only as
      # safe as every place it has ever been copied to. Workload Identity Federation replaces it with
      # a short-lived token minted from this job's own OIDC identity (hence `id-token: write` above),
      # so there is nothing to leak and nothing to rotate.
      #
      # This workflow was the one left on the key when the rest of the repo federated; it is also why
      # every GCS call below is `gcloud storage` and not `gsutil`. gsutil is a standalone Python tool
      # that cannot use the external-account credential WIF issues, so it fails on every call while
      # the identical `gcloud storage` call works. Do not reintroduce gsutil here.
      #
      # Federation is the only path: the GCP_SA_KEY fallback and the key behind it were retired on
      # 2026-09-17. If this step fails, fix the provider or the service account's binding — do not
      # reintroduce a key.
      - name: Authenticate to GCP (workload identity federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/setup-gcloud
      - name: Reject a version already published or superseded
        env:
          VERSION: ${{ needs.version.outputs.version }}
          METADATA_PATH: ${{ needs.version.outputs.metadata_path }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$METADATA_PATH" != harness/desktop/metadata.json ]]; then
            args+=(--allow-initialize)
          fi
          python3 scripts/publish-desktop-manifest.py "$VERSION" \
            "gs://${GCS_BUCKET}/${METADATA_PATH}" --check-only "${args[@]}"
      - name: Verify GCS write access
        run: |
          set -euo pipefail
          probe="gs://${GCS_BUCKET}/harness/desktop/.ci-preflight/${GITHUB_RUN_ID}"
          echo "$GITHUB_RUN_ID" | gcloud storage cp - "$probe"
          gcloud storage rm "$probe"

      - name: Reuse a matching verified candidate, or build normally
        id: candidate
        if: ${{ !inputs.prepare_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          DESTINATION: ${{ needs.version.outputs.artifact_prefix }}
          SCRATCH_PREFIX: ${{ needs.version.outputs.scratch_prefix }}
          TEST_REUSE: ${{ inputs.test_candidate_reuse }}
        run: |
          args=()
          [[ "$TEST_REUSE" != true ]] || args+=(--require-candidate)
          python3 scripts/desktop-release-candidate.py reuse --version "$VERSION" \
            --destination "$DESTINATION" --scratch "$SCRATCH_PREFIX" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('desktop-candidate-reuse.json') != '' }}
        with:
          name: desktop-candidate-reuse
          path: desktop-candidate-reuse.json

  # Compile the universal app once, then derive the two renderer bundles. Both
  # retain arm64+x86_64; their packaging/notarization/uploads run in parallel.
  build-macos:
    needs: [version, preflight]
    if: needs.preflight.outputs.reused != 'true'
    runs-on: macos-15
    timeout-minutes: 60   # two notarization submissions per build (zip, then dmg) — see RELEASE.md
    env:
      MACOS_METADATA_PREFIX: ${{ needs.version.outputs.scratch_prefix }}
      ARTIFACT_PREFIX: ${{ needs.version.outputs.artifact_prefix }}
      CDN_ASSET_BASE_URL: ${{ needs.version.outputs.artifact_base_url }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep the entire Desktop component and its shared packaging helpers.
          # The mobile lock is included only to preserve the existing pub-cache key.
          sparse-checkout: |
            /desktop/
            /.github/actions/
            /scripts/validate-change.py
            /scripts/verify-desktop-release.py
            /mobile/pubspec.lock
          sparse-checkout-cone-mode: false

      # main prepares shared caches. A release only restores: per-tag uploads cannot
      # help the next tag and added 81s after the 1.2.51 macOS build had finished.
      - uses: ./.github/actions/desktop-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}

      # The throwaway keychain, the Developer ID certificate in it and the `harness-notarize` profile
      # upload-desktop.sh submits with. It sets KEYCHAIN_PATH. internal-build.yml signs with the same
      # action, so every internal build proves these steps before a release depends on them.
      - uses: ./.github/actions/macos-signing
        with:
          certificate-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          apple-app-password: ${{ secrets.APPLE_APP_PASSWORD }}

      - name: Authenticate to GCP (workload identity federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          # Avoid copying the SDK into a local cache this hosted job discards.
          skip_tool_cache: ${{ runner.environment == 'github-hosted' }}

      # SIGN_IDENTITY is read twice here: by publish-macos-variant.sh, re-signing the Intel build once
      # it pins the renderer, and by upload-desktop.sh, signing the dmg.
      - name: Build once, then sign, notarize and upload both macOS variants
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          python3 scripts/build-macos-variants.py "$VERSION" \
            --metadata-prefix "$MACOS_METADATA_PREFIX" --artifact-prefix "$ARTIFACT_PREFIX"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-build-timings
          path: desktop/build/macos-variants/timing.json
          if-no-files-found: ignore

      # Free on an ephemeral runner; the whole point the day this moves to a self-hosted Mac.
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true

  build-linux:
    needs: [version, preflight]
    if: needs.preflight.outputs.reused != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      # No max-parallel: each job writes its own scratch manifest, so they cannot race.
      fail-fast: false
      matrix:
        include:
          # flutter build linux cannot cross-compile — each architecture needs its own host.
          # Built on the OLDEST Ubuntu we support: the runner links the host's GLib/glibc, and a
          # 24.04 build calls g_once_init_enter_pointer (GLib 2.80), which 22.04 (2.72) lacks —
          # the app died at launch with "undefined symbol". A 22.04 build runs on 24.04 too.
          - { runner: ubuntu-22.04, arch: x64 }
          - { runner: ubuntu-22.04-arm, arch: arm64 }
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      METADATA_PATH: ${{ needs.version.outputs.scratch_prefix }}/linux-${{ matrix.arch }}.json
      GCS_PATH: ${{ needs.version.outputs.artifact_prefix }}/Harness-linux-${{ matrix.arch }}.AppImage
      CDN_ASSET_BASE_URL: ${{ needs.version.outputs.artifact_base_url }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /desktop/
            /.github/actions/
            /mobile/pubspec.lock
          sparse-checkout-cone-mode: false

      - name: Install the Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      # Flutter has no Linux ARM64 SDK archive. Its action installs the same
      # pinned SDK from Git, verifies the revision, and reuses main's native cache.
      - uses: ./.github/actions/desktop-flutter
        if: matrix.arch != 'arm64'
        with:
          version: ${{ env.FLUTTER_VERSION }}

      - uses: ./.github/actions/desktop-flutter-arm64
        if: matrix.arch == 'arm64'
        with:
          version: ${{ env.FLUTTER_VERSION }}

      # appimagetool packages the Linux bundle into the single-file .AppImage the release publishes
      # (see RELEASE.md). --appimage-extract-and-run in upload-desktop-linux.sh means the runner
      # itself never needs FUSE. Pinned to a numbered release (not "continuous") for reproducibility.
      - name: Download appimagetool
        env:
          APPIMAGETOOL_VERSION: '1.9.1'
          APPIMAGE_ARCH: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}
        run: |
          set -euo pipefail
          url="https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-${APPIMAGE_ARCH}.AppImage"
          curl -fL "$url" -o "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"

      - name: Authenticate to GCP (workload identity federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/setup-gcloud

      - name: Build and upload linux-${{ matrix.arch }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash scripts/upload-desktop-linux.sh "$VERSION"

  # The only job that touches the REAL manifest, and the only one that can, because it is the only
  # one that runs after every build has finished.
  publish:
    needs: [version, preflight, build-macos, build-linux]
    if: ${{ always() && !inputs.prepare_only && needs.version.result == 'success' && needs.preflight.result == 'success' && (needs.preflight.outputs.reused == 'true' || (needs.build-macos.result == 'success' && needs.build-linux.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      # Include verification: another release must not advance the live manifest
      # between this publication and its six-download check. GCS's generation
      # condition also protects against writers outside this workflow.
      # Keep the historical group so a release already using the older workflow
      # still serializes with this publisher during the transition.
      group: desktop-release
      cancel-in-progress: false
    env:
      METADATA_PATH: ${{ needs.version.outputs.metadata_path }}
      SCRATCH_PREFIX: ${{ needs.version.outputs.scratch_prefix }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /.github/actions/setup-gcloud/
            /scripts/publish-desktop-manifest.py
            /scripts/verify-desktop-release.py
          sparse-checkout-cone-mode: false
      - name: Authenticate to GCP (workload identity federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/setup-gcloud

      - name: Merge every platform's key into the manifest in one write
        run: |
          set -euo pipefail
          mkdir -p parts
          gcloud storage cp "gs://${GCS_BUCKET}/${SCRATCH_PREFIX}/*.json" parts/
          args=()
          if [[ "$METADATA_PATH" != harness/desktop/metadata.json ]]; then
            args+=(--allow-initialize)
          fi
          python3 scripts/publish-desktop-manifest.py "$VERSION" \
            "gs://${GCS_BUCKET}/${METADATA_PATH}" --parts parts "${args[@]}"
          echo "Published to \`${METADATA_PATH}\`" >> "$GITHUB_STEP_SUMMARY"

      # Same worker and publication lock: no extra runner startup and no chance
      # of another workflow changing the live version during this verification.
      - name: Verify all public artifacts as the updater
        run: |
          python3 scripts/verify-desktop-release.py "$VERSION" \
            --manifest-url "https://storage.googleapis.com/${GCS_BUCKET}/${METADATA_PATH}" \
            --receipt desktop-release-verification.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('desktop-release-verification.json') != '' }}
        with:
          name: desktop-release-verification
          path: desktop-release-verification.json
          if-no-files-found: error

  # The GitHub Release. Notes are the tag's OWN message, verbatim — the same rule
  # autonomous-grid's release.yml follows. CI generates nothing: what a human wrote and reviewed at
  # tag time is exactly what publishes, and `generate_release_notes` would append a second,
  # differently-built list under it that silently omits anything which reached main without a PR.
  #
  # No binaries attached. GCS is the distribution channel — the in-app updater and the website both
  # read the manifest — so uploading 70MB of the same bytes here would create a second copy that can
  # disagree with the one the app actually installs. The notes link to the real ones instead.
  github-release:
    needs: [version, publish]
    # success() also inspects skipped ancestors: an explicitly successful
    # publisher must reach this job even when candidate reuse skipped builds.
    if: ${{ always() && needs.version.result == 'success' && needs.publish.result == 'success' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || inputs.test_candidate_reuse) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # narrower than the workflow default only here, where a release is created
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # Notes come from Git objects; no app source or artwork is needed.
          sparse-checkout: /.github/workflows/release-desktop.yml
          sparse-checkout-cone-mode: false

      - name: Take the release notes from the tag
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # actions/checkout replaces the pushed annotated tag with a LIGHTWEIGHT local ref, even at
          # fetch-depth: 0, so `git cat-file -t` below would see "commit" and reject a properly
          # annotated tag. Re-fetch the tag object to restore the annotation before reading it.
          git fetch --depth=1 --force origin tag "$REF_NAME"
          # A lightweight tag has no message of its own, and %(contents) would quietly fall through
          # to the commit's — publishing "chore(release): vX.Y.Z" as the notes. The release scripts
          # always push an annotated tag with notes, but a hand-made `git tag` does not, and this
          # job runs AFTER publish: failing here left a live build with no Release page (v1.1.70_desktop,
          # 2026-09-21). So fall back to the same commit list the script would have generated —
          # everything since the previous _desktop tag — and warn, rather than leave the release half done.
          if [ "$(git cat-file -t "$REF_NAME")" = tag ]; then
            git tag -l --format='%(contents)' "$REF_NAME" > RELEASE_NOTES.md
          else
            : > RELEASE_NOTES.md
          fi
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::warning::$REF_NAME carries no release notes (lightweight or empty tag) — generating them from the commit list. Next time: make release-desktop"
            # Only the legacy fallback needs history. Annotated releases already
            # carry their complete notes; cloning all history cost 108s in 1.2.41.
            git fetch --unshallow --tags --force origin
            prev="$(git tag -l 'v*_desktop' \
              | { grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)_desktop$' || true; } \
              | grep -vx "$REF_NAME" | sort -V | tail -1)"
            {
              printf 'Harness Desktop %s\n\n' "$VERSION"
              if [ -n "$prev" ]; then
                git log --no-merges --pretty='- %s' "${prev}..${REF_NAME}"
              else
                git log --no-merges --pretty='- %s' -20 "$REF_NAME"
              fi
            } > RELEASE_NOTES.md
          fi
          base="https://cdn.autonomous.ai/harness/desktop/${VERSION}"
          cat >> RELEASE_NOTES.md <<EOF

          ---

          ## Downloads

          New install: <https://harness.autonomous.ai/desktop/download?utm_source=github&utm_medium=release>

          | | |
          |---|---|
          | macOS — Apple Silicon (M1 and later) | [Harness-macos-arm64.dmg](${base}/Harness-macos-arm64.dmg) |
          | macOS — Intel (also runs on Apple Silicon) | [Harness-macos.dmg](${base}/Harness-macos.dmg) |
          | Linux x64 | [Harness-linux-x64.AppImage](${base}/Harness-linux-x64.AppImage) |
          | Linux arm64 | [Harness-linux-arm64.AppImage](${base}/Harness-linux-arm64.AppImage) |

          Already running Harness? It updates itself — no download needed.
          EOF
          echo "::group::RELEASE_NOTES.md"; cat RELEASE_NOTES.md; echo "::endgroup::"

      - name: Confirm promotion reaches the release-page stage
        if: inputs.test_candidate_reuse
        run: echo 'Promoted packages passed public verification; product Release creation is disabled for this disposable check.'

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          # Three products release from this repo; a raw "v1.2.3_desktop" title reads worse than this.
          name: Harness Desktop ${{ needs.version.outputs.version }}
          body_path: RELEASE_NOTES.md

  # Its own job, not a step in `publish`: `publish` is SKIPPED when any build fails, which is
  # precisely when scratch manifests are left behind — the builds that DID succeed have already
  # written theirs. `if: always()` here means the prefix is cleared whatever happened upstream.
  cleanup:
    needs: [version, preflight, build-macos, build-linux, candidate, publish]
    if: ${{ always() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /.github/actions/setup-gcloud/
            /scripts/desktop-release-candidate.py
            /scripts/record-ci-validation.py
            /scripts/publish-desktop-manifest.py
            /scripts/verify-desktop-release.py
          sparse-checkout-cone-mode: false
      - name: Authenticate to GCP (workload identity federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/setup-gcloud
      - name: Remove the scratch manifests
        env:
          SCRATCH_PREFIX: ${{ needs.version.outputs.scratch_prefix }}
        run: gcloud storage rm -r "gs://${GCS_BUCKET}/${SCRATCH_PREFIX}" || true
      - name: Remove failed or consumed candidate packages and disposable promotion objects
        env:
          OWN_CANDIDATE: ${{ needs.version.outputs.candidate_prefix }}
          REUSED_CANDIDATE: ${{ needs.preflight.outputs.candidate_prefix }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          TEST_PREFIX: ${{ needs.version.outputs.test_prefix }}
        run: |
          set -euo pipefail
          if [[ -n "$OWN_CANDIDATE" && "$CANDIDATE_RESULT" != success ]]; then
            python3 scripts/desktop-release-candidate.py remove --prefix "$OWN_CANDIDATE" || true
          fi
          if [[ -n "$REUSED_CANDIDATE" && "$PUBLISH_RESULT" = success ]]; then
            python3 scripts/desktop-release-candidate.py remove --prefix "$REUSED_CANDIDATE"
          fi
          if [[ -n "$TEST_PREFIX" ]]; then
            [[ "$TEST_PREFIX" = "harness/desktop/.candidate-check/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]]
            gcloud storage rm --recursive "gs://${GCS_BUCKET}/${TEST_PREFIX}/"
          fi

  # Same build/signing path and production updater settings. Only the storage
  # destination differs. A successful receipt binds six verified generations to
  # its full producer source tree, Desktop build inputs, version, run and attempt.
  candidate:
    needs: [version, build-macos, build-linux]
    if: ${{ inputs.prepare_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /.github/actions/setup-gcloud/
            /scripts/desktop-release-candidate.py
            /scripts/record-ci-validation.py
            /scripts/publish-desktop-manifest.py
            /scripts/verify-desktop-release.py
          sparse-checkout-cone-mode: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/setup-gcloud
      - name: Verify all six candidate downloads and seal their source identity
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PREFIX: ${{ needs.version.outputs.candidate_prefix }}
          SCRATCH_PREFIX: ${{ needs.version.outputs.scratch_prefix }}
        run: |
          mkdir -p parts
          gcloud storage cp "gs://${GCS_BUCKET}/${SCRATCH_PREFIX}/*.json" parts/
          python3 scripts/desktop-release-candidate.py seal --version "$VERSION" --prefix "$PREFIX" --parts parts
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-candidate-${{ github.run_attempt }}
          path: desktop-release-candidate.json
          if-no-files-found: error
          retention-days: 7

  expire-candidates:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /.github/actions/setup-gcloud/
            /scripts/desktop-release-candidate.py
            /scripts/record-ci-validation.py
            /scripts/publish-desktop-manifest.py
            /scripts/verify-desktop-release.py
          sparse-checkout-cone-mode: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/setup-gcloud
      - run: python3 scripts/desktop-release-candidate.py expire

  # This mode exercises actual GCS generation preconditions using tiny fixture
  # artifacts under its own run prefix. All product build/publish jobs are skipped.
  publication-test:
    if: ${{ inputs.test_publication }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /.github/actions/setup-gcloud/
            /scripts/publish-desktop-manifest.py
            /scripts/verify-desktop-release.py
            /scripts/check-desktop-publication-gcs.py
            /scripts/check-desktop-candidate-gcs.py
            /scripts/desktop-release-candidate.py
            /scripts/record-ci-validation.py
            /scripts/tests/desktop_publication_fixture.py
            /desktop/scripts/upload-desktop.sh
            /desktop/scripts/upload-desktop-linux.sh
          sparse-checkout-cone-mode: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/setup-gcloud
      - name: Exercise publication against a disposable GCS prefix
        run: python3 scripts/check-desktop-publication-gcs.py "$GCS_BUCKET"
      - name: Exercise candidate sealing, promotion and expiration against disposable objects
        run: python3 scripts/check-desktop-candidate-gcs.py
