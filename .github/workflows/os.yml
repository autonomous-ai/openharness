name: Programmer OS

on:
  workflow_dispatch:
    inputs:
      image_run_id:
        description: 'Optional: test an existing image artifact from this workflow run ID'
        required: false
        type: string
  push:
    branches: ['os/**']
    paths: ['os/**', 'tui/**', 'cli/**', '.github/workflows/os.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: programmer-os-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: ${{ !inputs.image_run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - name: Record start and capacity
        run: |
          date -u
          df -h .
          free -h
      - name: Validate installer safety and image configuration
        run: |
          make -C os check
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/os.yml
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: tui
          shared-key: tui-x86_64-unknown-linux-musl
          cache-bin: false
      - name: Build Harness from the exact OS source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools tmux
          make -C os runtime
      - name: Validate hn session behavior and native terminal lifecycle
        run: |
          timeout 8m cargo test --manifest-path tui/Cargo.toml --locked --release --target x86_64-unknown-linux-musl
          python3 scripts/validate-tui-native.py tui/target/x86_64-unknown-linux-musl/release/harness-tui
      - name: Build offline BIOS and UEFI image
        run: |
          docker run --rm --privileged \
            -v "$PWD:/src" -w /src/os \
            -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -e HARNESS_OS_SOURCE_SHA="$(git rev-parse HEAD)" \
            -e HARNESS_OS_RUNTIME_DIR=/src/os/work/runtime \
            archlinux:base-devel \
            bash -c 'set -euo pipefail; pacman -Syu --noconfirm archiso python git; bash build.sh'
      - name: Inspect image artifact
        run: |
          cd os/dist
          sha256sum -c *.sha256
          cat manifest.json
          ls -lh *.iso
      - name: Retain image, checksums, package inventory and build manifest
        uses: actions/upload-artifact@v6
        with:
          name: programmer-os-x86_64
          path: os/dist/
          retention-days: 14
          compression-level: 0
      - name: Retain build diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: programmer-os-build-diagnostics
          path: |
            .harness/validation/
            os/work/profile/profiledef.sh
            os/work/profile/pacman.conf
            os/work/archiso/x86_64/airootfs/var/log/pacman.log
          retention-days: 7

  machine:
    needs: image
    if: ${{ always() && (needs.image.result == 'success' || inputs.image_run_id != '') && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - firmware: bios
            encryption: ''
          - firmware: uefi
            encryption: '--encrypt'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          name: programmer-os-x86_64
          path: os/dist
          run-id: ${{ inputs.image_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install VM test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf python3-pil
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - name: Boot, operate, install and reboot the real image
        run: python3 os/tests/vm.py --iso os/dist/*.iso --firmware '${{ matrix.firmware }}' ${{ matrix.encryption }}
      - name: Retain screenshots, measurements and serial diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: programmer-os-vm-${{ matrix.firmware }}
          path: |
            os/test-results/**/*.png
            os/test-results/**/*.log
            os/test-results/**/*.txt
            os/test-results/**/*.json
          retention-days: 14
