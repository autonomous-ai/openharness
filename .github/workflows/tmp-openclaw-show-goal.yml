# TEMPORARY (fix/openclaw-show-goal): remove before the merge.
#
# Runs the OpenClaw goal test and the other engines' end-to-end files on Linux, on every push of the
# branch, set up as cli-e2e.yml's `e2e` job. identityHoldVisible skips on Linux; it stays listed so
# the run says so. Nothing is released, published or deployed.
name: tmp OpenClaw show goal

on:
  push:
    branches: [fix/openclaw-show-goal]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cli
    env:
      LANG: C.UTF-8
      SHELL: /bin/zsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install tmux, the shells the tests launch through, and lsof
        run: |
          sudo bash ../scripts/apt-install.sh tmux zsh tcsh dash lsof
          sudo sysctl -w fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=524288
          tmux -V && zsh --version && tcsh --version && command -v dash
          insecure=$(zsh -fc 'autoload -U compaudit && compaudit' 2>/dev/null | grep '^/' | sort -u || true)
          if [ -n "$insecure" ]; then
            echo "$insecure" | xargs sudo chown root:root
            echo "$insecure" | xargs sudo chmod g-w,o-w
          fi
          zsh -fc 'autoload -U compaudit && compaudit'
      - run: npm ci --no-audit --no-fund
      - name: The OpenClaw goal test and the other engines
        env:
          E2E_BUNDLE: '1'
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/e2e-daemon-logs
        run: >-
          npx vitest run --config vitest.e2e.config.ts e2e/openclawShow.e2e.ts e2e/agentClient.e2e.ts
          e2e/identityHoldVisible.e2e.ts e2e/hermesAdmission.e2e.ts e2e/hermesTerminalRecord.e2e.ts
          e2e/otherEngines.e2e.ts
      - name: Preserve the failing tests' daemon logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: tmp-openclaw-show-goal-daemon-logs
          path: ${{ runner.temp }}/e2e-daemon-logs/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
