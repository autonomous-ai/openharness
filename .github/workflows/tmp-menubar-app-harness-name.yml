# TEMPORARY: removed before the merge (the menu-bar app's name "Harness", Task 2).
name: TEMPORARY menu-bar app name update e2e

# Builds Harness Device 0.1.2 from the tag v0.1.2_device and 0.1.3 from this branch's head, ad hoc signed, with an
# updater key made in the run, serves 0.1.3 on 127.0.0.1, and checks that the installed 0.1.2 updates itself to the
# renamed build at the same path and relaunches from it. It reads no secret and publishes nothing.
on:
  push:
    branches: [feat/menubar-app-harness-name]

permissions:
  contents: read

concurrency:
  group: tmp-menubar-app-harness-name
  cancel-in-progress: true

jobs:
  update:
    runs-on: macos-15
    # The Tauri CLI's install takes about 8 minutes when not cached, then two release builds and a 10-minute wait.
    timeout-minutes: 60
    env:
      ID: ai.autonomous.harness.device
      PORT: '8737'
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing in the run needs the token, and the run starts the app.
          persist-credentials: false
          path: new
          # Cargo lists the package's files through git, which reads every .gitignore up to the root.
          sparse-checkout: |
            /device-app/
            /.gitignore
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: old
          ref: refs/tags/v0.1.2_device
          sparse-checkout: |
            /device-app/
            /.gitignore
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2

      # A HOME that holds any of these is not a fresh runner's: the app would run that CLI, start from that state, or
      # the wait would read an older log.
      - name: Check the runner is fresh and name the paths
        run: |
          set -euo pipefail
          for path in "$HOME/.harness" "$HOME/.local/bin/harness" "$HOME/Library/Application Support/$ID" \
            "$HOME/Library/Logs/$ID"; do
            if [[ -e "$path" || -L "$path" ]]; then
              echo "::error::$path exists: this is not a fresh runner's HOME"
              exit 1
            fi
          done
          if command -v harness; then
            echo "::error::a harness CLI is on PATH: this is not a fresh runner"
            exit 1
          fi
          # The real path: the app's process is matched by its executable's full path, as LaunchServices starts it.
          work="$(cd "$RUNNER_TEMP" && pwd -P)/e2e"
          mkdir -p "$work/apps" "$work/serve/0.1.3" "$work/key"
          {
            echo "WORK=$work"
            echo "APP=$work/apps/Harness Device.app"
            # One target folder: the second build compiles only what differs from the first.
            echo "CARGO_TARGET_DIR=$work/target"
          } >> "$GITHUB_ENV"

      - uses: actions/cache/restore@v4
        id: tauri-cli
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: tmp-tauri-cli-2.12.4-${{ runner.os }}-${{ runner.arch }}

      # The release's own tools: the Tauri CLI 2.12.4 (already installed when cached) and the new tree's npm packages.
      - name: Install the build tools
        run: |
          set -euo pipefail
          bash new/device-app/scripts/release-setup.sh
          (cd old/device-app/ui && npm ci --no-audit --no-fund)

      - uses: actions/cache/save@v4
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: tmp-tauri-cli-2.12.4-${{ runner.os }}-${{ runner.arch }}

      # Made here, for this run only: the updater key is never a repository secret.
      - name: Make a throwaway updater key
        run: |
          set -euo pipefail
          cargo tauri signer generate --ci -w "$WORK/key/updater.key"
          echo "PUBKEY=$(cat "$WORK/key/updater.key.pub")" >> "$GITHUB_ENV"

      # A release build (update.rs `enabled`: not debug, macOS, a version other than 0.0.0) for this Mac's arch, whose
      # updater reads plain http from the file server.
      - name: Build 0.1.2 from v0.1.2_device and install it
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          set -euo pipefail
          config="$(printf '{"version":"0.1.2","plugins":{"updater":{"pubkey":"%s","endpoints":["http://127.0.0.1:%s/metadata.json"],"dangerousInsecureTransportProtocol":true}}}' "$PUBKEY" "$PORT")"
          (cd old/device-app/src-tauri && cargo tauri build --ci --bundles app --config "$config" -- --locked)
          ditto "$CARGO_TARGET_DIR/release/bundle/macos/Harness Device.app" "$APP"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          if [[ "$version" != 0.1.2 ]]; then
            echo "::error::the installed app is $version, not 0.1.2"
            exit 1
          fi

      # As release-build.sh signs it: the archive and its .sig, the signature carrying the version
      # (requireSignedVersion).
      - name: Build 0.1.3 from this branch and serve it
        env:
          APPLE_SIGNING_IDENTITY: '-'
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          set -euo pipefail
          export TAURI_SIGNING_PRIVATE_KEY="$WORK/key/updater.key"
          config="$(printf '{"version":"0.1.3","bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"%s","endpoints":["http://127.0.0.1:%s/metadata.json"],"dangerousInsecureTransportProtocol":true}}}' "$PUBKEY" "$PORT")"
          (cd new/device-app/src-tauri && cargo tauri build --ci --bundles app --config "$config" -- --locked)
          archive="$CARGO_TARGET_DIR/release/bundle/macos/Harness Device.app.tar.gz"
          for file in "$archive" "$archive.sig"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::the build wrote no $(basename "$file")"
              exit 1
            fi
          done
          trusted="$(base64 --decode < "$archive.sig" | sed -n 's/^trusted comment: //p')"
          echo "trusted comment: $trusted"
          if [[ $'\t'"$trusted"$'\t' != *$'\t'version:0.1.3$'\t'* ]]; then
            echo "::error::the signature does not carry version:0.1.3"
            exit 1
          fi
          mv "$archive" "$archive.sig" "$WORK/serve/0.1.3/"
          # Tauri's static manifest, as device-manifest.py writes it, for this Mac's arch only.
          python3 - "$WORK/serve" "$PORT" <<'PY'
          import json, sys, time
          from pathlib import Path
          serve, port = Path(sys.argv[1]), sys.argv[2]
          archive = "Harness Device.app.tar.gz"
          signature = (serve / "0.1.3" / f"{archive}.sig").read_text().strip()
          url = f"http://127.0.0.1:{port}/0.1.3/{archive.replace(' ', '%20')}"
          manifest = {
              "version": "0.1.3",
              "notes": "The end-to-end check's release.",
              "pub_date": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "platforms": {"darwin-aarch64": {"url": url, "signature": signature}},
          }
          (serve / "metadata.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      # The saved state has seen a CLI, asked the sign-in and registered the login item, so with no CLI the app installs
      # nothing, opens no window and registers nothing: no update check and no relaunch waits for it.
      - name: Update 0.1.2 to 0.1.3 and check the renamed bundle
        run: |
          set -euo pipefail
          log_dir="$HOME/Library/Logs/$ID"
          exe="$APP/Contents/MacOS/harness-device"
          mkdir -p "$HOME/Library/Application Support/$ID"
          printf '%s\n' '{"version":1,"cliSeen":true,"askedSignIn":true,"loginItem":true}' \
            > "$HOME/Library/Application Support/$ID/state.json"

          # Every day of the log: a run may cross midnight UTC.
          logged() { grep -qF -- "$1" "$log_dir"/app-*.log 2>/dev/null; }
          # The pids running the bundle's executable. The path reaches awk through its environment, so awk's own
          # command line never matches.
          pids() { ps -axww -o pid=,command= | EXE="$exe" awk 'index($0, ENVIRON["EXE"]) { print $1 }'; }

          # Up before the app starts: its first check runs 5 s after launch, and a failed one waits 6 hours.
          python3 -m http.server "$PORT" --bind 127.0.0.1 --directory "$WORK/serve" > "$WORK/server.log" 2>&1 &
          echo $! > "$WORK/server.pid"
          deadline=$((SECONDS + 15))
          until curl -fsS "http://127.0.0.1:$PORT/metadata.json" > /dev/null; do
            if ((SECONDS > deadline)); then
              echo "::error::the file server did not start"
              cat "$WORK/server.log"
              exit 1
            fi
            sleep 1
          done

          open "$APP"
          deadline=$((SECONDS + 30))
          until [[ -n "$(pids)" ]]; do
            if ((SECONDS > deadline)); then
              echo "::error::0.1.2 did not start"
              exit 1
            fi
            sleep 1
          done
          first="$(pids)"
          echo "0.1.2 runs as pid $first"

          deadline=$((SECONDS + 600))
          until logged "update: installed 0.1.3"; do
            # A failed or skipped update is not tried again for 6 hours.
            if logged "update: failed" || logged "update: skipped"; then
              echo "::error::the update did not install (see the app's log)"
              exit 1
            fi
            if ((SECONDS > deadline)); then
              echo "::error::no 'update: installed 0.1.3' within 10 minutes"
              exit 1
            fi
            sleep 2
          done
          echo "ok: the app logged update: installed 0.1.3"

          # The relaunch comes on the app's next 5-second tick: a new process from the same bundle, the old one gone.
          deadline=$((SECONDS + 60))
          until now="$(pids)" && [[ -n "$now" ]] && ! grep -qxF -- "$first" <<< "$now"; do
            if ((SECONDS > deadline)); then
              echo "::error::the app did not relaunch from $APP (running: ${now:-none})"
              exit 1
            fi
            sleep 1
          done
          echo "ok: relaunched from $exe as pid $now"
          ps -axww -o pid=,command= | EXE="$exe" awk 'index($0, ENVIRON["EXE"])'

          failed=0
          expect() {
            local got
            got="$(/usr/libexec/PlistBuddy -c "Print :$1" "$APP/Contents/Info.plist" 2>/dev/null)" || got="<missing>"
            echo "$1: $got"
            if [[ "$got" != "$2" ]]; then
              echo "::error::$1 is '$got', not '$2'"
              failed=1
            fi
          }
          expect CFBundleShortVersionString 0.1.3
          expect CFBundleIdentifier "$ID"
          expect CFBundleName Harness
          expect LSHasLocalizedDisplayName true

          # The plist's CFBundleDisplayName stays Tauri's "Harness Device": macOS shows the localized name only while
          # it matches the bundle's file name. The name shown comes from these strings.
          strings="$APP/Contents/Resources/en.lproj/InfoPlist.strings"
          if [[ -f "$strings" ]]; then
            echo "en.lproj/InfoPlist.strings:"
            plutil -p "$strings"
            for key in CFBundleName CFBundleDisplayName; do
              got="$(plutil -convert json -o - "$strings" | python3 -c 'import json, sys; print(json.load(sys.stdin).get(sys.argv[1], "<missing>"))' "$key")"
              if [[ "$got" != Harness ]]; then
                echo "::error::InfoPlist.strings $key is '$got', not 'Harness'"
                failed=1
              fi
            done
          else
            echo "::error::$strings is missing"
            failed=1
          fi

          # LaunchServices may still hold the name it registered for 0.1.2 at this path.
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$APP"
          printf '%s\n' 'import Foundation' 'print(FileManager.default.displayName(atPath: CommandLine.arguments[1]))' \
            > "$WORK/display-name.swift"
          shown="$(swift "$WORK/display-name.swift" "$APP")"
          echo "displayName: $shown"
          if [[ "$shown" != Harness ]]; then
            echo "::error::Finder shows '$shown', not 'Harness'"
            failed=1
          fi

          echo "Beside the bundle:"
          ls -la "$WORK/apps"
          others="$(find "$WORK/apps" -mindepth 1 -maxdepth 1 ! -name 'Harness Device.app')"
          if [[ -n "$others" ]]; then
            echo "Left beside it: $others"
          fi
          if grep -q '\.app$' <<< "$others"; then
            echo "::error::another .app was left beside the bundle"
            failed=1
          fi
          # The plugin's backup and extraction folders go to the system temp folder when it is on the app's volume,
          # else beside the app, and are removed when the install returns.
          echo "The plugin's temp folders left in ${TMPDIR:-/tmp}:"
          find "${TMPDIR:-/tmp}" -maxdepth 1 -name 'tauri_*' -print

          exit "$failed"

      - name: The app's log
        if: always()
        run: cat "$HOME/Library/Logs/$ID"/app-*.log || echo "no log was written"

      - name: Stop the app and the file server
        if: always()
        run: |
          pkill -f "$APP/Contents/MacOS/harness-device" || true
          if [[ -f "$WORK/server.pid" ]]; then
            kill "$(cat "$WORK/server.pid")" || true
          fi
