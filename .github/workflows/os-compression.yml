name: Harness OS compression assessment

on:
  workflow_dispatch:
    inputs:
      image_run_id:
        description: 'Exact existing image artifact to assess'
        type: string
        default: '37149350400'
        required: true
      iso_sha256:
        description: 'Trusted SHA-256 of that image'
        type: string
        default: 'efa4e740989770ef7fa40e259f4055d670c5531fcecdf4fcf23f1ae31bb8d380'
        required: true
  push:
    branches: ['os-polish/compression-assessment']
    paths: ['os/tests/payload_compression.py', 'os/tests/test_compression.py', '.github/workflows/os-compression.yml']

permissions:
  contents: read
  actions: read

jobs:
  compression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Validate the assessment and install filesystem tools
        run: |
          python3 -m py_compile os/tests/payload_compression.py os/tests/test_compression.py
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/os-compression.yml
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends squashfs-tools xorriso time libcap2-bin
          sudo python3 -m unittest discover -s os/tests -p test_compression.py -v |& tee /tmp/harness-compression-tests.log
      - uses: actions/download-artifact@v6
        with:
          name: programmer-os-x86_64
          path: os/dist
          run-id: ${{ inputs.image_run_id || '37149350400' }}
          github-token: ${{ github.token }}
      - name: Measure unchanged filesystem at three compression levels
        env:
          ISO_SHA256: ${{ inputs.iso_sha256 || 'efa4e740989770ef7fa40e259f4055d670c5531fcecdf4fcf23f1ae31bb8d380' }}
        run: sudo python3 os/tests/payload_compression.py --iso os/dist/*.iso --sha256 "$ISO_SHA256"
      - name: Retain evidence without images or extracted files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: harness-os-compression
          path: |
            /tmp/harness-compression-tests.log
            os/test-results/compression/*.json
            os/test-results/compression/*.json.gz
            os/test-results/compression/*.log
            os/test-results/compression/*.time
          retention-days: 14
          compression-level: 0
