name: Home Assistant checks

# Only changes used by this suite start the expensive browser/native checks.
# Automatic invocations are selected by ci.yml; standalone runs remain available.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  home-assistant-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.2'
      - name: Install the locked native engine and browser runtimes from scratch
        run: |
          bash store/agents/home-assistant/toolchain/setup.sh
          node store/agents/home-assistant/node_modules/playwright-core/cli.js install --with-deps chromium
          {
            echo "HA_PYTHON=$GITHUB_WORKSPACE/store/agents/home-assistant/.runtime/core/bin/python"
            echo "HA_DSH_DIR=$GITHUB_WORKSPACE/store/agents/home-assistant"
            echo "PLAYWRIGHT_MODULE=$GITHUB_WORKSPACE/store/agents/home-assistant/node_modules/playwright-core/index.mjs"
          } >> "$GITHUB_ENV"
      - name: Test native timers, fixtures, isolation, drafts and failure preservation
        run: node --test store/agents/home-assistant/test/*.test.mjs
      - name: Edit, revise, export and reopen distinct automation workflows in Chromium
        env:
          HA_EVIDENCE_DIR: work/home-assistant-evidence
        run: node store/agents/home-assistant/test/browser.mjs
      - name: Independently verify portable ZIPs, calls, states and exported Core schemas
        run: '"$HA_PYTHON" -I store/agents/home-assistant/test/verify-delivery.py work/home-assistant-evidence'
