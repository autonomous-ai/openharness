name: Harness OS private Apple Silicon installer media

on:
  workflow_dispatch:
    inputs:
      image_run_id:
        description: Successful private Asahi image workflow run
        type: string
        required: true
      image_source:
        description: Exact image producer source commit
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: harness-asahi-media-${{ github.ref }}
  cancel-in-progress: false

jobs:
  media:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      IMAGE_RUN: ${{ inputs.image_run_id || '37523740636' }}
      IMAGE_SOURCE: ${{ inputs.image_source || 'b3cd5b062e8988ba1b640228a78857f8e7475184' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Verify the frozen image producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$IMAGE_RUN" =~ ^[0-9]+$ ]]
          [[ "$IMAGE_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          mkdir -p os/work/asahi-media-output
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$IMAGE_RUN" > os/work/asahi-media-output/image-producer.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('os/work/asahi-media-output/image-producer.json'))
          assert run['head_sha'] == os.environ['IMAGE_SOURCE']
          assert run['path'] == '.github/workflows/os-asahi-image.yml'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          PY
      - uses: actions/download-artifact@v6
        with:
          name: harness-asahi-private-disk
          run-id: ${{ env.IMAGE_RUN }}
          github-token: ${{ github.token }}
          path: os/work/asahi-image-input
      - uses: actions/download-artifact@v6
        with:
          name: harness-asahi-image-evidence
          run-id: ${{ env.IMAGE_RUN }}
          github-token: ${{ github.token }}
          path: os/work/asahi-image-evidence
      - name: Check media contracts and prepare native builder
        run: |
          python3 -m unittest discover -s os/tests -p 'test_asahi_*.py'
          df -h . "$RUNNER_TEMP"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends podman zstd
          (cd os/work/asahi-image-input && sha256sum -c SHA256SUMS)
          zstd -d --sparse os/work/asahi-image-input/harness-asahi-private.raw.zst -o os/work/asahi-image-input/payload.raw
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          lock = json.load(open('os/platforms/apple-silicon/source.lock.json'))
          print('BUILDER_IMAGE=' + lock['builder_image'])
          print('UPSTREAM_REPO=' + lock['upstream']['repository'])
          print('UPSTREAM_BRANCH=' + lock['upstream']['branch'])
          print('UPSTREAM_COMMIT=' + lock['upstream']['commit'])
          PY
      - name: Fetch the reviewed Fedora Asahi description
        run: |
          git clone --branch "$UPSTREAM_BRANCH" "$UPSTREAM_REPO" os/work/asahi-upstream
          git -C os/work/asahi-upstream checkout --detach "$UPSTREAM_COMMIT"
          sudo podman pull --arch arm64 "$BUILDER_IMAGE"
          sudo podman image inspect "$BUILDER_IMAGE" > os/work/asahi-media-output/builder-image.json
      - name: Build and inspect private offline UEFI media
        run: |
          sudo podman run --rm --privileged --arch arm64 \
            --mount type=bind,source=/dev,target=/dev \
            --mount "type=bind,source=$PWD,target=/source,readonly" \
            --mount "type=bind,source=$PWD/os/work/asahi-media-output,target=/output" \
            -e IMAGE_SOURCE="$IMAGE_SOURCE" "$BUILDER_IMAGE" /bin/bash -euo pipefail -c '
              manager=$(command -v dnf5 || command -v microdnf)
              "$manager" install -y --setopt=install_weak_deps=False --setopt=gpgcheck=True \
                python3 git rpm kiwi kiwi-systemdeps-iso-media distribution-gpg-keys \
                squashfs-tools xorriso util-linux zstd
              python3 /source/os/tools/asahi_media.py \
                --upstream /source/os/work/asahi-upstream \
                --image /source/os/work/asahi-image-input/payload.raw \
                --receipt /source/os/work/asahi-image-evidence/inspection/receipt.json \
                --producer /output/image-producer.json --image-source "$IMAGE_SOURCE" \
                --output /output/recipe
              kiwi-ng --debug --type=iso --profile=HarnessInstall system build \
                --description /output/recipe/description --target-dir /output/media
              python3 /source/os/tests/asahi_media_check.py \
                --iso /output/media/Harness-Asahi-Installer.aarch64-0.0.0.iso \
                --identity /output/recipe/media-inputs.json --output /output/inspection
              cd /output/media
              sha256sum Harness-Asahi-Installer.aarch64-0.0.0.iso > SHA256SUMS
            '
      - name: Retain construction evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: harness-asahi-media-evidence
          path: |
            os/work/asahi-media-output/builder-image.json
            os/work/asahi-media-output/image-producer.json
            os/work/asahi-media-output/recipe/media-inputs.json
            os/work/asahi-media-output/recipe/description/config.xml
            os/work/asahi-media-output/recipe/description/COPYING
            os/work/asahi-media-output/media/*.packages
            os/work/asahi-media-output/media/kiwi.result.json
            os/work/asahi-media-output/media/build/image-root.log
            os/work/asahi-media-output/inspection/
          if-no-files-found: error
          retention-days: 7
      - name: Retain private media only after inspection
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: harness-asahi-private-installer
          path: |
            os/work/asahi-media-output/media/Harness-Asahi-Installer.aarch64-0.0.0.iso
            os/work/asahi-media-output/media/SHA256SUMS
            os/work/asahi-media-output/recipe/media-inputs.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
