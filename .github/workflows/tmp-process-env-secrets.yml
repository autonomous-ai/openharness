name: tmp process-env-secrets spike (temporary)

# TEMPORARY, removed before the pull request (docs/plans/2026-11-15-process-env-secrets-plan.md, Task 0).
# It answers one question for Hermes and Codex, on Linux and on macOS: which process of a pane's tree holds the
# engine's store open (`<home>/state.db`, `<home>/sessions/**/rollout-*.jsonl`), from when and until when. The
# daemon is to find a home from that path once it no longer reads another process's environment.
#
# Its limits (PM, 2026-11-15): two jobs and no matrix, 20 minutes each, read-only and no secret, no cache and no
# artifact. Everything runs under a throwaway root in $RUNNER_TEMP, each engine pointed at a provider on loopback
# with a key that is no key. A listing prints the PATHS of the descriptors that name a store, never a process's
# environment and never a file's content. The lines that start `SPIKE system=` are the result.
on:
  push:
    branches: [fix/process-env-secrets]

permissions:
  contents: read

env:
  # cli-e2e.yml's pin, the runtime the CLI ships on.
  CLI_NODE_VERSION: 24.22.2
  # One script for both jobs, run as `bash -c "$SPIKE" spike <step>`; no checkout, so it reads nothing of the repo.
  SPIKE: |
    set -uo pipefail
    step=${1:?step}
    case "$(uname -s)" in
      Linux) SYSTEM=linux; export LANG=C.UTF-8 ;;
      Darwin) SYSTEM=macos; export LANG=en_US.UTF-8 ;;
      *) echo "::error title=spike::no such system: $(uname -s)"; exit 1 ;;
    esac
    ROOT="$RUNNER_TEMP/spike"
    SUMMARY="$ROOT/summary.txt"
    # Nothing listens on the discard port: the engine gets no answer, and no account is needed.
    DEAD_URL=http://127.0.0.1:9/v1
    ANSWER_PORT=47911
    ANSWER_URL="http://127.0.0.1:$ANSWER_PORT/v1"
    PROMPT='Reply with the word ok.'

    fail() { echo "::error title=spike::$*"; exit 1; }
    note() { echo "$*" | tee -a "$SUMMARY"; }
    tm() { tmux -L spike -f /dev/null "$@"; }

    if [ "$step" = setup ]; then
      mkdir -p "$ROOT/home" "$ROOT/codex-home" "$ROOT/hermes-home" "$ROOT/npm" "$ROOT/npm-global" \
        "$ROOT/sandbox-home/.hermes" "$ROOT/work-codex" "$ROOT/work-hermes" "$ROOT/work-hermes-unshare" || fail "no root"
      : > "$SUMMARY"
      if [ "$SYSTEM" = linux ]; then
        # scripts/apt-install.sh's shape, inline: a mirror outage costs a bounded wait, not the run (#4186).
        installed=0
        for wait_s in 30 60 0; do
          if sudo timeout 180 apt-get -q -o Acquire::Retries=3 update \
            && sudo timeout 180 apt-get -q -o Acquire::Retries=3 install -y --no-install-recommends tmux lsof; then
            installed=1; break
          fi
          [ "$wait_s" -gt 0 ] && sleep "$wait_s"
        done
        [ "$installed" = 1 ] || fail "apt could not install tmux and lsof"
      else
        command -v tmux || brew install tmux || fail "brew could not install tmux"
      fi
      tmux -V && command -v lsof || fail "no tmux or no lsof"
      # The job's own provider, used only when an engine writes its store after an answer alone: one fixed answer to
      # any request, Responses (Codex) and Chat Completions (Hermes). It logs nothing.
      cat > "$ROOT/answer.cjs" <<'JS'
    const http = require('node:http')
    const text = 'ok'
    const usage = { prompt_tokens: 1, completion_tokens: 1, total_tokens: 2 }
    const send = (res, status, type, payload) => { res.writeHead(status, { 'content-type': type }); res.end(payload) }
    const json = (res, value) => send(res, 200, 'application/json', JSON.stringify(value))
    const stream = (res, parts) => send(res, 200, 'text/event-stream', parts.join(''))
    const data = (value) => `data: ${JSON.stringify(value)}\n\n`
    const event = (value) => `event: ${value.type}\n${data(value)}`
    http.createServer((req, res) => {
      const chunks = []
      req.on('data', (chunk) => chunks.push(chunk))
      req.on('end', () => {
        let body = {}
        try { body = JSON.parse(Buffer.concat(chunks).toString('utf8') || '{}') } catch {}
        const path = (req.url || '').split('?')[0]
        if (path.endsWith('/models')) {
          return json(res, { object: 'list', data: [{ id: 'spike-model', object: 'model', created: 0, owned_by: 'spike' }] })
        }
        if (path.endsWith('/responses')) {
          const message = { type: 'message', id: 'msg_spike', role: 'assistant', status: 'completed',
            content: [{ type: 'output_text', text, annotations: [] }] }
          return stream(res, [
            event({ type: 'response.created', response: { id: 'resp_spike' } }),
            event({ type: 'response.output_item.done', output_index: 0, item: message }),
            event({ type: 'response.completed',
              response: { id: 'resp_spike', output: [message], usage: { input_tokens: 1, output_tokens: 1, total_tokens: 2 } } }),
          ])
        }
        if (path.endsWith('/chat/completions')) {
          const base = { id: 'chatcmpl-spike', created: 0, model: body.model || 'spike-model' }
          if (body.stream) {
            return stream(res, [
              data({ ...base, object: 'chat.completion.chunk',
                choices: [{ index: 0, delta: { role: 'assistant', content: text }, finish_reason: null }] }),
              data({ ...base, object: 'chat.completion.chunk', choices: [{ index: 0, delta: {}, finish_reason: 'stop' }], usage }),
              'data: [DONE]\n\n',
            ])
          }
          return json(res, { ...base, object: 'chat.completion',
            choices: [{ index: 0, message: { role: 'assistant', content: text }, finish_reason: 'stop' }], usage })
        }
        send(res, 404, 'application/json', '{"error":{"message":"not served"}}')
      })
    }).listen(Number(process.argv[2]), '127.0.0.1')
    JS
      exit 0
    fi

    if [ "$step" = summary ]; then
      echo "== spike result, $SYSTEM =="
      echo "Each holder is relation:comm:pid:path. relation: selected (the topmost engine process of the pane), engine-child"
      echo "(its one direct child that is the engine too), other (anything else in the pane's tree), other-outside (a process"
      echo "outside the pane's tree)."
      grep '^SPIKE ' "$SUMMARY" 2>/dev/null || echo "no result was recorded"
      exit 0
    fi

    # Every later step runs under the throwaway root alone.
    export HOME="$ROOT/home" CODEX_HOME="$ROOT/codex-home" HERMES_HOME="$ROOT/hermes-home"
    export NPM_CONFIG_PREFIX="$ROOT/npm-global" NPM_CONFIG_UPDATE_NOTIFIER=false
    export PATH="$ROOT/npm/node_modules/.bin:$HOME/.local/bin:$NPM_CONFIG_PREFIX/bin:$PATH"

    # Prints the version that `--version` names: the first vX.Y.Z, else the first X.Y.Z.
    version_of() {
      "$1" --version 2>&1 | awk '!v && match($0, /v[0-9]+\.[0-9]+\.[0-9]+/) { v = substr($0, RSTART + 1, RLENGTH - 1) }
        !w && match($0, /[0-9]+\.[0-9]+\.[0-9]+/) { w = substr($0, RSTART, RLENGTH) } END { print (v ? v : w) }'
    }
    at_least() {
      awk -v a="$1" -v b="$2" 'BEGIN { split(a, x, "."); split(b, y, ".")
        for (i = 1; i <= 3; i++) { if (x[i] + 0 > y[i] + 0) exit 0; if (x[i] + 0 < y[i] + 0) exit 1 } exit 0 }'
    }

    if [ "$step" = install-codex ]; then
      npm install --prefix "$ROOT/npm" --no-audit --no-fund @openai/codex || fail "npm could not install @openai/codex"
      codex --version || fail "codex does not run"
      note "SPIKE system=$SYSTEM engine=codex moment=version release=$(version_of codex)"
      exit 0
    fi

    if [ "$step" = install-hermes ]; then
      # engineInstall.ts's command for Hermes, under the throwaway HOME.
      curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash </dev/null || fail "Hermes's installer failed"
      command -v hermes || fail "the installer left no hermes on PATH"
      hermes --version
      release=$(version_of hermes)
      note "SPIKE system=$SYSTEM engine=hermes moment=version release=${release:-unknown}"
      # A Hermes with no hook starts at 0.21.6 (#4239): an older one answers another question.
      [ -n "$release" ] && at_least "$release" 0.21.6 || fail "Hermes ${release:-with no version} is not 0.21.6 or later"
      : > "$ROOT/hermes-ok"
      exit 0
    fi

    case "$step" in
      run-codex)
        ENGINE=codex LABEL=codex WORK="$ROOT/work-codex" EXIT_CMD=/quit LAUNCH=codex
        STORE_RE='/sessions/.*rollout-[^/]*\.jsonl$'
        export SPIKE_NO_KEY=not-a-key
        command -v codex >/dev/null || { note "SPIKE system=$SYSTEM engine=codex holders=not-run reason=not-installed"; exit 1; } ;;
      run-hermes|run-hermes-unshare)
        ENGINE=hermes EXIT_CMD=/exit LAUNCH=hermes
        STORE_RE='/state\.db$'
        export OPENAI_API_KEY=not-a-key
        if [ "$step" = run-hermes ]; then LABEL=hermes STORE_HOME=$HERMES_HOME
        else LABEL=hermes-unshare STORE_HOME="$ROOT/sandbox-home/.hermes"
        fi
        WORK="$ROOT/work-$LABEL"
        [ -e "$ROOT/hermes-ok" ] || { note "SPIKE system=$SYSTEM engine=$LABEL holders=not-run reason=no-hermes-0.21.6"; exit 1; } ;;
      *) fail "no such step: $step" ;;
    esac
    export STORE_RE

    store_present() {
      if [ "$ENGINE" = codex ]; then [ -n "$(find "$CODEX_HOME/sessions" -name 'rollout-*.jsonl' 2>/dev/null | head -n 1)" ]
      else [ -e "$STORE_HOME/state.db" ]
      fi
    }
    write_config() {
      if [ "$ENGINE" = codex ]; then
        cat > "$CODEX_HOME/config.toml" <<EOF
    model = "spike-model"
    model_provider = "spike"
    check_for_update_on_startup = false

    [model_providers.spike]
    name = "spike"
    base_url = "$1"
    env_key = "SPIKE_NO_KEY"
    wire_api = "responses"

    [projects."$WORK"]
    trust_level = "trusted"
    EOF
      else
        mkdir -p "$STORE_HOME"
        printf 'model:\n  default: spike-model\n  provider: custom\n  base_url: %s\n  api_key: not-a-key\n' "$1" > "$STORE_HOME/config.yaml"
        printf 'OPENAI_API_KEY=not-a-key\n' > "$STORE_HOME/.env"
      fi
    }

    comm_of() { local c; c=$(ps -o comm= -p "$1" 2>/dev/null); c=${c##*/}; printf '%s' "${c:-gone}"; }
    is_engine() {
      local comm args; comm=$(comm_of "$1"); args=$(ps -o args= -p "$1" 2>/dev/null)
      case "$ENGINE:$comm" in
        codex:codex|hermes:hermes*) return 0 ;;
        codex:node) case "$args" in *codex*) return 0 ;; esac ;;
        hermes:[Pp]ython*) case "$args" in *hermes*) return 0 ;; esac ;;
      esac
      return 1
    }
    ppid_of() { printf '%s\n' "$PS_ROWS" | awk -v p="$1" '$1 == p { print $2; exit }'; }
    # TREE: the pane's shell and everything under it. SELECTED: the topmost engine process in it, the one the daemon's
    # discovery takes. CHILD: the one direct child of SELECTED that is the engine too (npm's Node launcher of Codex
    # and the native codex under it), none when there are two.
    snapshot() {
      local shell_pid pid parent kids='' n=0
      shell_pid=$(tm display-message -p -t "$LABEL" '#{pane_pid}' 2>/dev/null)
      PS_ROWS=$(ps -A -o pid=,ppid=)
      TREE=$(printf '%s\n' "$PS_ROWS" | awk -v root="$shell_pid" '{ parent[$1] = $2; order[NR] = $1 }
        END { keep[root] = 1; grew = 1
          while (grew) { grew = 0; for (i = 1; i <= NR; i++) { p = order[i]; if (!(p in keep) && (parent[p] in keep)) { keep[p] = 1; grew = 1 } } }
          for (i = 1; i <= NR; i++) if (order[i] in keep) print order[i] }')
      ENGINES='' SELECTED='' CHILD=''
      for pid in $TREE; do is_engine "$pid" && ENGINES="$ENGINES $pid"; done
      for pid in $ENGINES; do
        parent=$(ppid_of "$pid")
        case " $ENGINES " in *" $parent "*) ;; *) [ -z "$SELECTED" ] && SELECTED=$pid ;; esac
      done
      [ -n "$SELECTED" ] || return 0
      for pid in $ENGINES; do [ "$(ppid_of "$pid")" = "$SELECTED" ] && { kids=$pid; n=$((n + 1)); }; done
      [ "$n" = 1 ] && CHILD=$kids
      return 0
    }
    engine_running() { snapshot; [ -n "$SELECTED" ]; }
    engine_gone() { snapshot; [ -z "${ENGINES// /}" ]; }

    # The paths of one process's descriptors that name a store: readlink of /proc/<pid>/fd/<n> on Linux, the n lines
    # of lsof -Fn on macOS. Every other path is dropped here.
    held_paths() {
      if [ "$SYSTEM" = linux ]; then
        for fd in /proc/"$1"/fd/*; do readlink "$fd"; done 2>/dev/null
      else
        lsof -n -P -w -p "$1" -Fn 2>/dev/null | sed -n 's/^n//p'
      fi | grep -E -- "$STORE_RE" | sort -u
    }
    # The same for every process of the job's user outside the pane's tree: a holder there is one the daemon would
    # never list, which is the case the plan's verdict calls lost.
    outside_held() {
      local tree
      tree=" $(printf '%s ' $TREE)"
      if [ "$SYSTEM" = linux ]; then
        find /proc/[0-9]*/fd -mindepth 1 -maxdepth 1 -printf '%h %l\n' 2>/dev/null \
          | awk '{ split($1, part, "/"); path = substr($0, length($1) + 2); if (path ~ ENVIRON["STORE_RE"]) print part[3], path }'
      else
        lsof -n -P -w -u "$(id -u)" -Fpn 2>/dev/null \
          | awk '/^p/ { pid = substr($0, 2) } /^n/ { path = substr($0, 2); if (path ~ ENVIRON["STORE_RE"]) print pid, path }'
      fi | sort -u | while read -r pid path; do
        case "$tree" in *" $pid "*) ;; *) printf '%s %s\n' "$pid" "$path" ;; esac
      done
    }

    list_moment() {
      local moment=$1 store=absent holders='' selected=none child=none pid rel path
      store_present && store=present
      snapshot
      [ -n "$SELECTED" ] && selected="$(comm_of "$SELECTED"):$SELECTED"
      [ -n "$CHILD" ] && child="$(comm_of "$CHILD"):$CHILD"
      echo "-- $LABEL, $PROVIDER provider, $moment: the pane's tree (pid ppid comm)"
      for pid in $TREE; do echo "   $pid $(ppid_of "$pid") $(comm_of "$pid")"; done
      for pid in $TREE; do
        rel=other
        [ "$pid" = "$SELECTED" ] && rel=selected
        [ "$pid" = "$CHILD" ] && rel=engine-child
        while read -r path; do [ -n "$path" ] && holders="$holders;$rel:$(comm_of "$pid"):$pid:$path"; done <<EOF
    $(held_paths "$pid")
    EOF
      done
      while read -r pid path; do [ -n "$pid" ] && holders="$holders;other-outside:$(comm_of "$pid"):$pid:$path"; done <<EOF
    $(outside_held)
    EOF
      holders=${holders#;}
      note "SPIKE system=$SYSTEM engine=$LABEL provider=$PROVIDER moment=$moment t=$(( $(date +%s) - START ))s store=$store" \
        "selected=$selected engine_child=$child" \
        "${EXITED_BY:+exited_by=$EXITED_BY }holders=${holders:-none}"
    }

    pane() { tm capture-pane -p -t "$LABEL" 2>/dev/null; }
    pane_has() { pane | grep -qF -- "$1"; }
    show_pane() { echo "-- $LABEL's screen, $1:"; pane | sed -e '/^[[:space:]]*$/d' | tail -n 20 | sed 's/^/   | /'; }
    # Waits up to $1 seconds for the rest of the line, as a command, to succeed.
    wait_for() { local bound=$1 i=0; shift; until "$@"; do i=$((i + 1)); [ "$i" -gt "$bound" ] && return 1; sleep 1; done; }
    pane_settled() {
      local now; now=$(pane)
      if [ -n "${now//[[:space:]]/}" ] && [ "$now" = "$LAST_PANE" ]; then SETTLED=$((SETTLED + 1)); else SETTLED=0; fi
      LAST_PANE=$now
      [ "$SETTLED" -ge 3 ]
    }
    settle() { SETTLED=0 LAST_PANE=''; wait_for "$1" pane_settled || echo "$LABEL's screen was still changing after $1 s"; }
    # Enter only once the text is drawn: a TUI that takes keys in a burst as a paste would take that Enter as a newline.
    type_line() { tm send-keys -t "$LABEL" -l -- "$1"; wait_for 10 pane_has "$1" || true; tm send-keys -t "$LABEL" Enter; }
    # The store, after the prompt: Enter again every 10 s, for an Enter that still became a newline.
    wait_store() {
      local i=0
      until store_present; do
        i=$((i + 1)); [ "$i" -gt 40 ] && return 1
        [ $((i % 10)) = 0 ] && tm send-keys -t "$LABEL" Enter
        sleep 1
      done
    }
    stop_engine() {
      local i
      EXITED_BY=$EXIT_CMD; type_line "$EXIT_CMD"; wait_for 20 engine_gone && return
      EXITED_BY=ctrl-c; for i in 1 2 3 4; do tm send-keys -t "$LABEL" C-c; wait_for 3 engine_gone && return; done
      EXITED_BY=term; snapshot; [ -n "${ENGINES// /}" ] && kill -TERM $ENGINES 2>/dev/null; wait_for 5 engine_gone && return
      EXITED_BY=kill; snapshot; [ -n "${ENGINES// /}" ] && kill -KILL $ENGINES 2>/dev/null; wait_for 5 engine_gone
    }

    # One session of the engine in a pane of its own, in an empty folder: 0 with its four listings, 1 when it wrote no
    # store, 2 when it did not start.
    attempt() {
      PROVIDER=$1 EXITED_BY=''
      local url=$DEAD_URL; [ "$PROVIDER" = answering ] && url=$ANSWER_URL
      write_config "$url"
      START=$(date +%s)
      tm new-session -d -s "$LABEL" -x 200 -y 50 -c "$WORK" 'bash --noprofile --norc' || fail "tmux opened no pane"
      wait_for 10 pane_has '$' || show_pane "no shell prompt"
      tm send-keys -t "$LABEL" -l -- "$LAUNCH"; tm send-keys -t "$LABEL" Enter
      if ! wait_for 60 engine_running; then
        show_pane "$LABEL did not start"
        note "SPIKE system=$SYSTEM engine=$LABEL provider=$PROVIDER moment=start holders=not-run reason=did-not-start"
        tm kill-session -t "$LABEL"; return 2
      fi
      settle 60; show_pane "prompt drawn"
      list_moment prompt-drawn
      type_line "$PROMPT"
      if ! wait_store; then
        show_pane "no store 40 s after the prompt"
        list_moment prompt-typed; stop_engine; list_moment after-exit
        tm kill-session -t "$LABEL"; return 1
      fi
      settle 30; show_pane "after the prompt"
      list_moment prompt-typed
      # The plan's listing a minute on: does the holder keep the file open while the engine sits idle?
      sleep 60
      list_moment plus-60s
      stop_engine
      list_moment after-exit
      tm kill-session -t "$LABEL"
      return 0
    }
    run_engine() {
      local result
      attempt dead; result=$?
      [ "$result" = 1 ] || return "$result"
      echo "$LABEL wrote no store with no answer: once more, against the job's own provider"
      node "$ROOT/answer.cjs" "$ANSWER_PORT" & ANSWER_PID=$!
      wait_for 10 curl -fsS -o /dev/null "$ANSWER_URL/models" || fail "the job's provider did not answer"
      attempt answering; result=$?
      [ "$result" = 1 ] && note "SPIKE system=$SYSTEM engine=$LABEL moment=verdict holders=none reason=no-store-even-answered"
      return "$result"
    }
    cleanup() { tm kill-server 2>/dev/null; [ -n "${ANSWER_PID:-}" ] && kill "$ANSWER_PID" 2>/dev/null; return 0; }
    trap cleanup EXIT
    ANSWER_PID=''
    tm kill-server 2>/dev/null

    if [ "$step" = run-hermes-unshare ]; then
      # cli/e2e/harness/fakeHermes.mjs's 'remapped' sandbox: a private /tmp, HOME at /tmp/home bound from a folder of
      # the root, a /dev/pts of its own; listed from outside, its path printed as read.
      if ! unshare --user --map-root-user --mount --pid --fork -- /bin/sh -c \
        'mount -t tmpfs tmpfs /tmp && mount -t devpts -o newinstance devpts /dev/pts'; then
        note "SPIKE system=$SYSTEM engine=$LABEL holders=not-run reason=unshare-refused"
        exit 0
      fi
      inside='mount -t tmpfs tmpfs /tmp && mkdir -p /tmp/home /tmp/work && mount --bind "$1" /tmp/home'
      inside="$inside"' && mount --bind "$PWD" /tmp/work && mount -t devpts -o newinstance devpts /dev/pts && cd /tmp/work'
      inside="$inside"' && HOME=/tmp/home && export HOME && unset HERMES_HOME && shift && exec "$@"'
      printf '#!/bin/sh\nexec unshare --user --map-root-user --mount --pid --fork -- /bin/sh -c %s sh %s %s\n' \
        "'$inside'" "$ROOT/sandbox-home" "$(command -v hermes)" > "$ROOT/hermes-unshare.sh"
      chmod +x "$ROOT/hermes-unshare.sh"
      LAUNCH="$ROOT/hermes-unshare.sh"
    fi
    run_engine

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.CLI_NODE_VERSION }}
          # No cache of any kind leaves the run.
          package-manager-cache: false
      - name: Throwaway root, tmux and lsof
        timeout-minutes: 4
        run: bash -c "$SPIKE" spike setup
      - name: Install Codex
        timeout-minutes: 3
        run: bash -c "$SPIKE" spike install-codex
      - name: Codex
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: bash -c "$SPIKE" spike run-codex
      - name: Install Hermes
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: bash -c "$SPIKE" spike install-hermes
      - name: Hermes
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: bash -c "$SPIKE" spike run-hermes
      - name: Hermes in unshare
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: bash -c "$SPIKE" spike run-hermes-unshare
      - name: Summary
        if: ${{ always() }}
        timeout-minutes: 1
        run: bash -c "$SPIKE" spike summary

  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.CLI_NODE_VERSION }}
          package-manager-cache: false
      - name: Throwaway root and tmux
        timeout-minutes: 4
        run: bash -c "$SPIKE" spike setup
      - name: Install Codex
        timeout-minutes: 3
        run: bash -c "$SPIKE" spike install-codex
      - name: Codex
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: bash -c "$SPIKE" spike run-codex
      - name: Install Hermes
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: bash -c "$SPIKE" spike install-hermes
      - name: Hermes
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: bash -c "$SPIKE" spike run-hermes
      - name: Summary
        if: ${{ always() }}
        timeout-minutes: 1
        run: bash -c "$SPIKE" spike summary
