name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mouse-diagnosis:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, target: x86_64-unknown-linux-musl}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d50f29865e8cefdd37cea603e01669feda0a03bc
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: tui
          shared-key: tui-${{ matrix.target }}
          cache-bin: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Private fixture dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tmux musl-tools zsh
          npm ci --prefix cli --no-audit --no-fund
      - name: Build the exact reviewed TUI source
        working-directory: tui
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Three bounded runs of both failing mouse journeys, retaining every result
        env:
          HN_DIAG_TARGET: ${{ matrix.target }}
        run: |
          python3 -u - <<'PYTEST'
          import os, pathlib, subprocess, json, time
          root=pathlib.Path.cwd()
          out=root/'.harness/validation/mouse-diagnosis'
          out.mkdir(parents=True)
          binary=root/'tui/target'/os.environ['HN_DIAG_TARGET']/'release/harness-tui'
          results=[]
          for index in range(1,4):
              for name,prefix,port in [('workspace-controls','HN_WORKSPACE',19920+index-1),('new-harness','HN_NEW_UI',19786+index-1)]:
                  label=f'{name}-{index}'
                  env=dict(os.environ,**{prefix+'_BINARY':str(binary),prefix+'_PORT':str(port),prefix+'_OUTPUT':str(out/label)})
                  started=time.monotonic()
                  with (out/(label+'.log')).open('wb') as log:
                      try:
                          code=subprocess.run(['python3','-u',str(root/'tui/tests'/(name+'.py'))],env=env,stdout=log,stderr=subprocess.STDOUT,timeout=120).returncode
                      except subprocess.TimeoutExpired:
                          code=124
                  results.append(dict(name=label,exit_code=code,seconds=time.monotonic()-started))
                  (out/'results.json').write_text(json.dumps(results,indent=2))
                  print(results[-1],flush=True)
          (out/'source.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD','HEAD^{tree}'],text=True))
          raise SystemExit(int(any(r['exit_code'] for r in results)))
          PYTEST
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mouse-diagnosis-${{ matrix.target }}
          path: .harness/validation/mouse-diagnosis/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
