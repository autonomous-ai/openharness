name: CI

# Fast PR checks: each changed component, and each that reads a changed file, runs its own Linux unit tests. End to end
# runs where a PR's paths touch what it tests: windows.yml's Windows checks, the CLI e2e files a PR adds or changes on
# Linux (above 40, the whole suite), the dial's hosts, and Harness Device on Windows and Linux. The full CLI end-to-end
# suite (nightly and by hand), macOS, native, coverage-gate and browser checks stay outside PR CI; see
# docs/validation-and-release.md#what-pr-ci-does-not-run. Merge candidates rerun
# only the plan and process checks; the PR run covered the code. After Update branch,
# a suite whose inputs main's new commits left untouched reuses the earlier head's result.
# Contributor code runs with a read-only token and no release credentials.
on:
  pull_request:
    branches: [main, 'ci-rollout/**']
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      scope:
        description: 'Affected component; full for core suites, all for every component'
        type: choice
        options: [full, cli, tui, backend, desktop, process, all, companions, website, os, provider, firmware, pro, mobile, daemons, pty, device-app, windows-e2e, linux-e2e, dial-hosts, device-app-e2e, device-app-update, device-app-desktop, device-app-install, cross-read-scan]
        default: full
      e2e_files:
        description: 'With scope linux-e2e: the cli/e2e files to run, separated by spaces'
        type: string
        default: ''
  workflow_call:
    inputs:
      scope:
        description: 'full, cli, tui, backend, desktop (VM tests), or process (repository tooling only)'
        type: string
        default: full

permissions:
  contents: read

# The managed runtime shipped by the CLI; keep release.yml's pin in sync.
env:
  CLI_NODE_VERSION: 24.22.2
  CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

# Supersede individual PR jobs, not the whole workflow: an always-running final
# gate on an obsolete revision must not hold the next revision's scheduling lock.
# Keep PR event actions separate: synchronize and ready_for_review can arrive
# together for the same head, and must each complete their own required checks.
# New synchronize events still supersede older synchronize jobs.
# Every matrix row has its own group. Explicit runs and merge candidates use run
# IDs, so their requested validation is preserved. Summaries and the final gate
# have no lock: an older aggregate can finish after newer work without cancelling it.

jobs:
  plan:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-plan
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Read-only lookups of an earlier head's ci/required run, whose results an update merge may
    # reuse (docs/validation-and-release.md#reuse-after-update-branch). No write scope.
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      ready: ${{ steps.select.outputs.ready }}
      cli: ${{ steps.select.outputs.cli }}
      desktop: ${{ steps.select.outputs.desktop }}
      tui: ${{ steps.select.outputs.tui }}
      backend: ${{ steps.select.outputs.backend }}
      companions: ${{ steps.select.outputs.companions }}
      website: ${{ steps.select.outputs.website }}
      experience: ${{ steps.select.outputs.experience }}
      authoring: ${{ steps.select.outputs.authoring }}
      home-assistant: ${{ steps.select.outputs.home-assistant }}
      desktop-logging: ${{ steps.select.outputs.desktop-logging }}
      os: ${{ steps.select.outputs.os }}
      provider: ${{ steps.select.outputs.provider }}
      firmware: ${{ steps.select.outputs.firmware }}
      pro: ${{ steps.select.outputs.pro }}
      mobile: ${{ steps.select.outputs.mobile }}
      daemons: ${{ steps.select.outputs.daemons }}
      pty: ${{ steps.select.outputs.pty }}
      device-app: ${{ steps.select.outputs.device-app }}
      windows-e2e: ${{ steps.select.outputs.windows-e2e }}
      windows-e2e-arm64: ${{ steps.select.outputs.windows-e2e-arm64 }}
      linux-e2e: ${{ steps.select.outputs.linux-e2e }}
      linux-e2e-files: ${{ steps.select.outputs.linux-e2e-files }}
      linux-e2e-shards: ${{ steps.select.outputs.linux-e2e-shards }}
      linux-e2e-full: ${{ steps.select.outputs.linux-e2e-full }}
      dial-hosts: ${{ steps.select.outputs.dial-hosts }}
      device-app-e2e: ${{ steps.select.outputs.device-app-e2e }}
      device-app-update: ${{ steps.select.outputs.device-app-update }}
      device-app-desktop: ${{ steps.select.outputs.device-app-desktop }}
      device-app-install: ${{ steps.select.outputs.device-app-install }}
      device-app-builds: ${{ steps.select.outputs.device-app-builds }}
      cross-read-scan: ${{ steps.select.outputs.cross-read-scan }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          fetch-depth: 0
          # Run 37659523265 spent the entire 5-minute planning budget fetching blobs for every
          # historical asset. Keep all commits/trees for merge-base and the complete diff, but
          # materialize only the workflow and planner sources this job reads.
          sparse-checkout: |
            .github
            scripts
      - name: Validate the integration workflows
        # actionlint needs Go 1.25 or newer, and `go run` otherwise switches to the newest toolchain it is told of.
        # On 2026-10-08 that was go1.26.9, listed before it was published (proxy and checksum database: 404), and
        # every PR's planning failed. A toolchain that exists keeps planning off Go's release timing.
        env:
          GOTOOLCHAIN: go1.26.8
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          .github/workflows/ci.yml .github/workflows/cli-e2e.yml .github/workflows/ci-health.yml
          .github/workflows/website-checks.yml .github/workflows/experience-checks.yml
          .github/workflows/authoring-browser-checks.yml .github/workflows/home-assistant-checks.yml
          .github/workflows/desktop-logging-checks.yml .github/workflows/windows.yml .github/workflows/backend-cache.yml
          .github/workflows/cli-e2e-dial-hosts.yml
      - id: select
        env:
          CI_SCOPE: ${{ inputs.scope || 'full' }}
          # Free text: through env and as one argument (never read as an option); the planner takes plain cli/e2e names.
          CI_E2E_FILES: ${{ inputs.e2e_files }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-plan.py --scope "$CI_SCOPE" --e2e-files="$CI_E2E_FILES" --output "$RUNNER_TEMP/ci-plan.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  process-checks:
    outputs:
      local_receipts: ${{ steps.local.outputs.local_receipts }}
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-process-checks
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          sparse-checkout: |
            /.github/
            /scripts/
            /desktop/scripts/
            /cli/scripts/release-cli.sh
            /backend/scripts/release-be.sh
            /.gitattributes
            /.gitignore
            /.gitmodules
            /Makefile
          sparse-checkout-cone-mode: false
      - name: Verify declared source checkout
        run: python3 scripts/ci-source-inputs.py process
      - name: Require local validation receipts for mapped paths
        id: local
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
        run: python3 scripts/local-checks.py
      - name: Validation deadlines, cleanup, receipts and release version guards
        # The fixtures commit in temporary repositories. Each commit starts a detached
        # `git maintenance run --auto`, which can still be writing objects/pack when the
        # test removes the folder (test_queue_validated_pr: "Directory not empty: 'pack'").
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: maintenance.auto
          GIT_CONFIG_VALUE_0: "false"
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Record source inputs for CI evidence reuse
        run: python3 scripts/ci-source-inputs.py process --record "$RUNNER_TEMP/ci-source-inputs.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-source-inputs
          path: ${{ runner.temp }}/ci-source-inputs.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  desktop-tests:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-desktop-tests-${{ strategy.job-index }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.desktop == 'true'
    name: desktop-tests (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        # Six shards split by measured file times (scripts/desktop-test-durations.json): each needs about 6 of its 10
        # minutes on a slow runner, so the suite can grow a fifth before one runs short (task #3458;
        # scripts/tests/test_desktop_tests.py checks the split keeps a quarter of the limit free).
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          sparse-checkout: |
            /.github/
            /scripts/
            /desktop/
            /cli/
            /tests/
            /daemons/
            /store/
            /docs/images/
            /mobile/pubspec.lock
            /backend/src/lib/communityContract.ts
            /backend/src/lib/hubMetricsContract.ts
            /mobile/lib/p2p/terminal_p2p_plugin.dart
            /mobile/lib/p2p/terminal_p2p_link.dart
            /mobile/lib/p2p/terminal_p2p_policy.dart
            /mobile/lib/ws/terminal_transport_plugin.dart
            /mobile/lib/ws/relay_codec.dart
            /mobile/lib/e2ee/relay_session_crypto.dart
            /.gitattributes
            /.gitignore
            /.gitmodules
            /Makefile
          sparse-checkout-cone-mode: false
      - name: Verify declared source checkout
        run: python3 scripts/ci-source-inputs.py desktop
      - id: toolchain
        run: |
          version="$(sed -n "s/^  FLUTTER_VERSION: '\([^']*\)'.*/\1/p" .github/workflows/release-desktop.yml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/desktop-flutter
        with:
          version: ${{ steps.toolchain.outputs.version }}
      - name: Every Desktop shard keeps a quarter of its time limit (task #3458)
        if: matrix.shard == 1
        # Named in full: a renamed test then fails here instead of matching nothing and passing (review of #3241).
        working-directory: scripts/tests
        run: python3 -m unittest -v test_desktop_tests.DurationSplitTests.test_ci_split_leaves_every_shard_a_quarter_of_its_time_limit
      - name: Run bounded Desktop VM shard
        env:
          DESKTOP_SHARD: ${{ matrix.shard }}
        run: python3 scripts/test-desktop.py --shard "$DESKTOP_SHARD/6" --workers 4 --timeout 600
      - name: Preserve complete test logs and receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-shard-${{ matrix.os }}-${{ matrix.shard }}
          path: .harness/validation/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # The optional product has its own dependencies, bundle and suites. CLI-only CI
  # deliberately checks core without installing or building this package.
  companion-subsystems:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-companion-subsystems
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.companions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: companions
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.CLI_NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            cli/package-lock.json
            companions/package-lock.json
      # Shared source helpers retain their own dependency resolution during typecheck.
      - run: npm ci --prefix ../cli --ignore-scripts
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:bundle
      # CPU-budget fuzz runs alone, separate from subprocess-heavy fixture tests.
      - run: npx vitest run src/shared/guard.fuzz.spec.ts --maxWorkers=1
      - run: npm test -- --exclude src/shared/guard.fuzz.spec.ts --maxWorkers=3

  cli-typecheck:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-cli-typecheck
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.CLI_NODE_VERSION }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit

  cli-tests:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-cli-tests-${{ strategy.job-index }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.CLI_NODE_VERSION }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Vitest partitions files using the same config in every shard. Keep the
      # existing worker cap/isolation: subprocess fixtures still need spare CPUs.
      # Opt-in real-engine suites retain their existing explicit skips.
      - name: Discover the complete default-suite inventory
        run: npx vitest list --config vitest.ci.config.ts --filesOnly --json="$RUNNER_TEMP/inventory-${{ matrix.shard }}.json"
      - name: Run default-suite shard
        run: npx vitest run --config vitest.ci.config.ts --shard=${{ matrix.shard }}/4 --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/result-${{ matrix.shard }}.json"
      - name: Preserve inventory and test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cli-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/inventory-${{ matrix.shard }}.json
            ${{ runner.temp }}/result-${{ matrix.shard }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Unit tests only. Native fixtures and connected-shell checks run in the release workflow.
  tui-test:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-tui-test
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.tui == 'true'
    # ubuntu-latest moved to 26.04, which has no zsh package; 24.04 until it does.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tui
          shared-key: tui-pr
          cache-bin: false
      - run: sudo apt-get update && sudo apt-get install -y tmux zsh
      - name: Unit tests
        env:
          TERM: xterm-256color
          COLORTERM: truecolor
        run: env -u NO_COLOR cargo test --locked

  backend-desk:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-backend-desk
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A real Redis for the Redis-backed unit tests, which skip without one: a cache stamp that could repeat passed CI unseen
    # for that reason (review of #2456).
    services:
      redis:
        image: redis:7.2.5
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # The whole backend unit suite (src/**/*.test.ts, including the shared desk layout test): it once ran only the desk
      # test, and main broke 48 team-session tests unseen (#1926).
      - name: Backend unit suite
        run: npm test -- --reporter=default --reporter=json --outputFile.json=vitest-results.json
      - name: The Redis-backed tests ran
        run: node scripts/redis-tests-ran.mjs vitest-results.json

  # The backend integration suite (npm run test:integration, backend/integration), which every backend PR once ran locally
  # for 60-90 minutes behind a per-Mac lock (task #2459). Four shards balanced by integration/ci-durations.json; each
  # integration file starts its own MongoDB replica set (mongodb-memory-server-core), so shards share no database, and the
  # suite opens no Redis (src/lib/noRedis.test-support.ts).
  backend-integration:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-backend-integration-${{ strategy.job-index }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.backend == 'true'
    name: backend-integration (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # The tests download mongod 7.0.24 into $TMPDIR/harness-super-tab-mongodb-binaries (integration/plans.test-support.ts).
      # Restore only: backend-cache.yml saves it from main, where every PR can read it; a PR's own save would be its alone.
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/harness-super-tab-mongodb-binaries
          key: super-tab-mongod-7.0.24-${{ runner.os }}-${{ runner.arch }}
      - name: Backend integration shard
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          npx vitest run --config vitest.integration.ci.config.ts --shard="$SHARD/4"
          --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/integration-$SHARD.json"
      - name: Preserve per-file results (durations refresh integration/ci-durations.json)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-${{ matrix.shard }}
          path: ${{ runner.temp }}/integration-${{ matrix.shard }}.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

  website-checks:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-website-checks
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.website == 'true'
    uses: ./.github/workflows/website-checks.yml

  os-checks:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-os-checks
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.os == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      - name: OS source, installer and update contracts
        run: make -C os check

  provider-checks:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-provider-checks-${{ strategy.job-index }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.provider == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [reference-provider, example-provider]
    defaults:
      run:
        working-directory: provider/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.CLI_NODE_VERSION }}
          cache: npm
          cache-dependency-path: provider/${{ matrix.package }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  firmware-checks:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-firmware-checks
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.firmware == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IDF_PATH: ${{ github.workspace }}/.ci-esp-idf
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      - uses: actions/checkout@v7
        with:
          repository: espressif/esp-idf
          ref: 8c750b088c7cd857d079c0eeb495da199b359461 # v5.5
          path: .ci-esp-idf
          sparse-checkout: |
            components/json
            components/esp_rom
      - name: Prepare the SDK's pinned cJSON source
        run: git -C "$IDF_PATH" submodule update --init --depth 1 components/json/cJSON
      - name: Use Clang for the host fixture warning and sanitizer contracts
        run: |
          clang-18 --version
          mkdir -p "$RUNNER_TEMP/firmware-bin"
          ln -s "$(command -v clang-18)" "$RUNNER_TEMP/firmware-bin/cc"
          echo "$RUNNER_TEMP/firmware-bin" >> "$GITHUB_PATH"
      - name: Run every host firmware contract (physical acceptance remains separate)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          files = sorted(Path('devices/harness-device/firmware/test').glob('test_*.py'))
          assert files, 'firmware test inventory is empty'
          failures = []
          for path in files:
              print(path, flush=True)
              try:
                  subprocess.run(['python3', str(path)], check=True, timeout=120)
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
                  failures.append(str(path))
          if failures:
              raise SystemExit('Failed firmware contracts: ' + ', '.join(failures))
          print(f'Passed all {len(files)} firmware host contracts')
          PY
      - name: Run the Harness Pro host contracts
        env:
          PRO_FONT: ${{ github.workspace }}/devices/harness-pro/firmware/fonts/LiberationSans-Regular.ttf
        run: |
          python3 -m pip install --user --break-system-packages pillow==12.1.1
          bash devices/harness-pro/firmware/test/run.sh
          python3 devices/harness-pro/firmware/test/test_tree_isolation.py
          python3 devices/harness-pro/firmware/test/test_fonts.py

  pro-firmware-build:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-pro-firmware-build
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.pro == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The ESP-IDF release the Harness Pro is built and flashed with (README: ~/esp/esp-idf-5.5.4).
    container: espressif/idf:v5.5.4
    defaults:
      run:
        shell: bash
        working-directory: devices/harness-pro/firmware
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      - name: Build the ESP32-P4 firmware
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          # The font generator needs Pillow; the image's system python3 has no pip, so it goes in the IDF environment.
          python -m pip install pillow==12.1.1
          idf.py -B build -DPROJECT_VER=0.0.99-ci build
      - name: Fit the app in its OTA partition
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          rows = csv.reader(line for line in Path('partitions.csv').read_text().splitlines() if line.strip() and not line.startswith('#'))
          limit = int(next(row[4] for row in rows if row[0].strip() == 'ota_0').strip(), 0)
          size = Path('build/harness_pro.bin').stat().st_size
          print(f'harness_pro.bin: {size} bytes of {limit} in ota_0 ({100 * size / limit:.1f}%)')
          if size > limit:
              raise SystemExit('harness_pro.bin does not fit the ota_0 partition')
          PY

  pro-golden:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-pro-golden
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.pro == 'true'
    # macOS arm64, where the baseline is recorded: the code-drawn shapes (arcs, juggling balls) use float maths whose
    # last bits differ between Apple arm64 and Linux x86-64, so the hashes only match on the same platform.
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      - name: Compare every Pets screen with the golden hashes
        working-directory: devices/harness-pro/firmware
        env:
          PRO_FONT: fonts/LiberationSans-Regular.ttf
        run: |
          python3 -m pip install --user --break-system-packages pillow==12.1.1
          bash test/golden.sh --check

  mobile-checks:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-mobile-checks
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.mobile == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      - id: toolchain
        run: |
          version="$(sed -n "s/^  FLUTTER_VERSION: '\([^']*\)'.*/\1/p" .github/workflows/release-desktop.yml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.toolchain.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: flutter test --no-pub --concurrency 4 --reporter expanded
        working-directory: mobile

  daemons-checks:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-daemons-checks
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.daemons == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.CLI_NODE_VERSION }}
      - run: node --test daemons/tools/card.test.mjs daemons/tools/generate.test.mjs

  # The Harness PTY host (pty/, on term/): its Rust tests, then the CLI's terminal contract for the
  # ptyhost backend against the host just built (tmux's half needs tmux and runs locally). Selected by
  # pty/, term/, the vendored terminal and the CLI's code (scripts/ci-plan.py ALSO, PR_READS), and by installer/, whose
  # model and steps (harness-install.exe) are plain Rust that tests here.
  pty-checks:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-pty-checks
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.pty == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            pty
            term
            installer
          shared-key: pty-pr
          cache-bin: false
      - name: Terminal and host unit tests
        run: |
          cargo test --locked --manifest-path term/Cargo.toml
          cargo build --locked --manifest-path pty/Cargo.toml
          cargo test --locked --manifest-path pty/Cargo.toml
          cargo test --locked --manifest-path installer/Cargo.toml
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.CLI_NODE_VERSION }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: cli
      - name: ptyhost terminal contract
        working-directory: cli
        env:
          RUN_TERMINAL_CONTRACT: '1'
          HARNESS_PTY_BIN: ${{ github.workspace }}/pty/target/debug/harness-pty
        run: npx vitest run src/lib/ptyHostBackend.contract.spec.ts --maxWorkers=1

  # The Harness Device menu-bar app (device-app/, Rust and Tauri): the release scripts' tests, the UI's typecheck,
  # Vitest and bundle, then the Rust unit tests on Linux; on Windows, the lib's unit tests. The macOS code is not
  # compiled here; it is built and tested on a Mac.
  device-app-checks:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-device-app-checks-${{ strategy.job-index }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.device-app == 'true'
    name: device-app-checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # apt-install.sh can take about 19.5 minutes to give up in a mirror outage, and a cold Tauri compile follows.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      # The release rules (device-app/scripts): versions, refs and the commit on main, the manifest, the publish order
      # and the release command, against temp Git repositories and fake gcloud, curl and gh. Nothing leaves 127.0.0.1.
      - name: Release script tests
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s device-app/scripts -p 'test_*.py' -v
      # Tauri's Linux packages: the webview, the tray, SVG icons, and libxdo, which its menu crate links. Then, for the
      # live X11 front source: xvfb (an X server), openbox (a window manager, which keeps _NET_ACTIVE_WINDOW), xdotool
      # (brings a window to the front) and xterm (the X client brought there).
      - if: runner.os == 'Linux'
        run: >-
          sudo bash scripts/apt-install.sh libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
          xvfb openbox xdotool xterm
      - if: runner.os == 'Linux'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.CLI_NODE_VERSION }}
          cache: npm
          cache-dependency-path: device-app/ui/package-lock.json
      # The binary embeds ui/dist, so the bundle is built before the Rust tests compile it.
      - name: UI tests and bundle
        if: runner.os == 'Linux'
        working-directory: device-app/ui
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npx vitest run
          npm run build
      - if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: device-app/src-tauri
          shared-key: device-app-pr
          cache-bin: false
      - name: Rust unit tests
        if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path device-app/src-tauri/Cargo.toml
      # x11_live (front_x11.rs) brings two xterms to the front, one copied as `code`, and waits for each exe name from
      # the X11 source. xvfb-run is not used: it needs xauth, which apt-install.sh's --no-install-recommends leaves out.
      # Xvfb picks a free display and writes its number on fd 3 once it takes connections: a bounded read, no sleep. A
      # cold runner can take well over 10 s to start it; its log shows why when it never does.
      # A filter that matches no test passes with 0 tests, so the step fails unless x11_live itself passed.
      - name: X11 front source, live
        if: runner.os == 'Linux'
        run: |
          cp "$(command -v xterm)" "$RUNNER_TEMP/code"
          mkfifo "$RUNNER_TEMP/xvfb-display"
          Xvfb -displayfd 3 -screen 0 1280x800x24 3>"$RUNNER_TEMP/xvfb-display" 2>"$RUNNER_TEMP/xvfb.log" &
          if ! read -r -t 60 display < "$RUNNER_TEMP/xvfb-display"; then
            echo "Xvfb gave no display within 60 s"
            cat "$RUNNER_TEMP/xvfb.log"
            exit 1
          fi
          export DISPLAY=":$display"
          openbox &
          X11_LIVE_CLIENTS="$(command -v xterm):$RUNNER_TEMP/code" cargo test --locked --lib \
            --manifest-path device-app/src-tauri/Cargo.toml -- --ignored x11_live --nocapture | tee "$RUNNER_TEMP/x11_live.log"
          grep -q 'x11_live ... ok' "$RUNNER_TEMP/x11_live.log"
      # Windows runs the lib's rules (the Windows children, front source, login item and paths). The release scripts,
      # the UI and the live X11 source are the same everywhere or Linux's, so they run on the Linux leg only.
      - if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Windows'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: device-app/src-tauri
          shared-key: device-app-pr-windows
      - name: Rust unit tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --locked --lib --manifest-path device-app/src-tauri/Cargo.toml

  # windows.yml's tests (the PTY host's Rust tests and builds, the Windows CLI specs, the dial end to end, the install
  # check) for a change to Windows code or to cross-platform code with win32 branches that break only on Windows.
  # x64 covers that code; arm64 tests something x64 does not only for the Windows-only files, so the plan adds it for
  # those alone.
  windows-e2e:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-windows-e2e
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.windows-e2e == 'true'
    uses: ./.github/workflows/windows.yml
    with:
      x64_only: ${{ needs.plan.outputs.windows-e2e-arm64 != 'true' }}

  # The e2e files a pull request adds or changes, on Linux set up as cli-e2e.yml's nightly shards (one action), spread
  # over the plan's runners by their timing hints. Above 40 changed files the plan gives no list and eight rows: every
  # file the CI config includes, as the nightly. The files reach the commands only through env: a name is never shell.
  linux-e2e:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-linux-e2e-${{ strategy.job-index }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.linux-e2e == 'true'
    name: linux-e2e (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.linux-e2e-shards) }}
    # 24.04, as the nightly shards: 26.04 has no zsh or tcsh package.
    runs-on: ubuntu-24.04
    # As a nightly shard: about nine minutes of tests at most, plus install and the bundle.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cli
    env:
      LANG: C.UTF-8
      SHELL: /bin/zsh
      E2E_FILES: ${{ needs.plan.outputs.linux-e2e-files }}
      E2E_FULL: ${{ needs.plan.outputs.linux-e2e-full }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      - uses: ./.github/actions/cli-e2e-setup
        with:
          node-version: ${{ env.CLI_NODE_VERSION }}
          packages: tcsh dash
          real-backend: 'true'
      # Vitest runs every file when it is given none: an empty list runs the full suite only when the plan says so.
      - name: The plan gave files or a full run
        run: |
          if [[ -z "$E2E_FILES" && "$E2E_FULL" != true ]]; then
            echo "linux-e2e: the plan gave no file and no full run"
            exit 1
          fi
      # The file list before sharding: the summary holds the run to it.
      - name: Discover the selected files
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          read -ra files <<<"$E2E_FILES"
          npx vitest list --config vitest.e2e.ci.config.ts --filesOnly --json="$RUNNER_TEMP/inventory-$SHARD.json" "${files[@]}"
      - name: Run the selected files
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
          E2E_BUNDLE: '1'
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/e2e-daemon-logs
        run: |
          read -ra files <<<"$E2E_FILES"
          npx vitest run --config vitest.e2e.ci.config.ts --shard="$SHARD/$SHARDS" \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/result-$SHARD.json" "${files[@]}"
      - name: Preserve inventory and test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-e2e-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/inventory-${{ matrix.shard }}.json
            ${{ runner.temp }}/result-${{ matrix.shard }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Preserve the failing tests' daemon logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-e2e-daemon-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-daemon-logs/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  # Exactly the selected files ran, each passing and collecting a case; a file whose every case skips passes and the
  # job summary lists it. In the full mode, the nightly's rule: every discovered file once, every shard passing.
  linux-e2e-summary:
    needs: [plan, linux-e2e]
    if: ${{ !cancelled() && needs.plan.outputs.ready == 'true' && needs.plan.outputs.linux-e2e == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          sparse-checkout: scripts/verify-cli-test-shards.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-e2e-shard-*
          path: ${{ runner.temp }}/linux-e2e-shards
          merge-multiple: true
      - name: Require the selected files, each with a case, and every shard passing
        env:
          SHARDS: ${{ needs.plan.outputs.linux-e2e-shards }}
          E2E_FILES: ${{ needs.plan.outputs.linux-e2e-files }}
          E2E_FULL: ${{ needs.plan.outputs.linux-e2e-full }}
          E2E_TEST_RESULT: ${{ needs.linux-e2e.result }}
        run: |
          args=(--suite e2e --root "$GITHUB_WORKSPACE/cli" --shards "$(jq length <<<"$SHARDS")"
            --tests-result "$E2E_TEST_RESULT" --output "$RUNNER_TEMP/linux-e2e-summary.json"
            --step-summary "$GITHUB_STEP_SUMMARY")
          if [[ "$E2E_FULL" != true ]]; then args+=(--selected "$E2E_FILES"); fi
          python3 scripts/verify-cli-test-shards.py "$RUNNER_TEMP/linux-e2e-shards" "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-e2e-summary
          path: ${{ runner.temp }}/linux-e2e-summary.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # The dial's hosts (herdr, WezTerm, Zellij, kitty, an X11 desktop and sway), for a change to their e2e files, their
  # adapters or this job's definition: the workflow cli-e2e.yml's nightly calls.
  dial-hosts:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-dial-hosts
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.dial-hosts == 'true'
    uses: ./.github/workflows/cli-e2e-dial-hosts.yml

  # Harness Device's debug packages, each built once for the Device suites that run (the plan's device-app-builds) and
  # handed to their jobs as artifacts. A debug build reads HARNESS_DEVICE_CLI, the fake CLI the drivers point it at.
  # Outside the suites' jobs, so a reused suite never builds; ci/required needs it, so a failed build fails the gate.
  device-app-build:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-device-app-build-${{ strategy.job-index }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.device-app-builds != '[]'
    name: device-app-build (${{ matrix.bundle }}, ${{ matrix.arch }})
    # Each package on its own arch, as a release builds it: an AppImage carries the libraries of the machine that
    # bundled it, so Linux builds on the oldest Ubuntu Desktop supports.
    runs-on: ${{ fromJSON('{"appimage-x64":"ubuntu-22.04","appimage-arm64":"ubuntu-22.04-arm","nsis-x64":"windows-latest","nsis-arm64":"windows-11-arm"}')[format('{0}-{1}', matrix.bundle, matrix.arch)] }}
    # A mirror outage, then a cold app compile and its bundle.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.device-app-builds) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      - uses: ./.github/actions/device-app-setup
        with:
          node-version: ${{ env.CLI_NODE_VERSION }}
      - name: Package
        working-directory: device-app/src-tauri
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
        run: cargo tauri build --ci --debug --bundles "$BUNDLE" -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: device-app-${{ matrix.bundle }}-${{ matrix.arch }}
          path: device-app/src-tauri/target/debug/bundle/${{ matrix.bundle }}/${{ matrix.bundle == 'nsis' && '*-setup.exe' || '*.AppImage' }}
          retention-days: 3
          if-no-files-found: error

  # linux.sh: the AppImage against the fake CLI, X11, sway and the app's own install lines, for any device-app/ change.
  device-app-linux:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-device-app-linux-${{ strategy.job-index }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: [plan, device-app-build]
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.device-app-e2e == 'true'
    name: device-app-linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # A mirror outage, then the run, whose last part runs the app's two install lines, ten minutes each at most.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x64 }
          - { runner: ubuntu-22.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      # The packages the AppImage was proven with: Tauri's, then what linux.sh runs: a display, a window manager, X
      # clients (xprop from x11-utils), headless sway and foot, a session bus, the D-Bus Python of the fake tray host,
      # FUSE for the AppImage.
      - run: >-
          sudo bash scripts/apt-install.sh libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
          file xvfb openbox xdotool x11-utils xterm sway foot dbus-x11 python3-dbus python3-gi libfuse2
      - uses: actions/download-artifact@v4
        with:
          name: device-app-appimage-${{ matrix.arch }}
          path: ${{ runner.temp }}/device-app
      - name: End to end
        run: |
          shopt -s nullglob
          found=("$RUNNER_TEMP"/device-app/*.AppImage)
          if [[ ${#found[@]} -ne 1 ]]; then echo "one AppImage, not ${#found[@]}"; exit 1; fi
          bash device-app/scripts/e2e/linux.sh "${found[0]}"

  # windows.ps1: the installed app against the fake CLI, for any device-app/ change.
  device-app-windows:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-device-app-windows-${{ strategy.job-index }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: [plan, device-app-build]
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.device-app-e2e == 'true'
    name: device-app-windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # The run's wait on harness start takes up to minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { runner: windows-latest, arch: x64 }
          - { runner: windows-11-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      - uses: actions/download-artifact@v4
        with:
          name: device-app-nsis-${{ matrix.arch }}
          path: ${{ runner.temp }}/device-app
      - name: End to end
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem "$env:RUNNER_TEMP\device-app\*-setup.exe")
          if ($setup.Count -ne 1) { throw "one installer, not $($setup.Count)" }
          pwsh -NoProfile -File device-app/scripts/e2e/windows.ps1 -Installer $setup[0].FullName -Out "$env:RUNNER_TEMP\device-app-e2e"
      # The app's log and the fake CLI's files of each part, for a failure.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-app-windows-e2e-${{ matrix.arch }}
          path: ${{ runner.temp }}/device-app-e2e
          retention-days: 3
          if-no-files-found: ignore

  # The app updates itself from a local manifest, for a change to the updater or the release build: update-pair.sh
  # builds 0.0.1 and 0.0.2 as a release does, signed with a key pair made in the run, and the driver's update mode serves
  # them on 127.0.0.1:8765. Windows first: its leg is the longest.
  device-app-update:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-device-app-update-${{ strategy.job-index }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.device-app-update == 'true'
    name: device-app-update (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    # Two release builds (four on Windows), then the run, which waits a minute for a second check.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { runner: windows-latest }
          - { runner: ubuntu-22.04 }
          - { runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      # What linux.sh runs: a display, a window manager, X clients, a session bus, the Python of its probes, FUSE for
      # the AppImage.
      - if: runner.os == 'Linux'
        run: >-
          sudo bash scripts/apt-install.sh xvfb openbox xdotool xterm dbus-x11 python3-dbus python3-gi libfuse2
      - uses: ./.github/actions/device-app-setup
        with:
          node-version: ${{ env.CLI_NODE_VERSION }}
      - name: Update pair
        shell: bash
        env:
          DEVICE_TARGET: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-msvc' || '' }}
        run: bash device-app/scripts/e2e/update-pair.sh "$RUNNER_TEMP/pair"
      - name: End to end
        if: runner.os == 'Linux'
        run: bash device-app/scripts/e2e/linux.sh --update "$RUNNER_TEMP/pair"
      - name: End to end
        if: runner.os == 'Windows'
        run: >-
          pwsh -NoProfile -File device-app/scripts/e2e/windows.ps1 -Update "$env:RUNNER_TEMP\pair"
          -Out "$env:RUNNER_TEMP\device-app-update"
      # The app's log and the requests served, for a failure.
      - if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: device-app-update-${{ matrix.runner }}
          path: ${{ runner.temp }}/device-app-update
          retention-days: 3
          if-no-files-found: ignore

  # Desktop installs, finds and starts this run's debug Device package, for a change to Desktop's device install or the
  # app's install, packaging and instance code: device_app_install_windows_linux_native_test.dart serves it under a
  # loopback stand-in manifest with its real sha256 and size. No account, no backend, no production manifest.
  device-app-desktop:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-device-app-desktop-${{ strategy.job-index }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: [plan, device-app-build]
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.device-app-desktop == 'true'
    name: device-app-desktop (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    # A mirror outage, Desktop's debug build, then the run, whose Windows install may take its 5 minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { runner: windows-latest, bundle: nsis, arch: x64 }
          - { runner: windows-11-arm, bundle: nsis, arch: arm64 }
          - { runner: ubuntu-22.04, bundle: appimage, arch: x64 }
          - { runner: ubuntu-22.04-arm, bundle: appimage, arch: arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      # The packages the test was proven with: Desktop's Linux build packages as release-desktop.yml installs them,
      # Tauri's and `file`, then the run's: a display (xauth for xvfb-run), a session bus, FUSE for the AppImage.
      - if: runner.os == 'Linux'
        run: >-
          sudo bash scripts/apt-install.sh clang cmake ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
          liblzma-dev libstdc++-12-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev file xvfb xauth dbus-x11
          libfuse2
      - uses: actions/download-artifact@v4
        with:
          name: device-app-${{ matrix.bundle }}-${{ matrix.arch }}
          path: device-app-package
      - name: Name the package
        id: package
        shell: bash
        run: |
          shopt -s nullglob
          found=(device-app-package/*-setup.exe device-app-package/*.AppImage)
          if [[ ${#found[@]} -ne 1 ]]; then echo "one package, not ${#found[@]}"; exit 1; fi
          path="$PWD/${found[0]}"
          if [[ "$RUNNER_OS" == Windows ]]; then path="$(cygpath -w "$path")"; fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
      # release-desktop.yml's pin, read as desktop-tests reads it.
      - name: Flutter version
        id: flutter
        shell: bash
        run: |
          version="$(sed -n "s/^  FLUTTER_VERSION: '\([^']*\)'.*/\1/p" .github/workflows/release-desktop.yml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: runner.os == 'Linux' && runner.arch == 'X64'
        uses: ./.github/actions/desktop-flutter
        with:
          version: ${{ steps.flutter.outputs.version }}
      - if: runner.os == 'Linux' && runner.arch == 'ARM64'
        uses: ./.github/actions/desktop-flutter-arm64
        with:
          version: ${{ steps.flutter.outputs.version }}
      # A clone of the pinned tag, as windows-desktop.yml installs it: Flutter's own bootstrap then fetches the Dart SDK
      # for the runner's architecture, arm64 included.
      - name: Flutter
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FLUTTER_VERSION: ${{ steps.flutter.outputs.version }}
        run: |
          git clone --depth 1 --branch "$env:FLUTTER_VERSION" https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          if ($LASTEXITCODE -ne 0) { throw "git clone failed ($LASTEXITCODE)" }
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Flutter packages
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop
        run: |
          flutter config --no-analytics
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw "flutter pub get failed ($LASTEXITCODE)" }
      # The Device app's state says the CLI was seen and sign-in and the login item asked, so it installs nothing and
      # opens no window: %APPDATA%\ai.autonomous.harness.device\state.json, as windows.ps1 seeds it.
      - name: End to end
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop
        env:
          FLUTTER_TEST: '1'
          HARNESS_DEVICE_TEST_PACKAGE: ${{ steps.package.outputs.path }}
        run: |
          $data = Join-Path ([Environment]::GetFolderPath('ApplicationData')) 'ai.autonomous.harness.device'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          [IO.File]::WriteAllText((Join-Path $data 'state.json'), '{"version":1,"cliSeen":true,"askedSignIn":true,"loginItem":true}')
          flutter test -d windows --no-pub integration_test/device_app_install_windows_linux_native_test.dart
          if ($LASTEXITCODE -ne 0) { throw "the end-to-end test failed ($LASTEXITCODE)" }
      # The same state under a scratch HOME and XDG folders ($XDG_DATA_HOME/ai.autonomous.harness.device, as linux.sh
      # seeds it), on a display and session bus of its own. Flutter keeps the runner's pub cache.
      - name: End to end
        if: runner.os == 'Linux'
        working-directory: desktop
        env:
          FLUTTER_TEST: '1'
          HARNESS_DEVICE_TEST_PACKAGE: ${{ steps.package.outputs.path }}
        run: |
          export PUB_CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          scratch="$RUNNER_TEMP/device-app-home"
          export HOME="$scratch/home" XDG_CONFIG_HOME="$scratch/config" XDG_DATA_HOME="$scratch/data" \
            XDG_CACHE_HOME="$scratch/cache" XDG_STATE_HOME="$scratch/state" XDG_RUNTIME_DIR="$scratch/runtime"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME/ai.autonomous.harness.device" "$XDG_CACHE_HOME" \
            "$XDG_STATE_HOME" "$XDG_RUNTIME_DIR"
          chmod 0700 "$XDG_RUNTIME_DIR"
          printf '{"version":1,"cliSeen":true,"askedSignIn":true,"loginItem":true}\n' \
            >"$XDG_DATA_HOME/ai.autonomous.harness.device/state.json"
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- \
            flutter test -d linux --no-pub integration_test/device_app_install_windows_linux_native_test.dart
      # The Device app's log, for a failure: its local data folder on Windows, the scratch XDG_DATA_HOME on Linux.
      - name: Device app's log
        if: failure()
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            logs="$(cygpath -u "$LOCALAPPDATA")/ai.autonomous.harness.device/logs"
          else
            logs="$RUNNER_TEMP/device-app-home/data/ai.autonomous.harness.device/logs"
          fi
          mkdir -p "$RUNNER_TEMP/device-app-log"
          if [[ -d "$logs" ]]; then cp -R "$logs/." "$RUNNER_TEMP/device-app-log/"; fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-app-desktop-${{ matrix.runner }}
          path: ${{ runner.temp }}/device-app-log
          retention-days: 3
          if-no-files-found: ignore

  # The one line end to end, for a change to the install script or the AppImage's packaging: device-install.sh piped
  # from curl as a person runs it, on a clean Ubuntu with no libfuse2, installing the x64 AppImage. linux-install.sh
  # points cdn.autonomous.ai and storage.googleapis.com at a local HTTPS server under a throwaway CA; never the real CDN
  # or bucket. 26.04 is what new Ubuntu desktops ship.
  device-app-install:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-device-app-install-${{ strategy.job-index }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: [plan, device-app-build]
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.device-app-install == 'true'
    name: device-app-install (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { runner: ubuntu-22.04 }
          - { runner: ubuntu-24.04 }
          - { runner: ubuntu-26.04 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      # A display (xauth for xvfb-run) and a session bus; then what every Ubuntu desktop has and a bare runner lacks:
      # the host's graphics and text stack, which an AppImage does not bundle. None of them brings libfuse2.
      - run: >-
          sudo bash scripts/apt-install.sh xvfb xauth dbus-x11 libegl1 libgles2 libgbm1 libharfbuzz0b libfribidi0
          libwayland-client0
      - uses: actions/download-artifact@v4
        with:
          name: device-app-appimage-x64
          path: ${{ runner.temp }}/device-app
      - name: End to end
        run: |
          shopt -s nullglob
          found=("$RUNNER_TEMP"/device-app/*.AppImage)
          if [[ ${#found[@]} -ne 1 ]]; then echo "one AppImage, not ${#found[@]}"; exit 1; fi
          bash device-app/scripts/e2e/linux-install.sh "${found[0]}"

  # test_ci_plan.CrossReadTests' repository-wide scan, which skips in process-checks' sparse checkout: here on a full
  # one, for a change to the planner, its test or the tables it reads (scripts/ci-plan.py ALSO).
  cross-read-scan:
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.event.action || 'run' }}-${{ github.event.pull_request.number || github.run_id }}-cross-read-scan
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.cross-read-scan == 'true'
    runs-on: ubuntu-24.04
    # The checkout, then the scan: about 20 seconds locally.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      - name: Every cross-read is declared
        # The planner tests that need every file: with this set, a missing file fails them instead of skipping.
        env:
          CROSS_READ_SCAN_REQUIRED: '1'
        shell: bash
        run: |
          python3 -m unittest discover -s scripts/tests -p test_ci_plan.py -v \
            -k test_every_cross_read_in_this_repository_is_declared \
            -k test_the_dial_host_files_are_the_ones_cli_e2e_leaves_out \
            -k test_every_declared_input_exists \
            -k test_every_desktop_file_the_phone_tests_read_selects_mobile 2>&1 | tee "$RUNNER_TEMP/scan.log"
          # A renamed test matches no -k and would leave the scan passing without it.
          grep -Eq '^Ran 4 tests in ' "$RUNNER_TEMP/scan.log" || { echo "::error::the scan ran fewer or more than its 4 tests"; exit 1; }

  required:
    name: ci/required
    needs: [plan, process-checks, desktop-tests, companion-subsystems, cli-typecheck, cli-tests, tui-test,
            backend-desk, backend-integration, website-checks, os-checks, provider-checks, firmware-checks, pro-firmware-build, pro-golden,
            mobile-checks, daemons-checks, pty-checks, device-app-checks, windows-e2e, linux-e2e, linux-e2e-summary,
            dial-hosts, device-app-build,
            device-app-linux, device-app-windows, device-app-update, device-app-desktop, device-app-install,
            cross-read-scan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          sparse-checkout: scripts/
      - name: Require every selected job and complete coverage summaries
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-plan.py --verify --output "$RUNNER_TEMP/ci-required.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-required
          path: ${{ runner.temp }}/ci-required.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
