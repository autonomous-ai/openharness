name: CI bootstrap trigger trial
on:
  pull_request:
    branches: [ci-rollout/bootstrap-base-20261007]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  proof:
    name: bootstrap/required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify candidate source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$EVENT" = pull_request || test "$EVENT" = merge_group
          printf 'Verified %s source %s\n' "$EVENT" "$EXPECTED_SHA"
