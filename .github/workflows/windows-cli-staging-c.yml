name: Windows CLI staging for desktop acceptance (temporary)

# This branch-only path publishes the C5.2 CLI and PTY candidates to staging.
# Remove this workflow before the Windows PR; it never writes production paths.
on:
  push:
    branches: [feat/windows-desktop]

permissions:
  contents: read
  id-token: write

concurrency:
  group: windows-cli-staging-c-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cli-tests:
    if: "${{ startsWith(github.event.head_commit.message, 'ci(windows): cli staging release 0.4.21-dev.win1') }}"
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
        working-directory: cli
      - name: Windows agent-client and daemon authentication tests
        working-directory: cli
        run: npx vitest run src/agentClient/daemon.spec.ts src/agentClient/commands.spec.ts src/agentClient/openUrl.spec.ts src/lib/windows/daemonPipe.spec.ts --maxWorkers=1

  pty-build:
    if: "${{ startsWith(github.event.head_commit.message, 'ci(windows): cli staging release 0.4.21-dev.win1') }}"
    uses: ./.github/workflows/windows.yml
    with:
      version: 0.4.19-dev.win1
      release: true

  publish:
    needs: [cli-tests, pty-build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLI_VERSION: 0.4.21-dev.win1
      PTY_VERSION: 0.4.19-dev.win1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
        working-directory: cli
      - uses: actions/download-artifact@v4
        with:
          pattern: harness-pty-windows-*
          path: .pty
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Validate the CLI bundle and immutable staging names
        run: |
          set -euo pipefail
          DRY_RUN=1 DRY_RUN_OUT=.cli-check bash cli/scripts/publish-cli-staging.sh "$CLI_VERSION"
          bash cli/scripts/upload-install-ps1.sh --print >/dev/null
          source cli/scripts/lib/gcs.sh
          for object in "harness/staging/cli/$CLI_VERSION/cli.js" "harness/staging/cli/$CLI_VERSION/notify.mjs"; do
            if exists "gs://s3-autonomous-upgrade-3/$object"; then
              echo "::error::immutable CLI artifact already exists: $object"
              exit 1
            fi
          done
      - name: Publish PTY and CLI to staging
        run: |
          set -euo pipefail
          OBJECT_PREFIX=harness/staging METADATA_PATH=harness/staging/pty/metadata.json \
            bash cli/scripts/publish-pty-payload.sh "$PTY_VERSION" .pty/harness-pty-windows-x64 .pty/harness-pty-windows-arm64
          CLI_DIST_DIR=.cli-check bash cli/scripts/publish-cli-staging.sh "$CLI_VERSION" --no-build
          bash cli/scripts/upload-install-ps1.sh
      - name: Verify served staging manifests and artifacts
        run: |
          node --input-type=commonjs - <<'JS'
          const crypto = require('node:crypto')
          const base = 'https://storage.googleapis.com/s3-autonomous-upgrade-3/harness/staging'
          async function fetchBytes(url) {
            const response = await fetch(url, { cache: 'no-store' })
            if (!response.ok) throw new Error(`${url} -> ${response.status}`)
            return Buffer.from(await response.arrayBuffer())
          }
          async function verify(entry) {
            const bytes = await fetchBytes(entry.url)
            const sha = crypto.createHash('sha256').update(bytes).digest('hex')
            if (sha !== entry.sha256 || bytes.length !== entry.size) throw new Error(`served artifact differs: ${entry.url}`)
          }
          async function main() {
            const cli = JSON.parse((await fetchBytes(`${base}/cli/metadata.json`)).toString()).cli
            const pty = JSON.parse((await fetchBytes(`${base}/pty/metadata.json`)).toString()).pty
            if (cli.version !== process.env.CLI_VERSION) throw new Error('CLI staging version differs')
            for (const arch of ['win32-x64', 'win32-arm64']) {
              if (pty[arch].version !== '0.4.19') throw new Error(`${arch} PTY staging version differs`)
              await verify(pty[arch])
            }
            await verify(cli.cli)
            await verify(cli.notify)
            console.log(`staging CLI ${cli.version}, PTY ${process.env.PTY_VERSION}: served bytes verified`)
          }
          main().catch((error) => { console.error(`::error::${error.message}`); process.exit(1) })
          JS

  app-installer:
    if: "${{ startsWith(github.event.head_commit.message, 'ci(windows): app installer staging') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - run: bash cli/scripts/upload-install-ps1.sh --app
      - name: Verify served staging installer
        run: |
          set -euo pipefail
          curl -fsSL https://cdn.autonomous.ai/harness/staging/desktop/install.ps1 -o install.ps1
          grep -Fx "\$HarnessManifestBase = 'https://storage.googleapis.com/s3-autonomous-upgrade-3/harness/staging/'" install.ps1
          grep -Fx "\$HarnessInstallApp = \$true" install.ps1
