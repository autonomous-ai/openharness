name: CLI end to end (dial hosts)

# The dial's hosts (cli/e2e/harness/dialHosts.ts): herdr, WezTerm and Zellij from their own releases, kitty from Ubuntu,
# an X11 desktop (Xvfb, openbox) and sway, which the files start themselves. Each program is version pinned and checksum
# checked, and E2E_DIAL_HOSTS fails a file whose program is missing, where elsewhere it skips. One definition for both
# callers: cli-e2e.yml (nightly and by hand) and ci.yml's `dial-hosts` (a pull request whose paths select it).
on:
  workflow_call:

permissions:
  contents: read

# A called workflow cannot read its caller's env. The managed runtime the CLI ships on; keep in sync with cli-e2e.yml's,
# ci.yml's and release.yml's pins.
env:
  CLI_NODE_VERSION: 24.22.2

jobs:
  dial-hosts:
    name: e2e (dial hosts)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli
    env:
      LANG: C.UTF-8
      SHELL: /bin/zsh
      E2E_DIAL_HOSTS: '1'
      # cli/src/testing/recordedZellij.ts: the version the Zellij adapter's recordings were made with.
      ZELLIJ_VERSION: 0.44.3
      ZELLIJ_SHA256: 0f7c346788627f506c0a28296517768633cff24fc822a739f8264b640ecad751
      # The newest stable, what a person installs today; the herdr adapter was built on 0.8.0. It publishes no checksum
      # file, so the sha256 is the release asset's digest on GitHub.
      HERDR_VERSION: 0.9.5
      HERDR_SHA256: 14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d
      # The newest stable release. It has no Ubuntu 24.04 build; the 22.04 one installs, as 24.04's libssl3t64
      # provides the libssl3 it depends on.
      WEZTERM_VERSION: 20240203-110809-5046fc22
      WEZTERM_SHA256: 86358dab5794a4fb63f7c91dd68d4fdc3da58faad648a58fc77d2bd51c7b0686
    steps:
      # The pull request's head, as the rest of CI tests it; the run's commit elsewhere.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Download herdr, Zellij and WezTerm
        run: |
          downloads="$RUNNER_TEMP/dial-hosts"
          mkdir -p "$downloads" "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 3 -o "$downloads/herdr" \
            "https://github.com/herdrdev/herdr/releases/download/v$HERDR_VERSION/herdr-linux-x86_64"
          curl -fsSL --retry 3 -o "$downloads/zellij.tar.gz" \
            "https://github.com/zellij-org/zellij/releases/download/v$ZELLIJ_VERSION/zellij-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --retry 3 -o "$downloads/wezterm.deb" \
            "https://github.com/wezterm/wezterm/releases/download/$WEZTERM_VERSION/wezterm-$WEZTERM_VERSION.Ubuntu22.04.deb"
          printf '%s  %s\n' "$HERDR_SHA256" "$downloads/herdr" "$ZELLIJ_SHA256" "$downloads/zellij.tar.gz" \
            "$WEZTERM_SHA256" "$downloads/wezterm.deb" | sha256sum -c
          install -m 0755 "$downloads/herdr" "$HOME/.local/bin/herdr"
          tar -xzf "$downloads/zellij.tar.gz" -C "$HOME/.local/bin" zellij
      # A .deb installs its programs in /usr/bin, and apt brings the libraries it needs. kitty draws through Mesa's
      # software renderer, and exits at start without fontconfig and a font (cli/src/testing/recordedKitty.ts).
      - uses: ./.github/actions/cli-e2e-setup
        with:
          node-version: ${{ env.CLI_NODE_VERSION }}
          packages: >-
            xvfb openbox wmctrl xterm x11-utils sway foot kitty libgl1-mesa-dri fontconfig fonts-dejavu-core
            ${{ runner.temp }}/dial-hosts/wezterm.deb
      - name: Record the hosts' versions
        run: |
          {
            herdr --version
            zellij --version
            wezterm --version
            kitty --version
            sway --version
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The dial's hosts
        env:
          E2E_BUNDLE: '1'
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/e2e-daemon-logs
        run: >-
          npx vitest run --config vitest.e2e.dialHosts.config.ts
          --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/dial-hosts.json"
      # A skipped case reads as a pass: every case must run and pass.
      - name: Require every case to pass without skipping
        env:
          RESULT: ${{ runner.temp }}/dial-hosts.json
        run: >-
          node -e 'const r = JSON.parse(require("node:fs").readFileSync(process.env.RESULT, "utf8"));
          if (r.numTotalTests === 0 || r.numPassedTests !== r.numTotalTests) process.exit(1)'
      - name: Preserve the result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cli-e2e-dial-hosts
          path: ${{ runner.temp }}/dial-hosts.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve the failing cases' daemon logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: cli-e2e-daemon-logs-dial-hosts
          path: ${{ runner.temp }}/e2e-daemon-logs/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
