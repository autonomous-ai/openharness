name: CLI end to end

# The end-to-end suite (cli/e2e): real daemons under throwaway homes, private tmux servers and fake
# Claude Code and Codex engines. About 60 files and 70 minutes of test time, run one file at a time;
# until this workflow it ran only on developers' machines, and a full run held a laptop for over an
# hour. Here it is eight shards on standard Linux runners, free for a public repository.
#
# ADVISORY until it has stayed green, and so it does not run on pull requests. A failing check on a
# PR, required or not, makes GitHub report the PR UNSTABLE, and scripts/merge-validated-pr.py (`make
# merge-pr`) refuses to merge anything GitHub does not report clean: a per-PR run that failed would
# block every CLI merge. The suite had only ever run on macOS, and its first Linux runs found real
# failures (zsh's new-user menu took every agent's pane, engineLaunch.ts zshNewUserGuard) beside
# runner-specific ones. So it runs every night and on demand from a branch (Actions -> CLI end to
# end -> Run workflow) when a change needs it. It no longer runs on every merge to main: each run
# held nine of the account's twenty concurrent runners, and the next merge usually cancelled it.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Let active main validation finish; retain only the newest pending main snapshot.
# Explicit/nightly runs have independent identities and are never superseded.
concurrency:
  group: cli-e2e-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false

# The managed runtime the CLI ships on; keep ci.yml's and release.yml's pins in sync.
env:
  CLI_NODE_VERSION: 22.23.2

jobs:
  e2e:
    name: e2e (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    # About nine minutes of tests per shard by the timing hints, plus install and the bundle.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cli
    env:
      # tmux and Linux procps mangle what they print without a UTF-8 locale (hook/notify.mjs).
      LANG: C.UTF-8
      # The login shell every daemon under test launches its engines through, as on a Mac: the
      # dotfiles and engine-homes tests write a .zshrc and expect it read.
      SHELL: /bin/zsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.CLI_NODE_VERSION }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install tmux, the shells the tests launch through, and lsof
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends tmux zsh tcsh dash lsof
          # Every daemon watches its data folder and the engines' transcript folders, and a file
          # starts dozens of daemons one after another; the runner's default instance limit is 128.
          sudo sysctl -w fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=524288
          tmux -V && zsh --version && tcsh --version && command -v dash
          # Ubuntu's global zshrc runs compinit, which stops at "insecure directories ... continue [y]
          # or abort compinit [n]?" when a completion folder is writable by others or owned by someone
          # else, and the runner image ships /usr/share/zsh and its vendor-completions that way: every
          # zsh agent's pane waited at that question and no engine started. A person's machine has
          # none, or they fix it as zsh says, which is this. Fails here if any is left.
          insecure=$(zsh -fc 'autoload -U compaudit && compaudit' 2>/dev/null | grep '^/' | sort -u || true)
          if [ -n "$insecure" ]; then
            echo "$insecure" | xargs sudo chown root:root
            echo "$insecure" | xargs sudo chmod g-w,o-w
          fi
          zsh -fc 'autoload -U compaudit && compaudit'
      - run: npm ci --no-audit --no-fund
      # The complete file list, before sharding: the summary requires each file exactly once.
      - name: Discover the complete end-to-end inventory
        run: npx vitest list --config vitest.e2e.ci.config.ts --filesOnly --json="$RUNNER_TEMP/inventory-${{ matrix.shard }}.json"
      # One bundle for every daemon in the shard (e2e/harness/bundle.ts): less CPU per start, and the
      # build that ships under test. Files run one at a time (E2E_WORKERS unset), so a test's timing
      # is the daemon's rather than the runner's contention; the eight shards are the parallelism.
      - name: Run end-to-end shard
        env:
          E2E_BUNDLE: '1'
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/e2e-daemon-logs
        run: >-
          npx vitest run --config vitest.e2e.ci.config.ts --shard=${{ matrix.shard }}/8
          --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/result-${{ matrix.shard }}.json"
      - name: Preserve inventory and test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cli-e2e-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/inventory-${{ matrix.shard }}.json
            ${{ runner.temp }}/result-${{ matrix.shard }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      # Only the failing tests' folders are left there (e2e/harness/artifacts.ts): each daemon's whole
      # log and its fake engines' hook log, by file and test.
      - name: Preserve the failing tests' daemon logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: cli-e2e-daemon-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-daemon-logs/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  # The tests that need macOS: a data folder on a small disk image that fills (hdiutil). Opt-in
  # locally (DISKFULL=1); here on one macOS runner, filtered to those tests alone, a few minutes.
  e2e-macos-disk:
    name: e2e (macOS, full disk)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.CLI_NODE_VERSION }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: command -v tmux || brew install tmux
      - run: npm ci --no-audit --no-fund
      - name: A full disk, and an update on a disk that fills
        env:
          DISKFULL: '1'
          E2E_BUNDLE: '1'
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/e2e-daemon-logs
        run: >-
          npx vitest run --config vitest.e2e.config.ts e2e/diskfull.e2e.ts e2e/updateHostile.e2e.ts
          -t 'a full disk|an update on a disk that fills'
      - name: Preserve the failing tests' daemon logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: cli-e2e-daemon-logs-macos-disk
          path: ${{ runner.temp }}/e2e-daemon-logs/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  # The one check to read (and, once promoted, to require): every discovered file ran exactly once
  # and passed, on the same rules as ci.yml's `typecheck-test` for the default suite. Its summary
  # carries each file's duration, which refreshes cli/ci-e2e-durations.json.
  e2e-summary:
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/verify-cli-test-shards.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-e2e-shard-*
          path: ${{ runner.temp }}/cli-e2e-shards
          merge-multiple: true
      - name: Require every discovered file exactly once and every shard passing
        env:
          E2E_TEST_RESULT: ${{ needs.e2e.result }}
        run: >-
          python3 scripts/verify-cli-test-shards.py "$RUNNER_TEMP/cli-e2e-shards" --suite e2e
          --root "$GITHUB_WORKSPACE/cli" --shards 8 --tests-result "$E2E_TEST_RESULT"
          --output "$RUNNER_TEMP/cli-e2e-summary.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-e2e-summary
          path: ${{ runner.temp }}/cli-e2e-summary.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
