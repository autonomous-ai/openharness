name: CLI end to end
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-respawn:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        version: ['apt', '3.7c']
    steps:
      - uses: actions/checkout@v7
      - name: Test prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends tmux build-essential autoconf automake bison pkg-config libevent-dev libncurses-dev
      - uses: actions/checkout@v7
        if: matrix.version == '3.7c'
        with:
          repository: tmux/tmux
          ref: e476c1230b958df0cb12977517d24b3dc931375b
          path: .harness/tmux-source
      - name: Build released reference
        if: matrix.version == '3.7c'
        working-directory: .harness/tmux-source
        run: |
          sh autogen.sh
          ./configure --prefix="$GITHUB_WORKSPACE/.harness/tmux-install" CFLAGS='-O2 -g'
          make -j2
          make install
          echo "$GITHUB_WORKSPACE/.harness/tmux-install/bin" >> "$GITHUB_PATH"
      - name: Reproduce retained respawn status
        run: python3 scripts/tmux-respawn-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmux-respawn-probe-${{ matrix.version }}
          path: .harness/validation/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
