name: CLI end to end
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: main
            source: db89229a5c18e154afd82748eb83e44917b12ba6
          - label: candidate
            source: 808e6530516e1250c96fcba649f756cf8c252662
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli
        shell: bash
    env:
      E2E_WORKERS: '4'
      E2E_BUNDLE: '1'
      LANG: C.UTF-8
      SHELL: /bin/zsh
      E2E_ARTIFACTS_DIR: ${{ github.workspace }}/.harness/validation/daemons
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.source }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Private prerequisites and crash evidence
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends tmux zsh tcsh dash lsof gdb
          sudo sysctl -w fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=524288
          npm ci --no-audit --no-fund
          mkdir -p ../.harness/validation ../.harness/cores
          git rev-parse HEAD HEAD^{tree} > ../.harness/validation/source.txt
          tmux -V > ../.harness/validation/tmux-version.txt
          dpkg-query -W tmux >> ../.harness/validation/tmux-version.txt
          sudo sysctl -w "kernel.core_pattern=$GITHUB_WORKSPACE/.harness/cores/core.%e.%p"
      - name: Observe the failing assertion's snapshots without changing its inputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('e2e/races.e2e.ts');s=p.read_text()
          before='    expect(new Set(bound.map((agent) => agent.sessionId)).size).toBe(4)'
          assert s.count(before)==1
          s=s.replace(before,'    console.log("parallel-create evidence", JSON.stringify({bound, current: await rows(client)}))\n'+before)
          p.write_text(s)
          PY
          git diff > ../.harness/validation/diagnostic-only.diff
      - name: Bounded reproduction, never acceptance evidence
        run: |
          ulimit -c unlimited
          for round in 1 2 3 4 5 6; do
            export E2E_ARTIFACTS_DIR="$GITHUB_WORKSPACE/.harness/validation/daemons-$round"
            if env -u TMUX -u TMUX_PANE -u NO_COLOR npm run test:e2e -- e2e/races.e2e.ts e2e/windows.e2e.ts -t 'two agents created in one folder at once|windows that open a terminal and go, round after round' --reporter=default --reporter=json --outputFile.json="../.harness/validation/round-$round.json" > "../.harness/validation/round-$round.log" 2>&1; then
              echo "round $round: no reproduction" >> ../.harness/validation/outcome.txt
            else
              echo "round $round: reproduced; inspect assertion and crash evidence" >> ../.harness/validation/outcome.txt
              exit 1
            fi
          done
      - name: Inspect private tmux core dumps
        if: ${{ !cancelled() }}
        env:
          DEBUGINFOD_URLS: https://debuginfod.ubuntu.com
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          for core in Path('../.harness/cores').glob('core.*'):
            out=Path('../.harness/validation')/(core.name+'.backtrace.txt')
            with out.open('w') as f:
              try: subprocess.run(['gdb','-batch','-ex','set debuginfod enabled on','-ex','thread apply all bt full','/usr/bin/tmux',str(core)],stdout=f,stderr=subprocess.STDOUT,timeout=60,check=False)
              except subprocess.TimeoutExpired: f.write('\nGDB diagnostic deadline reached\n')
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: core-failure-diagnosis-${{ matrix.label }}
          path: .harness/validation/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
