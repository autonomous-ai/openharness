name: TUI final merge interactions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trust-model-shell-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
        shell: bash
    env:
      LANG: C.UTF-8
      SHELL: /bin/zsh
      E2E_WORKERS: '2'
      E2E_BUNDLE: '1'
      E2E_ARTIFACTS_DIR: ${{ github.workspace }}/.harness/validation/daemons
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 16ca054e39924fdd98f0bf838a86e9a9e20fb9c6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Private test prerequisites and immutable source
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends zsh tcsh dash lsof
          npm ci --no-audit --no-fund
          mkdir -p ../.harness/validation
          test -z "$(git symbolic-ref -q HEAD || true)"
          test "$(git rev-parse HEAD)" = 16ca054e39924fdd98f0bf838a86e9a9e20fb9c6
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree} > ../.harness/validation/source.txt
      - uses: ./.github/actions/reference-tmux
        id: tmux
      - name: Add pinned tmux
        run: echo "${{ steps.tmux.outputs.bin }}" >> "$GITHUB_PATH"
      - name: Types on the integrated source
        run: npm run typecheck
      - name: Core and services retain per-file 100 percent coverage
        run: npm run test:core -- --maxWorkers=4 --reporter=default --reporter=json --outputFile.json=../.harness/validation/core.json
      - name: Account trust, models, shell launch and boundaries
        run: >-
          npx vitest run src/authCommand.spec.ts src/loginForceRace.spec.ts
          src/lib/authSession.spec.ts src/lib/e2ee/accountTrust.spec.ts
          src/lib/e2ee/deviceLogSyncer.spec.ts src/lib/e2ee/groupSyncer.spec.ts
          src/lib/e2ee/manager.test.ts src/lib/appModels.spec.ts src/lib/localModels.spec.ts
          src/shellLaunch.spec.ts src/lib/engineLaunch.spec.ts src/architecture.spec.ts
          --maxWorkers=2 --reporter=default --reporter=json
          --outputFile.json=../.harness/validation/interactions.json
      - name: Connected local and sealed remote shells, plus startup attach exit
        run: >-
          env -u TMUX -u TMUX_PANE -u NO_COLOR npm run test:e2e --
          e2e/shell.e2e.ts e2e/startupAttachExit.e2e.ts
          --reporter=default --reporter=json
          --outputFile.json=../.harness/validation/native-interactions.json
      - name: Source stayed unchanged
        if: ${{ !cancelled() }}
        run: |
          git status --porcelain > ../.harness/validation/source-status.txt
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: tui-final-interactions
          path: |
            .harness/validation/
            cli/coverage/core/coverage-summary.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
