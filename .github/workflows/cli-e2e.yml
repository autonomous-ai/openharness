name: CLI end to end
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  detached-core-full-trace:
    strategy:
      fail-fast: false
      matrix:
        source: [663f921eca353a57f32d8d5da05b423286b48092]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cli
        shell: bash
    env:
      LANG: C.UTF-8
      SHELL: /bin/zsh
      E2E_WORKERS: '4'
      E2E_BUNDLE: '1'
      MIGRATION_FROM: ${{ github.workspace }}/.harness/migration/cli.js
      E2E_ARTIFACTS_DIR: ${{ github.workspace }}/.harness/validation/daemons
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.source }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Prepare private test prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends tmux zsh tcsh dash lsof
          sudo sysctl -w fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=524288
          insecure=$(zsh -fc 'autoload -U compaudit && compaudit' 2>/dev/null | grep '^/' | sort -u || true)
          if [ -n "$insecure" ]; then
            echo "$insecure" | xargs sudo chown root:root
            echo "$insecure" | xargs sudo chmod g-w,o-w
          fi
          npm ci --no-audit --no-fund
          mkdir -p ../.harness/validation
          test -z "$(git symbolic-ref -q HEAD || true)"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree} > ../.harness/validation/source.txt
          date -u +%FT%TZ > ../.harness/validation/started.txt
      - name: Fetch verified published migration fixture
        run: |
          mkdir -p ../.harness/migration
          curl --fail --location --retry 3 https://cdn.autonomous.ai/harness/cli/0.3.60/cli.js -o ../.harness/migration/cli.js
          curl --fail --location --retry 3 https://cdn.autonomous.ai/harness/cli/0.3.60/notify.mjs -o ../.harness/migration/notify.mjs
          echo 'cb1ae2452d006d414cefc6ce2deddd07a7a43fc9824402691a1ef0737d2277e3  ../.harness/migration/cli.js' | sha256sum -c -
          echo 'bca62ec5991a1f727b362b666bcef004d04fb1d13efb64de068dd602a45095f8  ../.harness/migration/notify.mjs' | sha256sum -c -
          echo '{"type":"module"}' > ../.harness/migration/package.json
      - name: Capture failing tmux metadata without changing behavior
        run: |
          cat > ../.harness/metadata-trace.cjs <<'JS'
          if (process.argv.includes('__run')) {
            const cp = require('node:child_process');
            const fs = require('node:fs');
            const original = cp.execFile;
            cp.execFile = function(file, args, ...rest) {
              if (file === 'tmux' && args[0] === 'display-message' && args.some(v => v.includes('#{window_panes}'))) {
                const callback = rest.pop();
                const started = performance.now();
                rest.push(function(error, stdout, stderr) {
                  const text = String(stdout || '');
                  const fields = text.trim().split('|');
                  if (error || fields.length !== 16 || !/^\$\d+$/.test(fields[0]) || !/^@\d+$/.test(fields[1])) {
                    fs.appendFileSync(process.env.E2E_TMUX_TRACE, JSON.stringify({ at:new Date().toISOString(), pid:process.pid, args, durationMs:performance.now()-started, error:error && {message:error.message, code:error.code, signal:error.signal, killed:error.killed}, stdout:text, stderr:String(stderr || '') })+'\n');
                  }
                  return callback.apply(this, arguments);
                });
              }
              return original.call(this, file, args, ...rest);
            };
            require('node:module').syncBuiltinESMExports();
          }
          JS
      - name: Full suite with unchanged tmux replies and diagnostic logging
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/.harness/metadata-trace.cjs
          E2E_TMUX_TRACE: ${{ github.workspace }}/.harness/validation/tmux-metadata.jsonl
        run: |
          env -u TMUX -u TMUX_PANE -u NO_COLOR npm run test:e2e -- --reporter=default --reporter=json --outputFile.json=../.harness/validation/full.json 2>&1 | tee ../.harness/validation/full.log
      - name: Record final source
        if: ${{ !cancelled() }}
        run: |
          date -u +%FT%TZ > ../.harness/validation/ended.txt
          git status --porcelain > ../.harness/validation/source-status.txt
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: detached-core-full-trace-${{ matrix.source }}
          path: .harness/validation/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
