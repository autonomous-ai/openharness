name: CLI end to end
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  detached-core-final:
    strategy:
      fail-fast: false
      matrix:
        suite: [full, races-1, races-2, races-3]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cli
        shell: bash
    env:
      LANG: C.UTF-8
      SHELL: /bin/zsh
      TEST_SUITE: ${{ matrix.suite }}
      E2E_WORKERS: '4'
      E2E_BUNDLE: '1'
      MIGRATION_FROM: ${{ github.workspace }}/.harness/migration/cli.js
      E2E_ARTIFACTS_DIR: ${{ github.workspace }}/.harness/validation/daemons
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6e5c80c514bf93e91eac262d80f0abb16f2fce0a
      - uses: actions/checkout@v7
        with:
          repository: tmux/tmux
          ref: e476c1230b958df0cb12977517d24b3dc931375b
          path: .harness/tmux-source
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Prepare private test prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends zsh tcsh dash lsof build-essential autoconf automake bison pkg-config libevent-dev libncurses-dev
          sudo sysctl -w fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=524288
          insecure=$(zsh -fc 'autoload -U compaudit && compaudit' 2>/dev/null | grep '^/' | sort -u || true)
          if [ -n "$insecure" ]; then
            echo "$insecure" | xargs sudo chown root:root
            echo "$insecure" | xargs sudo chmod g-w,o-w
          fi
          npm ci --no-audit --no-fund
          mkdir -p ../.harness/validation
          test -z "$(git symbolic-ref -q HEAD || true)"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree} > ../.harness/validation/source.txt
          date -u +%FT%TZ > ../.harness/validation/started.txt
      - name: Build pinned released tmux with the verified upstream initialization fix
        working-directory: .harness/tmux-source
        run: |
          git rev-parse HEAD > ../validation/tmux-source.txt
          test -z "$(git status --porcelain)"
          sh autogen.sh
          ./configure --prefix="$GITHUB_WORKSPACE/.harness/tmux-install" CFLAGS='-O2 -g'
          make -j2
          make install
          echo "$GITHUB_WORKSPACE/.harness/tmux-install/bin" >> "$GITHUB_PATH"
      - name: Fetch verified published migration fixture
        run: |
          mkdir -p ../.harness/migration
          curl --fail --location --retry 3 https://cdn.autonomous.ai/harness/cli/0.3.60/cli.js -o ../.harness/migration/cli.js
          curl --fail --location --retry 3 https://cdn.autonomous.ai/harness/cli/0.3.60/notify.mjs -o ../.harness/migration/notify.mjs
          echo 'cb1ae2452d006d414cefc6ce2deddd07a7a43fc9824402691a1ef0737d2277e3  ../.harness/migration/cli.js' | sha256sum -c -
          echo 'bca62ec5991a1f727b362b666bcef004d04fb1d13efb64de068dd602a45095f8  ../.harness/migration/notify.mjs' | sha256sum -c -
          echo '{"type":"module"}' > ../.harness/migration/package.json
      - name: Complete assigned suite with four workers from the detached bundle
        run: |
          command -v tmux > ../.harness/validation/tmux-version.txt
          tmux -V >> ../.harness/validation/tmux-version.txt
          sha256sum "$(command -v tmux)" >> ../.harness/validation/tmux-version.txt
          npx vitest list --config vitest.e2e.config.ts --filesOnly --json=../.harness/validation/inventory.json
          args=()
          if [ "$TEST_SUITE" != full ]; then
            args=(e2e/machine.e2e.ts e2e/recovery.e2e.ts e2e/races.e2e.ts e2e/restoreInput.e2e.ts e2e/ends.e2e.ts e2e/startup.e2e.ts e2e/migration.e2e.ts)
          fi
          env -u TMUX -u TMUX_PANE -u NO_COLOR npm run test:e2e -- "${args[@]}" --reporter=default --reporter=json --outputFile.json="../.harness/validation/$TEST_SUITE.json" 2>&1 | tee "../.harness/validation/$TEST_SUITE.log"
      - name: Record final source
        if: ${{ !cancelled() }}
        run: |
          date -u +%FT%TZ > ../.harness/validation/ended.txt
          git status --porcelain > ../.harness/validation/source-status.txt
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: detached-core-6e5c80-${{ matrix.suite }}
          path: .harness/validation/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
