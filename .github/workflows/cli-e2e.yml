name: CLI end to end
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tmux-compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: upstream-3.4-with-init-fix
            tmux: 9ae69c3795ab5ef6b4d760f6398cd9281151f632
            patch: true
          - label: released-3.7c
            tmux: e476c1230b958df0cb12977517d24b3dc931375b
            patch: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli
        shell: bash
    env:
      E2E_WORKERS: '4'
      E2E_BUNDLE: '1'
      LANG: C.UTF-8
      SHELL: /bin/zsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 877c381f9e1b140f489d926647af91de164aad29
      - uses: actions/checkout@v7
        with:
          repository: tmux/tmux
          ref: ${{ matrix.tmux }}
          path: .harness/tmux-source
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Private test prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends zsh tcsh dash lsof build-essential autoconf automake bison pkg-config libevent-dev libncurses-dev
          sudo sysctl -w fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=524288
          insecure=$(zsh -fc 'autoload -U compaudit && compaudit' 2>/dev/null | grep '^/' | sort -u || true)
          if [ -n "$insecure" ]; then
            echo "$insecure" | xargs sudo chown root:root
            echo "$insecure" | xargs sudo chmod g-w,o-w
          fi
          npm ci --no-audit --no-fund
          mkdir -p ../.harness/validation
          git rev-parse HEAD HEAD^{tree} > ../.harness/validation/source.txt
          test -z "$(git symbolic-ref -q HEAD || true)"
          test -z "$(git status --porcelain)"
      - name: Build the pinned tmux dependency in the throwaway runner
        working-directory: .harness/tmux-source
        env:
          PATCH_INITIALIZATION: ${{ matrix.patch }}
        run: |
          git rev-parse HEAD > ../validation/tmux-source.txt
          if [ "$PATCH_INITIALIZATION" = true ]; then
            curl --fail --location --max-time 30 https://github.com/tmux/tmux/commit/e5a2a25fafb8ee107c230d8acad694f6b635f8bb.patch -o ../validation/upstream-init.patch
            git apply --check ../validation/upstream-init.patch
            git apply ../validation/upstream-init.patch
          fi
          git diff > ../validation/tmux-source.diff
          sh autogen.sh
          ./configure --prefix="$GITHUB_WORKSPACE/.harness/tmux-install" CFLAGS='-O2 -g'
          make -j2
          make install
          echo "$GITHUB_WORKSPACE/.harness/tmux-install/bin" >> "$GITHUB_PATH"
      - name: Three bounded rapid-view rounds with the diagnosed dependency corrected
        run: |
          command -v tmux > ../.harness/validation/tmux-version.txt
          tmux -V >> ../.harness/validation/tmux-version.txt
          sha256sum "$(command -v tmux)" >> ../.harness/validation/tmux-version.txt
          for round in 1 2 3; do
            export E2E_ARTIFACTS_DIR="$GITHUB_WORKSPACE/.harness/validation/daemons-$round"
            env -u TMUX -u TMUX_PANE -u NO_COLOR npm run test:e2e -- e2e/windows.e2e.ts -t 'windows that open a terminal and go, round after round' --reporter=default --reporter=json --outputFile.json="../.harness/validation/round-$round.json" 2>&1 | tee "../.harness/validation/round-$round.log"
          done
          git status --porcelain > ../.harness/validation/source-status.txt
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: tmux-compatibility-${{ matrix.label }}
          path: .harness/validation/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
