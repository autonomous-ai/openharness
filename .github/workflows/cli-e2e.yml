name: CLI end to end
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  detached-core-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli
        shell: bash
    env:
      LANG: C.UTF-8
      SHELL: /bin/zsh
      E2E_WORKERS: '4'
      E2E_BUNDLE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: aad49e9cda75ef7a49c45bef855fcb9034cf2f39
      - name: Verify the exact detached snapshot
        run: |
          test "$(git rev-parse HEAD)" = aad49e9cda75ef7a49c45bef855fcb9034cf2f39
          test -z "$(git symbolic-ref -q HEAD || true)"
          test -z "$(git status --porcelain)"
          mkdir -p ../.harness/validation ../.harness/migration
          git rev-parse HEAD HEAD^{tree} > ../.harness/validation/source.txt
          date -u +%FT%TZ > ../.harness/validation/started.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install test prerequisites on the private runner
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends tmux zsh tcsh dash lsof
          sudo sysctl -w fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=524288
          insecure=$(zsh -fc 'autoload -U compaudit && compaudit' 2>/dev/null | grep '^/' | sort -u || true)
          if [ -n "$insecure" ]; then
            echo "$insecure" | xargs sudo chown root:root
            echo "$insecure" | xargs sudo chmod g-w,o-w
          fi
          zsh -fc 'autoload -U compaudit && compaudit'
          npm ci --no-audit --no-fund
      - name: Changed upstream terminal and Store fixtures
        id: full
        continue-on-error: true
        env:
          E2E_ARTIFACTS_DIR: ${{ github.workspace }}/.harness/validation/full-daemons
        run: |
          env -u TMUX -u TMUX_PANE -u NO_COLOR npm run test:e2e -- e2e/terminal.e2e.ts e2e/storeProcess.e2e.ts --reporter=default --reporter=json --outputFile.json=../.harness/validation/full.json 2>&1 | tee ../.harness/validation/full.log
      - name: Record final source and require both changed files green
        if: ${{ !cancelled() }}
        env:
          FULL_RESULT: ${{ steps.full.outcome }}
        run: |
          date -u +%FT%TZ > ../.harness/validation/ended.txt
          git status --porcelain > ../.harness/validation/source-status.txt
          test -z "$(git status --porcelain)"
          test "$FULL_RESULT" = success
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: detached-core-aad49-fixtures
          path: .harness/validation/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
