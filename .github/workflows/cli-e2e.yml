name: TUI final merge interactions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trust-model-shell-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
        shell: bash
    env:
      LANG: C.UTF-8
      SHELL: /bin/zsh
      E2E_WORKERS: '2'
      E2E_BUNDLE: '1'
      E2E_ARTIFACTS_DIR: ${{ github.workspace }}/.harness/validation/daemons
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 16ca054e39924fdd98f0bf838a86e9a9e20fb9c6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Private test prerequisites and immutable source
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends zsh tcsh dash lsof musl-tools
          insecure=$(zsh -fc 'autoload -U compaudit && compaudit' 2>/dev/null | grep '^/' | sort -u || true)
          if [ -n "$insecure" ]; then
            echo "$insecure" | xargs sudo chown root:root
            echo "$insecure" | xargs sudo chmod g-w,o-w
          fi
          npm ci --no-audit --no-fund
          mkdir -p ../.harness/validation
          test -z "$(git symbolic-ref -q HEAD || true)"
          test "$(git rev-parse HEAD)" = 16ca054e39924fdd98f0bf838a86e9a9e20fb9c6
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree} > ../.harness/validation/source.txt
      - uses: ./.github/actions/reference-tmux
        id: tmux
      - name: Add pinned tmux
        run: echo "${{ steps.tmux.outputs.bin }}" >> "$GITHUB_PATH"
      - name: Verify the affected shell test after fixing runner completion ownership
        run: >-
          npx vitest run src/lib/engineLaunch.spec.ts --maxWorkers=1
          --reporter=default --reporter=json
          --outputFile.json=../.harness/validation/engine-launch.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: tui
          shared-key: tui-x86_64-unknown-linux-musl
          cache-bin: false
      - name: Build the unchanged TUI for the integrated remote journey
        working-directory: tui
        run: cargo build --locked --release --target x86_64-unknown-linux-musl -j2
      - name: Connected local and sealed remote shells, plus startup attach exit
        env:
          HN_TUI_BINARY: ${{ github.workspace }}/tui/target/x86_64-unknown-linux-musl/release/harness-tui
        run: >-
          env -u TMUX -u TMUX_PANE -u NO_COLOR npm run test:e2e --
          e2e/shell.e2e.ts e2e/startupAttachExit.e2e.ts e2e/tuiShell.e2e.ts
          --reporter=default --reporter=json
          --outputFile.json=../.harness/validation/native-interactions.json
      - name: Source stayed unchanged
        if: ${{ !cancelled() }}
        run: |
          git status --porcelain > ../.harness/validation/source-status.txt
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: tui-final-native-interactions
          path: .harness/validation/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
