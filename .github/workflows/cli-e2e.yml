name: CLI end to end
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  detached-core-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: cli
        shell: bash
    env:
      LANG: C.UTF-8
      SHELL: /bin/zsh
      E2E_WORKERS: '4'
      E2E_BUNDLE: '1'
      MIGRATION_FROM: ${{ github.workspace }}/.harness/migration/cli.js
    steps:
      - uses: actions/checkout@v7
        with:
          ref: b57188f97db70831a1685e04fa89b53e965c1ae5
      - name: Verify the exact detached snapshot
        run: |
          test "$(git rev-parse HEAD)" = b57188f97db70831a1685e04fa89b53e965c1ae5
          test -z "$(git symbolic-ref -q HEAD || true)"
          test -z "$(git status --porcelain)"
          mkdir -p ../.harness/validation ../.harness/migration
          git rev-parse HEAD HEAD^{tree} > ../.harness/validation/source.txt
          date -u +%FT%TZ > ../.harness/validation/started.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install test prerequisites on the private runner
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends tmux zsh tcsh dash lsof
          sudo sysctl -w fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=524288
          insecure=$(zsh -fc 'autoload -U compaudit && compaudit' 2>/dev/null | grep '^/' | sort -u || true)
          if [ -n "$insecure" ]; then
            echo "$insecure" | xargs sudo chown root:root
            echo "$insecure" | xargs sudo chmod g-w,o-w
          fi
          zsh -fc 'autoload -U compaudit && compaudit'
          npm ci --no-audit --no-fund
      - name: Fetch checksum-verified published migration fixture
        run: |
          curl --fail --location --retry 3 https://cdn.autonomous.ai/harness/cli/0.3.60/cli.js -o ../.harness/migration/cli.js
          curl --fail --location --retry 3 https://cdn.autonomous.ai/harness/cli/0.3.60/notify.mjs -o ../.harness/migration/notify.mjs
          echo 'cb1ae2452d006d414cefc6ce2deddd07a7a43fc9824402691a1ef0737d2277e3  ../.harness/migration/cli.js' | sha256sum -c -
          echo 'bca62ec5991a1f727b362b666bcef004d04fb1d13efb64de068dd602a45095f8  ../.harness/migration/notify.mjs' | sha256sum -c -
          echo '{"type":"module"}' > ../.harness/migration/package.json
      - name: Full bundled E2E with four workers
        id: full
        continue-on-error: true
        env:
          E2E_ARTIFACTS_DIR: ${{ github.workspace }}/.harness/validation/full-daemons
        run: |
          env -u TMUX -u TMUX_PANE -u NO_COLOR npm run test:e2e -- --reporter=default --reporter=json --outputFile.json=../.harness/validation/full.json 2>&1 | tee ../.harness/validation/full.log
      - name: Three additional runs of every named race file
        id: repeated
        continue-on-error: true
        run: |
          result=0
          for run in 1 2 3; do
            export E2E_ARTIFACTS_DIR="$GITHUB_WORKSPACE/.harness/validation/races-$run-daemons"
            env -u TMUX -u TMUX_PANE -u NO_COLOR npm run test:e2e -- e2e/machine.e2e.ts e2e/recovery.e2e.ts e2e/races.e2e.ts e2e/restoreInput.e2e.ts e2e/ends.e2e.ts e2e/startup.e2e.ts e2e/migration.e2e.ts --reporter=default --reporter=json --outputFile.json="../.harness/validation/races-$run.json" 2>&1 | tee "../.harness/validation/races-$run.log" || result=1
          done
          exit "$result"
      - name: Record final source and require all four runs green
        if: ${{ !cancelled() }}
        env:
          FULL_RESULT: ${{ steps.full.outcome }}
          REPEATED_RESULT: ${{ steps.repeated.outcome }}
        run: |
          date -u +%FT%TZ > ../.harness/validation/ended.txt
          git status --porcelain > ../.harness/validation/source-status.txt
          test -z "$(git status --porcelain)"
          test "$FULL_RESULT" = success
          test "$REPEATED_RESULT" = success
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: detached-core-b5718-validation
          path: .harness/validation/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
