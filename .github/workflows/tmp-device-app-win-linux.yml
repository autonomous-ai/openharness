# Temporary: Harness Device's tests on Windows and Linux for feat/device-app-win-linux and its task branches. Removed
# before the branch merges. No secrets, nothing signed, nothing published.
name: tmp device-app win-linux (temporary)

on:
  push:
    branches: [feat/device-app-win-linux, feat/device-app-win-linux-t*]
    paths:
      - 'device-app/**'
      - '.github/workflows/tmp-device-app-win-linux.yml'
      # What desktop-device-app-e2e runs.
      - 'desktop/lib/devices/**'
      - 'desktop/integration_test/device_app_install_windows_linux_native_test.dart'

permissions:
  contents: read

# One run per branch: a newer push makes the older run's result moot.
concurrency:
  group: tmp-device-app-win-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  CLI_NODE_VERSION: 24.22.2

jobs:
  windows-unit:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: device-app/src-tauri
          shared-key: device-app-tmp
      - name: Rust unit tests
        run: cargo test --locked --lib --manifest-path device-app/src-tauri/Cargo.toml
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.CLI_NODE_VERSION }}
          cache: npm
          cache-dependency-path: device-app/ui/package-lock.json
      # The binary embeds ui/dist, so the bundle is built before main.rs compiles.
      - name: UI bundle
        working-directory: device-app/ui
        run: npm ci --no-audit --no-fund && npm run build
      - name: Binary
        run: cargo build --locked --manifest-path device-app/src-tauri/Cargo.toml

  linux-unit:
    runs-on: ubuntu-latest
    # apt-install.sh can take about 19.5 minutes to give up in a mirror outage, and a cold Tauri compile follows.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Copied from ci.yml's device-app-checks, from the apt install to the Rust unit tests.
      - run: >-
          sudo bash scripts/apt-install.sh libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
          xvfb openbox xdotool xterm
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.CLI_NODE_VERSION }}
          cache: npm
          cache-dependency-path: device-app/ui/package-lock.json
      # The binary embeds ui/dist, so the bundle is built before the Rust tests compile it.
      - name: UI tests and bundle
        working-directory: device-app/ui
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npx vitest run
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: device-app/src-tauri
          shared-key: device-app-pr
          cache-bin: false
      - name: Rust unit tests
        run: cargo test --locked --manifest-path device-app/src-tauri/Cargo.toml

  linux-e2e:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    # A mirror outage, a cold Tauri CLI and app compile, the AppImage bundle, then the run itself, whose last part runs
    # the app's two install lines, ten minutes each at most.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Tauri's packages and `file` for its AppImage bundler; then what linux.sh runs: a display, a window manager, X
      # clients, headless sway and foot, a session bus, the D-Bus Python of the fake tray host, FUSE for the AppImage.
      - run: >-
          sudo bash scripts/apt-install.sh libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
          file xvfb openbox xdotool xterm sway foot dbus-x11 python3-dbus python3-gi libfuse2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.CLI_NODE_VERSION }}
          cache: npm
          cache-dependency-path: device-app/ui/package-lock.json
      # The bundle's beforeBuildCommand builds the window with these.
      - name: UI packages
        working-directory: device-app/ui
        run: npm ci --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
      # Restored, never saved: each leg's Tauri tree would push other components' caches out of the repository's 10 GB.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: device-app/src-tauri
          shared-key: device-app-tmp-e2e-${{ matrix.runner }}
          save-if: false
      - name: Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked
      # A debug build reads HARNESS_DEVICE_CLI, the fake CLI linux.sh points it at.
      - name: AppImage
        working-directory: device-app/src-tauri
        run: cargo tauri build --ci --debug --bundles appimage -- --locked
      - name: End to end
        run: bash device-app/scripts/e2e/linux.sh device-app/src-tauri/target/debug/bundle/appimage/*.AppImage

  # The installed app against the fake CLI: device-app/scripts/e2e/windows.ps1, on x64 and arm64, each built where it
  # runs. The arm64 installer is kept for the Windows ARM VM's checks, unsigned and for 3 days.
  windows-e2e:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    # A cold Tauri CLI and app compile, the NSIS bundle, then the run, whose wait on harness start takes up to minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.CLI_NODE_VERSION }}
          cache: npm
          cache-dependency-path: device-app/ui/package-lock.json
      # The bundle's beforeBuildCommand builds the window with these.
      - name: UI packages
        working-directory: device-app/ui
        run: npm ci --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
      # Restored, never saved, as linux-e2e's.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: device-app/src-tauri
          shared-key: device-app-tmp-e2e-${{ matrix.runner }}
          save-if: false
      - name: Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked
      # A debug build reads HARNESS_DEVICE_CLI, the fake CLI windows.ps1 points it at.
      - name: Installer
        working-directory: device-app/src-tauri
        run: cargo tauri build --ci --debug --bundles nsis -- --locked
      - if: matrix.runner == 'windows-11-arm'
        uses: actions/upload-artifact@v4
        with:
          name: device-app-windows-arm64-debug
          path: device-app/src-tauri/target/debug/bundle/nsis/*-setup.exe
          retention-days: 3
          if-no-files-found: error
      - name: End to end
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem device-app/src-tauri/target/debug/bundle/nsis/*-setup.exe)
          if ($setup.Count -ne 1) { throw "one installer, not $($setup.Count)" }
          pwsh -NoProfile -File device-app/scripts/e2e/windows.ps1 -Installer $setup[0].FullName -Out "$env:RUNNER_TEMP\device-app-e2e"
      # The app's log and the fake CLI's files of each part, for a failure.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-app-windows-e2e-${{ matrix.runner }}
          path: ${{ runner.temp }}/device-app-e2e
          retention-days: 3
          if-no-files-found: ignore

  # What a person sees on Windows, as PNGs for a person to judge: windows.ps1's screens mode drives the debug installer's
  # app, built as windows-e2e builds it, against the fake CLI. The Arm runner refuses foreground changes: it takes what
  # it can and notes the rest.
  windows-screens:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # A cold Tauri CLI and app compile, the NSIS bundle, then the run.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.CLI_NODE_VERSION }}
          cache: npm
          cache-dependency-path: device-app/ui/package-lock.json
      # The bundle's beforeBuildCommand builds the window with these.
      - name: UI packages
        working-directory: device-app/ui
        run: npm ci --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
      # Restored, never saved, as linux-e2e's.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: device-app/src-tauri
          shared-key: device-app-tmp-e2e-${{ matrix.runner }}
          save-if: false
      - name: Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked
      # A debug build reads HARNESS_DEVICE_CLI, the fake CLI windows.ps1 points it at.
      - name: Installer
        working-directory: device-app/src-tauri
        run: cargo tauri build --ci --debug --bundles nsis -- --locked
      - name: Screenshots
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem device-app/src-tauri/target/debug/bundle/nsis/*-setup.exe)
          if ($setup.Count -ne 1) { throw "one installer, not $($setup.Count)" }
          pwsh -NoProfile -File device-app/scripts/e2e/windows.ps1 -Installer $setup[0].FullName `
            -Screens "$env:RUNNER_TEMP\device-app-screens" -Out "$env:RUNNER_TEMP\device-app-screens\evidence"
      # The PNGs, and the app's log and the fake CLI's files beside them, whatever the run's result.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-app-windows-screens-${{ matrix.arch }}
          path: ${{ runner.temp }}/device-app-screens
          retention-days: 3
          if-no-files-found: warn

  # The app updates itself from a local manifest: update-pair.sh builds 0.0.1 and 0.0.2 as a release does, signed with
  # a key pair made in the run, and the driver's update mode serves them on 127.0.0.1:8765. The Windows arm64 pair is
  # built beside the x64 one and kept for the Windows ARM VM, for 3 days.
  update-e2e:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm, windows-latest]
    runs-on: ${{ matrix.runner }}
    # A cold Tauri CLI, two release builds (four on Windows), then the run, which waits a minute for a second check.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # What linux.sh runs: a display, a window manager, X clients, a session bus, the Python of its probes, FUSE for
      # the AppImage.
      - if: runner.os == 'Linux'
        run: >-
          sudo bash scripts/apt-install.sh xvfb openbox xdotool xterm dbus-x11 python3-dbus python3-gi libfuse2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.CLI_NODE_VERSION }}
          cache: npm
          cache-dependency-path: device-app/ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      # Restored, never saved, as linux-e2e's.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: device-app/src-tauri
          shared-key: device-app-tmp-update-${{ matrix.runner }}
          save-if: false
      # The release's own setup: this OS's Rust targets and packages, the Tauri CLI, the window's packages, minisign.
      - name: Release tools
        shell: bash
        run: bash device-app/scripts/release-setup.sh
      - name: Update pair
        shell: bash
        env:
          DEVICE_TARGET: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-msvc' || '' }}
        run: bash device-app/scripts/e2e/update-pair.sh "$RUNNER_TEMP/pair"
      - name: End to end
        if: runner.os == 'Linux'
        run: bash device-app/scripts/e2e/linux.sh --update "$RUNNER_TEMP/pair"
      - name: End to end
        if: runner.os == 'Windows'
        run: >-
          pwsh -NoProfile -File device-app/scripts/e2e/windows.ps1 -Update "$env:RUNNER_TEMP\pair"
          -Out "$env:RUNNER_TEMP\device-app-update"
      - name: Update pair, arm64
        if: runner.os == 'Windows'
        shell: bash
        env:
          DEVICE_TARGET: aarch64-pc-windows-msvc
        run: bash device-app/scripts/e2e/update-pair.sh "$RUNNER_TEMP/pair-arm64"
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: device-app-windows-arm64-update
          path: ${{ runner.temp }}/pair-arm64
          retention-days: 3
          if-no-files-found: error
      # The app's log and the requests served, for a failure.
      - if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: device-app-update-e2e-${{ matrix.runner }}
          path: ${{ runner.temp }}/device-app-update
          retention-days: 3
          if-no-files-found: ignore

  # Desktop installs, finds and starts this run's debug Device package, and on Linux lists it in the app list:
  # device_app_install_windows_linux_native_test.dart serves it under a loopback stand-in manifest with its real sha256
  # and size. No account, no backend, no production manifest. The Desktop under test is the unsigned debug runner
  # `flutter test` builds, so the Windows installer is held to its sha256 alone (Task 41).
  desktop-device-app-e2e:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    # A mirror outage, a cold Tauri CLI and app compile, the package's bundle, then Desktop's debug build and the run,
    # whose Windows install may take its 5 minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Desktop's Linux build packages as release-desktop.yml installs them, then Tauri's and `file` for the AppImage
      # bundler, then the run's: a display (xauth for xvfb-run), a session bus, FUSE for the AppImage.
      - if: runner.os == 'Linux'
        run: >-
          sudo bash scripts/apt-install.sh clang cmake ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
          liblzma-dev libstdc++-12-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev file xvfb xauth dbus-x11
          libfuse2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.CLI_NODE_VERSION }}
          cache: npm
          cache-dependency-path: device-app/ui/package-lock.json
      # The bundle's beforeBuildCommand builds the window with these.
      - name: UI packages
        working-directory: device-app/ui
        run: npm ci --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
      # Restored, never saved, as linux-e2e's.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: device-app/src-tauri
          shared-key: device-app-tmp-e2e-${{ matrix.runner }}
          save-if: false
      - name: Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked
      # Built as windows-e2e and linux-e2e build it: the installer on Windows, the AppImage on Linux.
      - name: Device package
        working-directory: device-app/src-tauri
        shell: bash
        env:
          BUNDLE: ${{ runner.os == 'Windows' && 'nsis' || 'appimage' }}
        run: cargo tauri build --ci --debug --bundles "$BUNDLE" -- --locked
      - name: Name the package
        id: package
        shell: bash
        run: |
          shopt -s nullglob
          bundle=device-app/src-tauri/target/debug/bundle
          found=("$bundle"/nsis/*-setup.exe "$bundle"/appimage/*.AppImage)
          if [[ ${#found[@]} -ne 1 ]]; then echo "one package, not ${#found[@]}"; exit 1; fi
          path="$PWD/${found[0]}"
          if [[ "$RUNNER_OS" == Windows ]]; then path="$(cygpath -w "$path")"; fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
      # windows-desktop.yml's pin, read rather than copied.
      - name: Flutter version
        id: flutter
        shell: bash
        run: |
          version="$(sed -n "s/^  FLUTTER_VERSION: '\([^']*\)'.*/\1/p" .github/workflows/windows-desktop.yml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: runner.os == 'Linux' && runner.arch == 'X64'
        uses: ./.github/actions/desktop-flutter
        with:
          version: ${{ steps.flutter.outputs.version }}
      - if: runner.os == 'Linux' && runner.arch == 'ARM64'
        uses: ./.github/actions/desktop-flutter-arm64
        with:
          version: ${{ steps.flutter.outputs.version }}
      # A clone of the pinned tag, as windows-desktop.yml installs it: Flutter's own bootstrap then fetches the Dart SDK
      # for the runner's architecture, arm64 included.
      - name: Flutter
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FLUTTER_VERSION: ${{ steps.flutter.outputs.version }}
        run: |
          git clone --depth 1 --branch "$env:FLUTTER_VERSION" https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          if ($LASTEXITCODE -ne 0) { throw "git clone failed ($LASTEXITCODE)" }
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Flutter packages
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop
        run: |
          flutter config --no-analytics
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw "flutter pub get failed ($LASTEXITCODE)" }
      # The Device app's state says the CLI was seen and sign-in and the login item asked, so it installs nothing and
      # opens no window: %APPDATA%\ai.autonomous.harness.device\state.json, as windows.ps1 seeds it.
      - name: End to end
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop
        env:
          FLUTTER_TEST: '1'
          HARNESS_DEVICE_TEST_PACKAGE: ${{ steps.package.outputs.path }}
        run: |
          $data = Join-Path ([Environment]::GetFolderPath('ApplicationData')) 'ai.autonomous.harness.device'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          [IO.File]::WriteAllText((Join-Path $data 'state.json'), '{"version":1,"cliSeen":true,"askedSignIn":true,"loginItem":true}')
          flutter test -d windows --no-pub integration_test/device_app_install_windows_linux_native_test.dart
          if ($LASTEXITCODE -ne 0) { throw "the end-to-end test failed ($LASTEXITCODE)" }
      # The same state under a scratch HOME and XDG folders ($XDG_DATA_HOME/ai.autonomous.harness.device, as linux.sh
      # seeds it), on a display and session bus of its own. Flutter keeps the runner's pub cache.
      - name: End to end
        if: runner.os == 'Linux'
        working-directory: desktop
        env:
          FLUTTER_TEST: '1'
          HARNESS_DEVICE_TEST_PACKAGE: ${{ steps.package.outputs.path }}
        run: |
          export PUB_CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          scratch="$RUNNER_TEMP/device-app-home"
          export HOME="$scratch/home" XDG_CONFIG_HOME="$scratch/config" XDG_DATA_HOME="$scratch/data" \
            XDG_CACHE_HOME="$scratch/cache" XDG_STATE_HOME="$scratch/state" XDG_RUNTIME_DIR="$scratch/runtime"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME/ai.autonomous.harness.device" "$XDG_CACHE_HOME" \
            "$XDG_STATE_HOME" "$XDG_RUNTIME_DIR"
          chmod 0700 "$XDG_RUNTIME_DIR"
          printf '{"version":1,"cliSeen":true,"askedSignIn":true,"loginItem":true}\n' \
            >"$XDG_DATA_HOME/ai.autonomous.harness.device/state.json"
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- \
            flutter test -d linux --no-pub integration_test/device_app_install_windows_linux_native_test.dart
      # The Device app's log, for a failure: its local data folder on Windows, the scratch XDG_DATA_HOME on Linux.
      - name: Device app's log
        if: failure()
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            logs="$(cygpath -u "$LOCALAPPDATA")/ai.autonomous.harness.device/logs"
          else
            logs="$RUNNER_TEMP/device-app-home/data/ai.autonomous.harness.device/logs"
          fi
          mkdir -p "$RUNNER_TEMP/device-app-log"
          if [[ -d "$logs" ]]; then cp -R "$logs/." "$RUNNER_TEMP/device-app-log/"; fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-device-app-e2e-${{ matrix.runner }}
          path: ${{ runner.temp }}/device-app-log
          retention-days: 3
          if-no-files-found: ignore

  # Section 11's probe: does each AppImage start, as a double-click starts it, on a clean Ubuntu with no libfuse2? This
  # job builds the Device app's AppImage as linux-e2e builds it, for fuse-probe to run on 22.04 and 24.04.
  fuse-device-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # A mirror outage, then a cold Tauri CLI and app compile and the AppImage bundle.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # linux-e2e's packages, so the bundle is the one it runs.
      - run: >-
          sudo bash scripts/apt-install.sh libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
          file xvfb openbox xdotool xterm sway foot dbus-x11 python3-dbus python3-gi libfuse2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.CLI_NODE_VERSION }}
          cache: npm
          cache-dependency-path: device-app/ui/package-lock.json
      # The bundle's beforeBuildCommand builds the window with these.
      - name: UI packages
        working-directory: device-app/ui
        run: npm ci --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
      # Restored, never saved, as linux-e2e's.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: device-app/src-tauri
          shared-key: device-app-tmp-e2e-${{ matrix.runner }}
          save-if: false
      - name: Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked
      # The runtime in front is the bundler's whatever the profile: release-build.sh bundles the same way.
      - name: AppImage
        working-directory: device-app/src-tauri
        run: cargo tauri build --ci --debug --bundles appimage -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: fuse-device-${{ matrix.arch }}
          path: device-app/src-tauri/target/debug/bundle/appimage/*.AppImage
          retention-days: 1
          if-no-files-found: error

  # Each AppImage on a clean Ubuntu: this run's Device app, and Desktop's current release as people download it through
  # the public manifest. appimage-starts.sh prints `ok: <app> starts from its FUSE mount` or `FAILED: <app>: <why>`.
  # Until an app's step sets EXPECT=start (Tasks 48, 49), its FAILED is the finding and the step stays green. Report
  # puts each runner's row in the run's summary and in an annotation, so `gh run view` reads before and after.
  fuse-probe:
    needs: fuse-device-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    # pipefail: the probe's exit, not tee's, is the step's.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A display (xauth for xvfb-run), a session bus, X clients to find the window and read its class, `file`, jq.
      - run: sudo bash scripts/apt-install.sh xvfb xauth dbus-x11 xdotool x11-utils file jq
      - uses: actions/download-artifact@v4
        with:
          name: fuse-device-${{ matrix.arch }}
          path: ${{ runner.temp }}/fuse-device
      - name: The Device AppImage
        id: device
        run: |
          shopt -s nullglob
          found=("$RUNNER_TEMP"/fuse-device/*.AppImage)
          if [[ ${#found[@]} -ne 1 ]]; then echo "one AppImage, not ${#found[@]}"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/probe"
          mv "${found[0]}" "$RUNNER_TEMP/probe/Harness-Device.AppImage"
          chmod +x "$RUNNER_TEMP/probe/Harness-Device.AppImage"
      # Unpacked, so FUSE plays no part: the class the app-list entry's StartupWMClass names (Task 50).
      - name: The Device window's WM_CLASS
        run: >-
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session --
          bash device-app/scripts/e2e/appimage-starts.sh --wm-class "$RUNNER_TEMP/probe/Harness-Device.AppImage"
          | tee "$RUNNER_TEMP/probe/wm-class.log"
      # Only a file at the release's own CDN path, whose size and sha256 are the manifest's.
      - name: Desktop's public AppImage
        id: desktop
        if: ${{ !cancelled() }}
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          probe="$RUNNER_TEMP/probe"
          mkdir -p "$probe"
          curl -fsSL --retry 3 --max-time 60 -o "$probe/metadata.json" \
            https://storage.googleapis.com/s3-autonomous-upgrade-3/harness/desktop/metadata.json
          read -r url size sha < <(jq -r --arg key "desktop-linux-$ARCH" '.[$key] | "\(.url) \(.size) \(.sha256)"' \
            "$probe/metadata.json")
          pattern="^https://cdn\.autonomous\.ai/harness/desktop/[0-9]+\.[0-9]+\.[0-9]+/Harness-linux-$ARCH\.AppImage$"
          if [[ ! "$url" =~ $pattern ]]; then echo "desktop-linux-$ARCH is not a release AppImage: $url"; exit 1; fi
          curl -fsSL --retry 3 --max-time 600 -o "$probe/Harness.AppImage" "$url"
          if [[ "$(stat -c %s "$probe/Harness.AppImage")" != "$size" ]]; then echo "not the manifest's size"; exit 1; fi
          if [[ "$(sha256sum "$probe/Harness.AppImage" | cut -d' ' -f1)" != "$sha" ]]; then
            echo "not the manifest's sha256"
            exit 1
          fi
          chmod +x "$probe/Harness.AppImage"
          echo "note: Harness is $url"
      - name: No libfuse2
        id: nofuse
        if: ${{ !cancelled() }}
        run: |
          probe="$RUNNER_TEMP/probe"
          mkdir -p "$probe"
          mapfile -t installed < <(dpkg-query -W -f='${db:Status-Status} ${Package}\n' libfuse2 libfuse2t64 2>/dev/null \
            | awk '$1 == "installed" { print $2 }')
          if [[ ${#installed[@]} -gt 0 ]]; then sudo apt-get -q remove -y "${installed[@]}"; fi
          count="$(ldconfig -p | grep -c 'libfuse\.so\.2' || true)"
          if [[ "$count" != 0 ]]; then
            echo "FAILED: libfuse2 gone: ldconfig -p still names libfuse.so.2"
            exit 1
          fi
          echo "ok: libfuse2 gone (removed: ${installed[*]:-none, it was not installed})"
          echo yes >"$probe/libfuse2-gone"
          # A stock Ubuntu desktop has fusermount3 since 22.04; a runner may not.
          if command -v fusermount3 >/dev/null; then
            echo yes >"$probe/fusermount3-before"
          else
            echo no >"$probe/fusermount3-before"
            echo "note: fusermount3 was missing: fuse3 installed"
            sudo bash scripts/apt-install.sh fuse3
          fi
      - name: Harness Device starts
        if: ${{ !cancelled() && steps.nofuse.outcome == 'success' && steps.device.outcome == 'success' }}
        run: >-
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session --
          bash device-app/scripts/e2e/appimage-starts.sh "$RUNNER_TEMP/probe/Harness-Device.AppImage" "Harness Device"
          | tee "$RUNNER_TEMP/probe/device.log"
      - name: Harness starts
        if: ${{ !cancelled() && steps.nofuse.outcome == 'success' && steps.desktop.outcome == 'success' }}
        run: >-
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session --
          bash device-app/scripts/e2e/appimage-starts.sh "$RUNNER_TEMP/probe/Harness.AppImage" Harness
          | tee "$RUNNER_TEMP/probe/desktop.log"
      - name: Report
        if: ${{ always() }}
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          probe="$RUNNER_TEMP/probe"
          # The first line matching, with no `|` to break the table; `none` when the step never wrote one.
          line() { grep -m 1 -E "$1" "$probe/$2" 2>/dev/null | tr '|' '/' || echo none; }
          gone="$(cat "$probe/libfuse2-gone" 2>/dev/null || echo no)"
          before="$(cat "$probe/fusermount3-before" 2>/dev/null || echo unknown)"
          device="$(line '^(ok|FAILED):' device.log)"
          desktop="$(line '^(ok|FAILED):' desktop.log)"
          wm="$(line '^note: Harness Device (window|opened)' wm-class.log)"
          {
            echo "| runner | libfuse2 gone | fusermount3 before | Device runtime | Desktop runtime | Harness Device | Harness |"
            echo "|---|---|---|---|---|---|---|"
            echo "| $RUNNER_LABEL | $gone | $before | $(line '^note: Harness Device:' device.log) |" \
              "$(line '^note: Harness:' desktop.log) | $device | $desktop |"
            echo
            echo "$wm"
          } >>"$GITHUB_STEP_SUMMARY"
          echo "::notice title=fuse-probe $RUNNER_LABEL::libfuse2 gone: $gone; $device; $desktop; $wm"
