# Managed component dependencies (pulled by the IDF Component Manager on build).
dependencies:
  idf:
    version: ">=5.5.0"
  # LVGL v9 graphics library.
  # "~9.5.0", not "^9.2.0": the caret took any 9.x, and LVGL 9.6.0 (registry, 2026-09-16) tightened
  # the TLSF pool limit so the 512 KiB PSRAM pool below is refused and the firmware aborts at boot. The
  # lock that pinned 9.5.0 was gitignored, so every fresh checkout — a clone, CI, a worktree — resolved to
  # 9.6.0 and built a dial that boot-looped. Moving to 9.6 is a deliberate change to the pool setup, not
  # something a fresh build should do on its own.
  lvgl/lvgl: "~9.5.0"
  # Official CO5300 AMOLED panel driver (the controller on this board).
  espressif/esp_lcd_co5300: "*"
  # M5Stack CoreS3 port (DEVICE_BOARD_M5CORES3): ILI9342C/E panel + FT6336U touch. Unused (and
  # link-pruned) on the round-dial build; kept here so one project serves both boards.
  espressif/esp_lcd_ili9341: "*"
  espressif/esp_lcd_touch_ft5x06: "*"
  # Capacitive touch → LVGL pointer indev for swipe. BOTH controllers are linked in: the two dials
  # that ship differ here (CST9217 on one, CST816S on the other) and one image serves both — the
  # board is detected at boot (board/board.c) and the matching driver is opened. Pulls esp_lcd_touch.
  waveshare/esp_lcd_touch_cst9217: "*"
  espressif/esp_lcd_touch_cst816s: "^1.1.2"
  # Audio codec abstraction + ES7210 (ADC/mic) + ES8311 drivers for mic capture.
  espressif/esp_codec_dev: "*"
  # WebSocket client used by commander_client.c. Pinned below 1.3.0: newer
  # releases call esp_transport_ws_get_redir_uri(), which this IDF 5.5's
  # tcp_transport does not provide (no HTTP-redirect support).
  espressif/esp_websocket_client: "~1.2.0"
  # libsodium — the E2EE crypto stack (Ed25519, X25519, ristretto255 CPace, ChaCha20-Poly1305,
  # SHA-2, HKDF/HMAC). Backs devices/harness-device/firmware/main/e2ee/e2ee_core.c (byte-identical twin of the web/adapter
  # TS core). The Espressif port wires randombytes to the hardware RNG. See e2ee_core.h.
  espressif/libsodium: "^1.0.20"
  # IDF 5.5 moved mDNS out of the tree. CoreS3 `_harness-dial._tcp` uses this; unused on the dial.
  espressif/mdns: "~1.8.2"
