name: harness_max_bar
description: "Harness Max Demo V3: the bar's pages (Diego + one tap to talk) in Flutter, for the Orange Pi 4 Pro's 1480x320 bar."
publish_to: 'none'
version: 0.3.0+1

environment:
  sdk: ^3.13.7

# No third-party packages: the app must build for flutter-pi (no platform plugins) as well as macOS for development.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false

  assets:
    - assets/apps/
    - assets/pets/
    - assets/pets/claude/listen/
    - assets/pets/claude/relax/
    - assets/pets/claude/rest/
    - assets/pets/claude/work/
    - assets/pets/codex/idle/
    - assets/pets/codex/listen/
    - assets/pets/codex/review/
    - assets/pets/codex/waiting/
    - assets/pets/codex/work/
    - assets/pets/muse/listen/
    - assets/pets/muse/relax/
    - assets/pets/muse/rest/
    - assets/pets/muse/work/

  # Inter and Chakra Petch (SIL OFL 1.1, fonts/OFL-Inter.txt), the mockup's --sans and --num; JetBrains Mono (OFL,
  # fonts/OFL-JetBrainsMono.txt) for a permission prompt's command.
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
    - family: ChakraPetch
      fonts:
        - asset: fonts/ChakraPetch-Light.ttf
          weight: 300
        - asset: fonts/ChakraPetch-Medium.ttf
          weight: 500
        - asset: fonts/ChakraPetch-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: fonts/JetBrainsMono-Medium.ttf
          weight: 500
