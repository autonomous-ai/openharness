name: harness_mobile
description: "Harness viewer for iOS and Android."
publish_to: 'none'

version: 1.0.10+74

environment:
  sdk: ^3.13.0

# This package is SELF-CONTAINED: it depends on no other package in this repo.
# The app it runs — state, API, auth, WS/relay, E2EE, the viewer's stand-ins for
# the harness CLI, and the design system — lives under `lib/`, in the same
# folders the desktop app uses for it (`core/`, `state/`, `ws/`, `e2ee/`,
# `viewer/`, `terminal/`, `shared/`, `widgets/`). It was vendored from
# `../desktop` rather than imported from it: a path dependency made every
# desktop-only concern (the managed window, the self-updater, first-run
# provisioning) a concern of the phone build too, and pinned this package to a
# Flutter app that targets macOS and Linux.
dependencies:
  flutter:
    sdk: flutter
  # `compareNatural` — the desktop's name order, so `harness 9` sorts before `harness 10` on both.
  collection: ^1.19.1

  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^3.1.15
  flutter_riverpod: ^2.6.1

  # Backend HTTP (`api/`, `viewer/direct_auth_api.dart`) and the update manifest.
  dio: ^5.11.0
  # The relay socket every machine is reached over (`ws/`).
  web_socket_channel: ^3.0.3
  # "Continue with Google / Apple" opens the SSO page in an Android Custom Tab
  # (`viewer/sign_in_browser.dart`; iOS's is native, `SignInPageChannel`), and the terminal
  # opens links a program printed (`terminal/terminal_link_opener.dart`).
  url_launcher: ^6.3.2
  # X25519/HKDF/ChaCha20-Poly1305 for the end-to-end encryption this app
  # terminates itself, being a viewer (`e2ee/`).
  cryptography: ^2.9.0
  # Unicode normalisation for the viewer's password-linking PAKE: the same
  # password must hash identically whatever form the keyboard produced it in.
  unorm_dart: ^0.3.2
  # Keep the terminal core in-tree until the upstream circular-buffer ownership
  # fix is released. See third_party/xterm/lib/src/core/buffer/buffer.dart.
  xterm:
    path: third_party/xterm
  # The running build's version, shown in Settings and sent with analytics.
  package_info_plus: ^10.2.1
  path: ^1.9.1

  # The phone's second wire to a machine: the `terminal-v1` data channel the
  # harness CLI opens with werift on the desktop's behalf (lib/p2p/). Data
  # channels only — no microphone, and the camera it never opens is opened by
  # `image_picker` below instead, which is what the usage strings are for.
  # Pinned exactly: a native plugin, and libwebrtc's SCTP/SDP behaviour is
  # what the responder's werift has to agree with.
  flutter_webrtc: 1.6.2+hotfix.1

  # Sending a picture to an agent: the library sheet and the camera behind the
  # key bar's image button (`phone/terminal_key_bar.dart`). The bytes it returns
  # are re-encoded to PNG before they leave — see `terminal/image_transcode.dart`
  # for why the whole pipe past this point accepts nothing else.
  image_picker: ^1.2.3
  # Pictures in a Swarm chat shown in place (`swarm/swarm_attachment.dart`): each file kept in the
  # app's private temporary folder, one folder per account, for at most 7 days unopened and 200
  # files, and emptied on sign-out, Swarm off, account change and a Swarm's removal. Pinned
  # exactly: it decides where the account's files lie on the phone.
  flutter_cache_manager: 3.4.5
  # Sending any other file to an agent — a PDF, a log, a zip — from the same key: the system's own
  # document picker (Files on iOS, the Storage Access Framework on Android), which hands over one
  # file the person chose and asks for no storage permission. The bytes go out as the CLI's
  # `pasteFile` upload, which writes them on that machine and pastes the path.
  file_selector: ^1.1.0

  # Talking to an agent: tapping the terminal opens voice input before the
  # keyboard (`phone/voice_input_panel.dart`). This only RECORDS — 16 kHz mono
  # PCM, wrapped as WAV here — and the words come from the Harness backend's
  # `/api/voice/stt`, the same endpoint the dial's recordings go to. The OS
  # recognizer was tried first and misheard Vietnamese badly.
  record: ^7.1.1

  # An agent finishing while the phone is in a pocket: the OS notification the
  # dial's "wake the panel and open the drawer" becomes on a phone
  # (`lib/notify/system_notices.dart`). Local only — it fires from the machine socket,
  # so it reaches a phone whose app is still alive, not one iOS has suspended.
  flutter_local_notifications: ^22.2.0
  # Pairing with a desktop from before the 2026-10-12 onboarding, which shows an Add Phone QR code
  # (Computers ▸ "Or scan the QR code on your computer"), and Settings ▸ Sign in a computer
  # (`phone/welcome/scan_to_connect.dart`). The camera only while that screen is up.
  mobile_scanner: ^7.4.2
  # "On your computer, go to": the address is the button, and the system share sheet — AirDrop,
  # Messages or email — carries the download link to the computer (`phone/welcome/your_computer.dart`).
  # It is also how a picture or video a terminal printed leaves the app: Share on its preview
  # (`phone/media_preview_page.dart`).
  share_plus: ^13.3.0
  # "See how it works": the 30-second recording of the app the set-up page plays
  # (`phone/welcome/how_it_works_video.dart`, `assets/video/how_it_works.mp4`) — in place of an
  # interactive demo. It also plays a video a terminal printed, downloaded from the agent's machine
  # (`phone/media_preview_page.dart`).
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # The cache's own file abstraction, which `flutter_cache_manager` already brings in: tests keep
  # Swarm's image files in a temporary folder through it (`test/swarm/swarm_attachment_*`).
  file: 7.0.1
  # The p2p routing is all timers (retry, migration sweep, upgrade) — tests drive
  # them without waiting them out.
  fake_async: ^1.3.1
  # The on-device performance benchmark (`integration_test/perf_test.dart`,
  # driven by `test_driver/perf_driver.dart`): production widgets in a profile
  # build on a real phone, timed frame by frame. See `integration_test/README.md`.
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  # Keeps the phone from auto-locking during a benchmark run: synthetic touches
  # do not reset iOS's idle timer, and a lock mid-run suspends the app and drops
  # the driver's connection. A dev dependency — not in release builds — and
  # called only by `integration_test/perf/scenarios.dart`.
  wakelock_plus: ^1.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/engine-icons/
    # Each connected service's icon for Settings ▸ Connectors, PNG only (cli/scripts/connector-assets.mjs).
    - assets/connector-icons/
    # The real app icon, shown on the sign-in and bootstrapping screens.
    #
    # ⚠️ `assets/app_icon.svg` beside it is the MASTER this and all 20 launcher
    # slots are rendered from (`scripts/build_app_icons.py`), and is deliberately
    # NOT listed: Flutter cannot draw an SVG without a package this app does not
    # depend on, so bundling it would only add its weight to every install.
    - assets/app_icon.png
    # The marks on the welcome screen's two accounts (`phone/welcome/sign_in_provider_button.dart`),
    # PNG at 1x/2x/3x for the reason above: drawn from `desktop/assets/sign-in/*.svg` by
    # `scripts/render_svg.swift` (Apple's 814x1000 mark centred in a square tile first).
    - assets/sign-in/
    # The onboarding's one sound, when a computer joins (`lib/core/chime.dart`): two glass notes a
    # fifth apart, rendered by `scripts/make_joined_chime.py`. A WAV, which iOS's System Sound
    # Services plays and Android stores uncompressed.
    - assets/sound/
    # "See how it works" — recorded from the sample on a simulator by
    # `integration_test/demo_video_test.dart`, trimmed and encoded at 604px, ~630 KB.
    - assets/video/how_it_works.mp4
