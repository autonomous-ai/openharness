[package]
name = "harness-device"
# A placeholder no release reads: the release build sets its version through `--config`, so a local build never
# outranks a release.
version = "0.0.0"
edition = "2024"
# sysinfo 0.40, off macOS, needs 1.95; Tauri 2.12 needs 1.90.
rust-version = "1.95"

# Every rule lives in the library, so `cargo test --lib` reaches it without the window's bundle (ui/dist).
[lib]
name = "harness_device"
path = "src/lib.rs"

[[bin]]
name = "harness-device"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
url = "2"
# On every platform; only a release build calls it, on macOS, Windows and a Linux AppImage (update.rs).
tauri-plugin-updater = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSAppleEventDescriptor", "NSAppleScript", "NSArray", "NSAttributedString", "NSDictionary", "NSError", "NSNotification", "NSOperation", "NSString", "NSURL", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSApplication", "NSResponder", "NSRunningApplication", "NSWorkspace"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
# Accessibility, for the ChatGPT window's title (follow_macos.rs).
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "libc", "HIServices", "AXUIElement", "AXError"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "CFRunLoop", "CFString", "CFDictionary", "CFNumber", "CFNotificationCenter"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
sysinfo = "0.40"

# The app in front on X11 (front_x11.rs). With no feature it is the pure-Rust connection: no system library.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14"
# Whether a tray host is on the session bus (tray_host.rs). Already in Tauri's Linux tree.
dbus = "0.9"

# The Win32 calls (child processes, the app in front, the login item, the theme). Tauri's own copy: no new crate.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
# As `cargo tauri build` writes it back: any other form, and every build rewrites this line.
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
