[main]
term=foot
font=DejaVu Sans Mono:size=11,Symbols Nerd Font Mono:size=11
pad=0x0
initial-window-mode=fullscreen
app-id=hn
title=hn

[colors-dark]
background=101010
foreground=dddddd

[scrollback]
lines=0

[mouse]
hide-when-typing=yes

[bell]
# hn rings it when a harness out of sight is done or waits on you (tui/src/app.rs): a short sound,
# though hn is always the focused window here.
command=pw-play /usr/share/sounds/freedesktop/stereo/complete.oga
command-focused=yes

[key-bindings]
spawn-terminal=none
