# OS session keys: ordinary shells live in hn panes.
unbind d
unbind D
unbind C-z
bind W os-action wifi
bind U new-window -n Updates '/usr/bin/harness updates'
# Keep hn's normal installed status bar. A new tab is immediately a terminal.
set -g @hn-new-window shell
set -g @hn-animations off
set -g exit-empty off
set -g exit-unattached off
set -g destroy-unattached off
set -g detach-on-destroy off
