# Direct system actions remain available while trying an agent from USB.
source-file /usr/share/harness-os/tmux.conf
unbind U
bind I os-action install

# Share the window list's row; only this button owns the install click target.
set -g status-style 'fg=black,bg=green'
set -g window-status-style 'fg=black,bg=green'
set -g window-status-current-style 'fg=green,bg=black,bold'
set -g status-right-style 'fg=black,bg=green'
set -g status-right '#{?#{e|>=:#{client_width},80},Make Harness your OS.  ,}#[range=user|os-install bold][ Install Harness ]#[norange]'
set -g status-right-length 48
