# The keyboard hook includes applespi, but not its separate SPI host drivers.
# Keep built-in input available before encrypted root is unlocked. These are
# the pre-T2 controller families documented in Linux KEYBOARD_APPLESPI Kconfig.
case "$(cat /sys/class/dmi/id/product_name 2>/dev/null)" in
    MacBook8,1)
        MODULES+=(spi_pxa2xx_pci spi_pxa2xx_platform applespi)
        ;;
    MacBook9,1|MacBook10,1|MacBookPro13,[123]|MacBookPro14,[123])
        MODULES+=(intel_lpss_pci spi_pxa2xx_platform applespi)
        ;;
esac
