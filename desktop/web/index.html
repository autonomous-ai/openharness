<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your Harness workspace. Connect to your machines and work with your agents from the browser.">
  <meta name="theme-color" content="#141414">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="manifest.json">
  <!-- Drawn by docs/branding/app-logo/render-app-icon.swift; bump ?v= when the logo changes,
       since browsers keep a favicon long after its file is replaced. -->
  <link rel="icon" href="favicon.ico?v=5" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=5">
  <title>Harness</title>
  <!-- The app's script, first and at high priority: the loader in flutter_bootstrap.js waits for
       it, so it runs while the engine downloads instead of after. The website moves the href into
       the release's folder, where the loader asks for it (website/scripts/harness-web-assets.mjs).
       It marks itself done: from the cache it can finish before the loader's script is parsed,
       and a load event fired before anyone listened would leave the loader waiting forever. -->
  <link rel="preload" href="main.dart.js" as="script" fetchpriority="high" id="harness-main-preload"
        onload="this.dataset.done = 'loaded'" onerror="this.dataset.done = 'failed'">
  <!-- The page the visitor sees until Flutter's first frame: the app is megabytes of script
       and WebAssembly, so on a phone this is all there is for seconds. Plain HTML and CSS,
       nothing to fetch. It follows the palette the app will open in (Graphite, or the light
       Paper/Mist the visitor chose), not the system theme, which the app does not read. -->
  <style>
    html, body { margin: 0; height: 100%; background: #141414; color: #dedede; }
    html[data-theme="light"], html[data-theme="light"] body { background: #fafaf9; color: #1f1f1d; }
    #harness-splash {
      position: fixed; inset: 0; z-index: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; background: inherit;
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #harness-splash img { width: 72px; height: 72px; border-radius: 16px; }
    #harness-splash p { margin: 0; opacity: 0.72; animation: harness-splash-breath 1.8s ease-in-out infinite; }
    @keyframes harness-splash-breath { 50% { opacity: 0.38; } }
    @media (prefers-reduced-motion: reduce) { #harness-splash p { animation: none; } }
  </style>
  <noscript><style>#harness-splash { display: none; }</style></noscript>
  <script>
    (function () {
      // Same key and ids as AppearancePrefsStore on this origin (appearance_prefs_store.dart,
      // HarnessFileStore web prefix); the light palettes are Paper and Mist (color_palette.dart).
      try {
        var palette = localStorage.getItem('harness.web.v1.app_color_palette');
        if (palette === 'paper' || palette === 'mist') document.documentElement.dataset.theme = 'light';
      } catch (e) { /* storage blocked: the app opens in Graphite too */ }
    })();
  </script>
</head>

  <script>
    // Flutter fires this on window when its first frame is on screen.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('harness-splash');
      if (splash) splash.remove();
    }, { once: true });
  </script>
  <!-- iOS Safari zooms the page when an input under 16px takes focus, and
       Flutter's hidden editing input takes the terminal's smaller font: a tap
       on the tab menu zoomed the whole app. maximum-scale=1 stops that
       auto-zoom; iOS ignores it for pinch, so zooming by hand still works.
       Flutter swaps in its own viewport tag (maximum-scale=5) at startup, so
       the tag is re-pinned whenever one lands. Other platforms keep Flutter's. -->
  <script>
    (function () {
      var iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!iOS) return;
      var content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0';
      function pin() {
        document.querySelectorAll('meta[name="viewport"]').forEach(function (meta) {
          if (meta.content !== content) meta.content = content;
        });
      }
      pin();
      new MutationObserver(pin).observe(document.head, { childList: true });
    })();
  </script>
  <!-- Inline Flutter's generated loader so startup needs no extra script round trip. -->
  <script>{{flutter_bootstrap_js}}</script>
