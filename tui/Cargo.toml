[package]
name = "harness-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26.0"
crossterm = "0.29.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
nucleo = "0.5.0"
regex = "1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal", "process"] }
tokio-tungstenite = "0.30.0"
toml = { version = "0.8", default-features = false, features = ["parse"] }
unicode-width = "0.2.2"
uuid = { version = "1.26.1", features = ["v4"] }
