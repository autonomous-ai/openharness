[package]
name = "harness-tui"
version = "0.1.46"
edition = "2024"

[dependencies]
base64 = "0.22.1"
alacritty_terminal = "0.26.0"
harness-term = { path = "../term" }
# Shell widgets read /dev/tty while stdout carries the selected value. macOS
# kqueue cannot watch that device; Crossterm's tty reader uses poll/select.
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
regex = "1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal", "process"] }
tokio-tungstenite = "0.30.0"
toml = { version = "0.8", default-features = false, features = ["parse"] }
unicode-width = "0.2.2"
unicode-segmentation = "1.13"
libc = "0.2"
uuid = { version = "1.26.1", features = ["v4"] }
# Add phone: the pairing link as a QR code, drawn with half-block characters.
qrcodegen = "1.8"

[target.'cfg(windows)'.dependencies]
# The pipe's proof to and from the daemon (src/daemon.rs, cli/src/lib/windows/pipeAuth.ts).
hmac = "0.12"
sha2 = "0.10"
# What the vendored alacritty_terminal's pseudoconsole signals on (src/local_windows.rs).
polling = "3.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_Shell"] }

[dev-dependencies]
# Reads the drawn QR code back, so a test proves the phone would get the exact link.
rqrr = { version = "0.9", default-features = false }

# Retain tmux pane attributes unsupported by the upstream renderer.
[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
vte = { path = "vendor/vte" }
