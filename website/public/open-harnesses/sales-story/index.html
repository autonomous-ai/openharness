<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The quarter in focus</title><style>*{box-sizing:border-box}body{margin:0;padding:6%;background:#e6eeea;color:#294a3c;font-family:Arial,sans-serif}main{background:#fff;padding:7%;min-height:430px}header{display:flex;justify-content:space-between;gap:15px;align-items:center;color:#73877c;font-size:11px;letter-spacing:2px}select{font:inherit;border:0;background:#edf3ef;padding:9px;color:#294a3c}h1{font-size:clamp(25px,5vw,58px);font-weight:400;letter-spacing:-2px;margin:45px 0 12px}.summary{color:#728276;line-height:1.6;max-width:430px}.metric{font-size:35px;margin:24px 0 0}svg{width:100%;height:190px;overflow:visible;margin:10px 0}.labels{display:flex;justify-content:space-between;font-size:11px;color:#73877c}.note{font-size:11px;color:#73877c;margin-top:25px}button{border:0;background:transparent;color:#294a3c;padding:12px 0;cursor:pointer}</style><main><header><span>THE QUARTER IN FOCUS</span><select id="region" aria-label="Region"><option>All regions</option><option>North</option><option>South</option></select></header><h1 id="headline">A good kind of up.</h1><p class="summary" id="summary"></p><div class="metric" id="total"></div><svg viewBox="0 0 600 180" role="img" aria-label="Monthly sales in thousands of dollars"><path d="M0 160H600M0 90H600M0 20H600" stroke="#e7eee9" fill="none"/><path id="area" fill="#e6f1e9"/><path id="line" fill="none" stroke="#5f9476" stroke-width="3"/></svg><div class="labels"><span>JULY</span><span>AUGUST</span><span>SEPTEMBER</span></div><button id="download">Download sample CSV ↓</button><p class="note">Illustrative dataset · Revenue in USD · Explore the source in your fork</p></main><script>const data={'All regions':[42,47,51,48,61,57,68,72,67,79,83,91],North:[25,28,29,26,34,32,39,43,40,45,49,54],South:[17,19,22,22,27,25,29,29,27,34,34,37]};function draw(){const label=document.getElementById('region').value,d=data[label],max=Math.max(...d)*1.13,points=d.map((v,i)=>[i*600/11,165-v/max*155]),path=points.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' ');document.getElementById('line').setAttribute('d',path);document.getElementById('area').setAttribute('d',path+'L600 180L0 180Z');const total=d.reduce((a,b)=>a+b,0);document.getElementById('total').textContent='$'+total.toLocaleString()+',000';document.getElementById('summary').textContent=label+' finished the quarter '+Math.round((d[11]/d[0]-1)*100)+'% above the opening week. The final four weeks contributed '+Math.round(d.slice(-4).reduce((a,b)=>a+b,0)/total*100)+'% of the quarter’s revenue.'}document.getElementById('region').onchange=draw;document.getElementById('download').onclick=()=>{const blob=new Blob(['week,north,south\n'+data.North.map((v,i)=>[i+1,v*1000,data.South[i]*1000].join(',')).join('\n')],{type:'text/csv'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sample-sales.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};draw();</script></html>
