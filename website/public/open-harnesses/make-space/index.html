<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Make some space</title><style>*{box-sizing:border-box}body{margin:0;background:#f0633c;color:#281b1a;font-family:Arial,sans-serif}.poster{position:relative;height:calc(100vh - 110px);min-height:420px;padding:8%;overflow:hidden;display:flex;align-items:center;justify-content:center}.circle{position:absolute;width:55%;aspect-ratio:1;border-radius:50%;background:#f7bc75;top:10%;left:10%}h1{font:400 clamp(55px,13vw,135px)/.84 Georgia,serif;letter-spacing:-.075em;z-index:1;margin:0;position:relative;white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%}.caption{position:absolute;left:7%;bottom:6%;font-size:9px;letter-spacing:2px}form{display:flex;gap:15px;align-items:center;padding:20px 6%;background:#fff0da;min-height:110px;flex-wrap:wrap}label{font-size:10px;color:#715445;display:flex;flex-direction:column;gap:6px}input,select,button{font:inherit;border:0;background:transparent;color:#281b1a;font-size:12px;padding:8px}input{width:180px;background:#ffffff80}button{cursor:pointer}</style><main class="poster" id="poster"><div class="circle" id="circle"></div><h1 id="type">make<br>some<br>space.</h1><div class="caption">A LITTLE ROOM FOR YOUR OWN WORDS</div></main><form onsubmit="return false"><label>Your words<input id="words" value="make / some / space." maxlength="45"></label><label>Palette<select id="palette"><option>Apricot</option><option>Indigo</option><option>Forest</option></select></label><button id="export">Export SVG ↓</button></form><script>const palettes={Apricot:['#f0633c','#f7bc75','#281b1a'],Indigo:['#33399f','#b7b1e5','#f3ecd7'],Forest:['#294d3c','#869b6c','#f5e7b9']};function draw(){const colors=palettes[document.getElementById('palette').value];document.getElementById('poster').style.background=colors[0];document.getElementById('circle').style.background=colors[1];document.getElementById('type').style.color=colors[2];document.getElementById('type').textContent=document.getElementById('words').value.split('/').map(s=>s.trim()).join('\n')}document.getElementById('words').oninput=draw;document.getElementById('palette').onchange=draw;document.getElementById('export').onclick=()=>{const [bg,accent,ink]=palettes[document.getElementById('palette').value],escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c])),lines=document.getElementById('words').value.split('/').slice(0,4),svg='<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000"><rect width="800" height="1000" fill="'+bg+'"/><circle cx="330" cy="350" r="230" fill="'+accent+'"/><text x="180" y="340" font-family="Georgia,serif" font-size="125" letter-spacing="-7" fill="'+ink+'">'+lines.map((l,i)=>'<tspan x="180" dy="'+(i?120:0)+'">'+escape(l.trim())+'</tspan>').join('')+'</text></svg>',url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})),a=document.createElement('a');a.href=url;a.download='make-space.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};draw();</script></html>
