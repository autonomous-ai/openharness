<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pocket launch film</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#29243c;background:#e5def6}.stage{position:relative;min-height:460px;height:calc(100vh - 70px);padding:7%;overflow:hidden}.label{font-size:12px;letter-spacing:3px}.words{position:absolute;bottom:15%;left:7%;font-weight:700;font-size:clamp(32px,6vw,76px);line-height:1;letter-spacing:-.055em;max-width:53%}.phone{position:absolute;right:14%;top:19%;width:25%;min-width:125px;max-width:215px;aspect-ratio:.52;border:8px solid #353043;border-radius:36px;background:#fcfaff;padding:25px 14px;transform:rotate(10deg);box-shadow:18px 24px #b4a5dc60}.phone:before{content:'';display:block;width:35%;height:5px;background:#353043;border-radius:5px;margin:-14px auto 28px}.phone small{font-size:10px;color:#71687d}.phone strong{display:block;font-size:clamp(15px,2.5vw,27px);margin:10px 0}.bars{display:flex;gap:6px;height:90px;align-items:flex-end;margin-top:28px}.bars b{background:#a991da;width:15%;border-radius:4px 4px 0 0}.line{height:7px;background:#ebe5f5;margin:13px 0;border-radius:8px}.controls{display:flex;align-items:center;gap:18px;height:70px;padding:0 7%;background:#f5f1fc;font-size:12px}button{border:0;background:transparent;color:inherit;font:inherit;padding:10px;cursor:pointer}input{flex:1;min-width:0;accent-color:#65547e}.clock{min-width:74px;font-variant-numeric:tabular-nums}@media(max-width:480px){.stage{min-height:350px}.phone{right:9%;border-width:6px;padding:20px 10px}.bars{height:55px}.words{font-size:33px;bottom:14%}}</style>
<main class="stage"><div class="label">MEET POCKET.</div><div class="words" id="words">Small app.<br>Big<br>possibilities.</div><div class="phone"><small>Your balance</small><strong>$2,840.00</strong><div class="bars"><b style="height:30%"></b><b style="height:47%"></b><b style="height:39%"></b><b style="height:72%"></b><b style="height:60%"></b><b style="height:97%"></b></div><div class="line"></div><div class="line" style="width:75%"></div></div></main>
<div class="controls"><button id="play" aria-label="Play film">Play</button><input id="time" aria-label="Film position" type="range" min="0" max="30" step=".1" value="0"><span class="clock" id="clock">0:00 / 0:30</span></div>
<script>const play=document.getElementById('play'),time=document.getElementById('time'),words=document.getElementById('words');let running=false,last=0;function draw(){let t=Number(time.value);words.innerHTML=t<10?'Small app.<br>Big<br>possibilities.':t<23?'A little<br>more<br>clarity.':'Make room<br>for what<br>matters.';document.getElementById('clock').textContent='0:'+String(Math.floor(t)).padStart(2,'0')+' / 0:30';play.textContent=running?'Pause':'Play';play.setAttribute('aria-label',running?'Pause film':'Play film')}play.onclick=()=>{if(Number(time.value)>=30)time.value=0;running=!running;last=performance.now();draw()};time.oninput=draw;function frame(now){if(running){time.value=Math.min(30,Number(time.value)+(now-last)/1000);if(Number(time.value)>=30)running=false;draw()}last=now;requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></html>
