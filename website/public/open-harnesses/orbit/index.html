<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit</title><style>*{box-sizing:border-box}body{margin:0;background:#131d32;color:#b6c6df;font-family:Arial,sans-serif}header{padding:28px 6%;font-size:11px;letter-spacing:3px}canvas{display:block;width:100%;aspect-ratio:800/470;max-height:70vh;object-fit:contain}nav{padding:23px 6%;display:flex;align-items:center;justify-content:center;gap:25px;font-size:12px;flex-wrap:wrap}button{background:transparent;color:inherit;border:0;padding:12px;cursor:pointer;font:inherit}label{display:flex;gap:10px;align-items:center}input{accent-color:#d6b77c;max-width:120px}small{display:block;text-align:center;font-size:10px;color:#6e7d96;padding:15px}</style><header>ORBIT / A LITTLE PERSPECTIVE</header><canvas id="universe" width="800" height="470" aria-label="An interactive orbital illustration"></canvas><nav><button id="pause">Pause</button><label>Speed <input id="speed" type="range" min="0.1" max="3" value="1" step=".1"></label><label><input id="paths" type="checkbox" checked>Orbit paths</label></nav><small>Illustrative distances and periods · An orbital playground, not a scientific simulation</small><script>const c=document.getElementById('universe'),g=c.getContext('2d');let running=!matchMedia('(prefers-reduced-motion: reduce)').matches,t=0,last=0;const planets=[{r:75,size:7,rate:1.6,color:'#b67e71'},{r:145,size:11,rate:.9,color:'#90b5b7'},{r:230,size:16,rate:.5,color:'#b88c7c'},{r:315,size:10,rate:.27,color:'#7c96bd'}];function label(){document.getElementById('pause').textContent=running?'Pause':'Play'}label();document.getElementById('pause').onclick=()=>{running=!running;label()};function frame(now){if(running)t+=Math.min(now-last,100)*.0005*Number(document.getElementById('speed').value);last=now;g.fillStyle='#131d32';g.fillRect(0,0,800,470);g.save();g.translate(400,235);g.rotate(-.22);for(const p of planets){if(document.getElementById('paths').checked){g.strokeStyle='#34445e';g.lineWidth=1;g.beginPath();g.ellipse(0,0,p.r,p.r*.55,0,0,Math.PI*2);g.stroke()}let a=t*p.rate+p.r;g.fillStyle=p.color;g.beginPath();g.arc(Math.cos(a)*p.r,Math.sin(a)*p.r*.55,p.size,0,Math.PI*2);g.fill()}g.shadowColor='#efbb7535';g.shadowBlur=60;g.fillStyle='#efbb75';g.beginPath();g.arc(0,0,26,0,7);g.fill();g.restore();requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></html>
