<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunday planner</title><style>*{box-sizing:border-box}body{margin:0;background:#f2dccc;color:#584338;font-family:Arial,sans-serif;padding:6%}main{background:#fffdf8;padding:7%;min-height:500px}.eyebrow{font-size:10px;letter-spacing:2px;color:#9b806d}h1{font:400 clamp(28px,5vw,53px)/1.1 Georgia,serif;margin:20px 0 15px;letter-spacing:-1px}.intro{font-size:12px;color:#aa927f;margin-bottom:30px}.days{display:grid;grid-template-columns:1fr 1fr;gap:25px}h2{font-size:10px;letter-spacing:2px;font-weight:400;color:#b1957d;margin:0 0 12px}.task{display:flex;gap:8px;margin:10px 0;align-items:flex-start}.task input{accent-color:#9c876c;margin-top:4px}.task label{font-size:12px;line-height:1.6;outline-offset:3px;flex:1}.task input:checked+label{text-decoration:line-through;color:#b1a293}button{border:0;background:transparent;color:#a18974;font:inherit;cursor:pointer;padding:6px;font-size:12px}.add{padding:4px 0;font-size:11px}@media(max-width:480px){.days{grid-template-columns:1fr}body{padding:5%}}</style><main><div class="eyebrow">SUNDAY / THE WEEK AHEAD</div><h1>A little room<br>to breathe.</h1><p class="intro">Click a task to edit it. Leave some space, too.</p><div class="days" id="days"></div></main><script>const plan=[['MONDAY',['Sketch the new collection','Take a proper lunch break']],['TUESDAY',['Finish one small thing','Take the long way home']],['WEDNESDAY',['Make something just for fun']],['THURSDAY',['Read a few pages']],['FRIDAY',['Share the work']],['THE WEEKEND',['Leave this open']]];let count=0;function task(parent,text){const row=document.createElement('div');row.className='task';const input=document.createElement('input');input.type='checkbox';input.id='task-'+(++count);const label=document.createElement('label');label.htmlFor=input.id;label.contentEditable='true';label.textContent=text;label.setAttribute('aria-label','Edit task');const del=document.createElement('button');del.textContent='×';del.setAttribute('aria-label','Delete task');del.onclick=()=>row.remove();row.append(input,label,del);parent.append(row)}for(const [day,tasks]of plan){const section=document.createElement('section'),heading=document.createElement('h2'),list=document.createElement('div'),add=document.createElement('button');heading.textContent=day;add.textContent='+ Add a task';add.className='add';add.onclick=()=>{task(list,'Something to make time for');list.lastElementChild.querySelector('label').focus()};tasks.forEach(t=>task(list,t));section.append(heading,list,add);document.getElementById('days').append(section)}</script></html>
