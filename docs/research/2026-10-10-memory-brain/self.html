<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Sense of Self</title>
<style>
  :root {
    --bg: #030407;
    --ink: #eef2f8;
    --ink2: #b8c0ce;
    --dim: #7a8394;
    --faint: #4b5262;
    --gold: #ffe3ad;
    --sec: #9fd8ff;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --gutter: clamp(16px, 3vw, 44px);
    --col: min(30vw, 420px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); }
  body { font: 12px/1.5 var(--mono); -webkit-font-smoothing: antialiased; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 85% 80% at 50% 45%, transparent 55%, rgba(0, 0, 0, .5) 100%); }

  .col { position: fixed; left: var(--gutter); top: clamp(16px, 6.5vh, 64px); width: var(--col); }
  .kicker { font: 500 11px/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--sec); display: flex; gap: 12px; align-items: baseline; }
  .kicker .n { color: var(--faint); letter-spacing: .08em; }

  #whisper { opacity: 0; transition: opacity 1.1s ease; pointer-events: none; }
  #whisper.on { opacity: 1; }
  #whisper .t { font: 400 clamp(26px, 3vw, 42px)/1.1 var(--serif); color: #fbf6ea; letter-spacing: .01em; text-shadow: 0 0 30px rgba(255, 230, 190, .25); }
  #whisper .s { margin-top: 12px; color: var(--dim); font-size: 11px; letter-spacing: .04em; max-width: 34ch; }

  #caption { opacity: 0; transition: opacity .6s ease; pointer-events: none; }
  #caption.on { opacity: 1; }
  #cap-text { font: 400 clamp(20px, 2.35vw, 34px)/1.24 var(--serif); margin: 14px 0 24px; color: #fbf7ee; text-wrap: pretty; text-shadow: 0 0 26px rgba(255, 234, 196, .16); overflow-wrap: anywhere; }
  #cap-why-label { color: var(--dim); font-size: 11px; letter-spacing: .05em; margin-bottom: 7px; }
  #cap-why { list-style: none; margin: 0; padding: 0; }
  #cap-why li { display: grid; grid-template-columns: 12px 1fr auto; column-gap: 9px; padding: 4px 7px; margin: 0 -7px; border-radius: 5px; color: var(--ink2); transition: background .15s, color .15s; }
  #cap-why li.sel { background: rgba(255, 255, 255, .065); color: var(--ink); box-shadow: inset 2px 0 0 var(--gold); }
  #cap-why li .w { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #cap-why li .w small { color: var(--dim); font-size: 10.5px; margin-left: 6px; }
  #cap-why li .a { color: var(--faint); font-size: 10.5px; }
  #cap-why li.missing { color: var(--faint); }
  #cap-why li .q { grid-column: 2 / 4; font: italic 13px/1.4 var(--serif); color: var(--dim); margin-top: 3px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 4.5px; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .dot.ring { background: transparent; border: 1.5px solid currentColor; box-shadow: 0 0 6px currentColor; }
  .dot.diamond { border-radius: 1px; transform: rotate(45deg) scale(.85); }

  #recall { display: none; padding: 14px 16px 12px; margin: -14px -16px; background: rgba(4, 6, 11, .84); border: 1px solid rgba(255, 255, 255, .05); border-radius: 10px; width: calc(var(--col) + 120px); max-width: calc(100vw - 2 * var(--gutter)); }
  #recall.on { display: block; }
  #recall-sum { color: var(--dim); }
  #recall-list { list-style: none; margin: 10px 0 0; padding: 0; }
  #recall-list li { display: grid; grid-template-columns: 12px 1fr auto; column-gap: 9px; padding: 4px 7px; margin: 0 -7px; border-radius: 5px; color: var(--ink2); }
  #recall-list li.sel { background: rgba(255, 255, 255, .07); color: var(--ink); box-shadow: inset 2px 0 0 var(--gold); }
  #recall-list li .w { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #recall-list li .a { color: var(--faint); font-size: 10.5px; white-space: nowrap; }
  #recall-list li.head { color: var(--faint); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; padding-top: 9px; grid-template-columns: 1fr; }
  #recall-list li .w.serif { font: 13.5px/1.35 var(--serif); }
  mark { background: none; color: var(--gold); text-shadow: 0 0 10px rgba(255, 220, 150, .5); }

  #orb-label { position: fixed; left: 0; top: 0; max-width: min(340px, 44vw); padding: 10px 13px 11px; background: rgba(5, 7, 13, .78); border: 1px solid rgba(255, 255, 255, .07); border-radius: 9px; pointer-events: none; opacity: 0; transition: opacity .25s; will-change: transform; }
  #orb-label.on { opacity: 1; }
  #orb-label .m { color: var(--dim); font-size: 10.5px; letter-spacing: .03em; display: flex; gap: 7px; align-items: center; }
  #orb-label .m .dot { margin-top: 0; width: 7px; height: 7px; }
  #orb-label .t { font: 17px/1.25 var(--serif); color: #fbf7ee; margin: 5px 0 4px; }
  #orb-label .h { color: var(--ink2); font-size: 11px; }
  #orb-label .h div { font: italic 12.5px/1.35 var(--serif); color: var(--gold); opacity: .85; margin-top: 3px; }
  #orb-label .h.none { color: var(--faint); }

  #veil { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(2, 3, 6, .5), rgba(2, 3, 6, .88)); opacity: 0; pointer-events: none; transition: opacity .45s ease; }
  #veil.on { opacity: 1; }
  #panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(720px, calc(100vw - 32px)); max-height: min(80vh, 780px); display: none; flex-direction: column; background: linear-gradient(180deg, rgba(15, 18, 28, .97), rgba(7, 9, 15, .98)); border: 1px solid rgba(255, 255, 255, .08); border-radius: 14px; box-shadow: 0 30px 120px rgba(0, 0, 0, .65), 0 0 90px -10px var(--glow, rgba(255, 220, 160, .25)); overflow: hidden; }
  #panel.on { display: flex; }
  #panel::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--glow, #ffe3ad), transparent); opacity: .8; }
  #panel header { padding: 22px 28px 12px; }
  #panel .meta { display: flex; flex-wrap: wrap; gap: 4px 9px; align-items: center; font-size: 11px; color: var(--dim); letter-spacing: .03em; }
  #panel .meta .dot { margin-top: 0; }
  #panel h2 { font: 400 clamp(22px, 2.5vw, 32px)/1.2 var(--serif); margin: 10px 0 6px; color: #fbf7ee; overflow-wrap: anywhere; }
  #panel .desc { font: italic 15px/1.45 var(--serif); color: var(--ink2); margin: 0; }
  #panel .body { overflow: auto; padding: 6px 28px 22px; font: 15.5px/1.62 var(--serif); color: #d9dee8; overflow-wrap: anywhere; scrollbar-width: thin; scrollbar-color: #2a3040 transparent; }
  #panel .body p { margin: 0 0 .8em; }
  #panel .body h4 { font: 600 11px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin: 1.3em 0 .5em; }
  #panel .body .li { padding-left: 1.1em; text-indent: -1.1em; margin: 0 0 .35em; }
  #panel .body .li::before { content: "·  "; color: var(--dim); }
  #panel .body code { font: 12.5px var(--mono); background: rgba(255, 255, 255, .06); border-radius: 3px; padding: 1px 4px; }
  #panel .body pre { font: 12px/1.5 var(--mono); background: rgba(255, 255, 255, .04); border-radius: 6px; padding: 10px 12px; overflow: auto; white-space: pre-wrap; }
  #panel .body strong { color: #fff; font-weight: 600; }
  #panel .body .msg { display: grid; grid-template-columns: 12px 1fr; column-gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(255, 255, 255, .04); }
  #panel .body .msg .a { grid-column: 2; font: 10.5px var(--mono); color: var(--faint); }
  #panel .body .msg .x { grid-column: 2; font: 14px/1.45 var(--serif); color: var(--ink2); }
  #panel footer { border-top: 1px solid rgba(255, 255, 255, .06); padding: 11px 28px 14px; font-size: 11px; color: var(--dim); }
  #panel footer .b { font: italic 13.5px/1.4 var(--serif); color: var(--gold); margin-top: 4px; }
  #panel footer .p { color: var(--faint); margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #hint { position: fixed; left: var(--gutter); right: var(--gutter); bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; color: var(--faint); font-size: 11px; letter-spacing: .02em; pointer-events: none; white-space: nowrap; }
  #hint b { color: var(--dim); font-weight: 500; }
  #prompt { color: var(--ink); font-size: 13px; margin-right: 18px; }
  #prompt:empty { display: none; margin: 0; }
  #prompt .c { display: inline-block; width: 7px; height: 14px; margin-left: 2px; vertical-align: -2px; background: var(--gold); animation: blink 1.05s steps(1) infinite; }
  #prompt .p { color: var(--gold); margin-right: 8px; }
  @keyframes blink { 50% { opacity: 0; } }
  #status { overflow: hidden; text-overflow: ellipsis; }
  #toast { position: fixed; right: var(--gutter); top: 14px; color: var(--dim); font-size: 11px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #toast.on { opacity: 1; }
  #error { position: fixed; inset: 0; display: none; place-items: center; color: var(--dim); font-size: 12px; }
  @media (max-width: 1080px) { #status { display: none; } }
  @media (prefers-reduced-motion: reduce) { #prompt .c { animation: none; } }
</style>
</head>
<body>
<canvas id="scene" aria-label="Sense of Self: what your agents believe about you, held up by the memories in the lake below"></canvas>

<div id="vignette"></div>

<div id="whisper" class="col" aria-hidden="true">
  <div class="t">Sense of Self</div>
  <div class="s" id="whisper-s">what your agents believe about you, and the memories that hold it up</div>
</div>

<section id="caption" class="col" aria-live="polite">
  <div class="kicker"><span id="cap-section"></span><span class="n" id="cap-count"></span></div>
  <h1 id="cap-text"></h1>
  <div id="cap-why-label">why your agents believe this</div>
  <ol id="cap-why"></ol>
</section>

<section id="recall" class="col" aria-live="polite">
  <div class="kicker" id="recall-sum"></div>
  <ol id="recall-list"></ol>
</section>

<div id="orb-label" aria-live="polite">
  <div class="m"><span class="dot" id="ol-dot"></span><span id="ol-meta"></span></div>
  <div class="t" id="ol-title"></div>
  <div class="h" id="ol-holds"></div>
</div>

<div id="veil"></div>
<article id="panel" role="dialog" aria-modal="true" aria-labelledby="p-title">
  <header>
    <div class="meta" id="p-meta"></div>
    <h2 id="p-title"></h2>
    <p class="desc" id="p-desc"></p>
  </header>
  <div class="body" id="p-body" tabindex="-1"></div>
  <footer id="p-foot"></footer>
</article>

<div id="toast"></div>
<div id="error"></div>
<footer id="hint"><span><span id="prompt"></span><span id="keys"></span></span><span id="status"></span></footer>

<script src="memory-data.js"></script>
<script src="self.js"></script>
</body>
</html>
