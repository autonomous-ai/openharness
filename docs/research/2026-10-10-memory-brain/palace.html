<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind Palace</title>
<style>
  :root {
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --fg: #cfe6f1;
    --dim: #6b8592;
    --faint: #3a4d58;
    --cyan: #5ad7ff;
    --gold: #ffc982;
    --ink: #d8e7ee;
  }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg); font-family: var(--mono); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  #hud { pointer-events: none; }
  .quiet { position: fixed; pointer-events: none; font-size: 11px; letter-spacing: 0.02em; color: var(--dim); white-space: nowrap; }
  #where { top: 14px; left: 16px; color: #9cc3d3; font-size: 12px; text-shadow: 0 0 8px rgba(90, 215, 255, 0.35); }
  #where b { font-weight: 500; color: #e6f6ff; }
  #mode { top: 32px; left: 16px; color: var(--faint); }
  #keys { left: 0; right: 0; bottom: 12px; text-align: center; overflow: hidden; text-overflow: ellipsis; padding: 0 16px; }
  #keys kbd { font-family: var(--mono); color: #9fbccb; }
  #prompt { left: 0; right: 0; bottom: 36px; text-align: center; font-size: 14px; color: #eaf8ff; text-shadow: 0 0 10px rgba(90, 215, 255, 0.6); }
  #prompt .count { color: var(--dim); font-size: 11px; text-shadow: none; margin-left: 14px; }
  #prompt .caret { display: inline-block; width: 0.55em; height: 1.05em; vertical-align: -0.18em; background: #bff0ff; margin-left: 1px; animation: blink 1s steps(2, start) infinite; box-shadow: 0 0 8px rgba(90, 215, 255, 0.8); }
  @keyframes blink { to { visibility: hidden; } }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 12px; letter-spacing: 0.2em; }
  #loading::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); margin-right: 12px; box-shadow: 0 0 12px var(--cyan); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.2; } }

  #read { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center;
    background: radial-gradient(ellipse at 50% 40%, rgba(2, 14, 22, 0.80), rgba(0, 0, 0, 0.93)); }
  #read[hidden] { display: none; }
  #sheet { --accent: #5ad7ff; position: relative; box-sizing: border-box; width: min(88ch, calc(100vw - 48px)); max-height: calc(100vh - 72px); margin: 0 0 18px;
    overflow: auto; padding: 26px 32px 30px; border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
    background: linear-gradient(180deg, rgba(4, 14, 20, 0.92), rgba(1, 5, 8, 0.96));
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6), 0 0 28px color-mix(in srgb, var(--accent) 30%, transparent), inset 0 0 40px color-mix(in srgb, var(--accent) 7%, transparent);
    transform-origin: 0 0; scrollbar-width: thin; scrollbar-color: #24414f transparent; }
  #sheet.fly { transition: transform 420ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 300ms ease-out; }
  #r-kicker { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); opacity: 0.9; }
  #r-title { margin: 10px 0 6px; font-size: 22px; line-height: 1.3; color: #f2fbff; text-shadow: 0 0 14px color-mix(in srgb, var(--accent) 60%, transparent); }
  #r-meta { font-size: 11.5px; color: var(--dim); line-height: 1.6; }
  #r-meta span + span::before { content: "  ·  "; color: var(--faint); }
  #r-links { margin: 16px 0 4px; }
  #r-links:empty { display: none; }
  #r-links .head { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); margin: 12px 0 6px; }
  #r-links .link { font-size: 12.5px; color: #a9c4d1; padding: 5px 10px; margin: 2px -10px; border-left: 2px solid transparent; line-height: 1.45; }
  #r-links .link .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 9px; vertical-align: 1px; }
  #r-links .link.on { color: #fff; background: rgba(90, 215, 255, 0.08); border-left-color: var(--accent); }
  #r-links .link .sub { color: var(--dim); }
  #r-links .line { font-size: 13.5px; color: #e9dcc6; margin: 10px 0 2px; line-height: 1.5; }
  #r-body { margin-top: 18px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; line-height: 1.62; color: var(--ink);
    text-shadow: 0 0 7px color-mix(in srgb, var(--accent) 22%, transparent); }
  #r-body:empty { display: none; }
  #r-foot { margin-top: 18px; font-size: 10.5px; color: var(--faint); overflow-wrap: anywhere; }
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="Mind Palace: walk through your memories"></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
<div id="where" class="quiet"></div>
<div id="mode" class="quiet"></div>
<div id="prompt" class="quiet" aria-live="polite"></div>
<div id="keys" class="quiet"></div>
<div id="read" hidden>
  <div id="sheet" role="dialog" aria-modal="true">
    <div id="r-kicker"></div>
    <div id="r-title"></div>
    <div id="r-meta"></div>
    <div id="r-links"></div>
    <div id="r-body"></div>
    <div id="r-foot"></div>
  </div>
</div>
<div id="loading">remembering</div>
<script src="memory-data.js"></script>
<script src="palace.js"></script>
</body>
</html>
